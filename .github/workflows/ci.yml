name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-version-sync:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify Version Sync
        run: |
          python scripts/bump_version.py --sync
          git diff --exit-code || (echo "Version numbers out of sync! Run 'python scripts/bump_version.py --sync'" && exit 1)

  build-webui:
    name: Build WebUI & Validate Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Install dependencies
        working-directory: android-app
        run: npm ci
      - name: Compile frontend bundle
        working-directory: android-app
        run: npm run build
      - name: Verify WebUI build output
        run: |
          test -f android-app/dist/index.html
          test -d android-app/dist/assets

  build-elite:
    name: Compile Elite ARM Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Bootlin ARM Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchains
          key: bootlin-armv5-uclibc-2017.05
      - name: Install Bootlin ARMv5 uClibc Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          curl -sSL "https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2017.05-toolchains-1-1.tar.bz2" | tar -xjf - -C build/toolchains/
      - name: Compile elite_ui
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh elite
          file elite/bin/elite_ui
          ls -lh elite/bin/elite_ui elite/bin/elite_sync

  build-hub:
    name: Compile Hub MIPS Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Bootlin MIPS Toolchain
        id: cache-mips-toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchains
          key: bootlin-mips32-uclibc-2017.05
      - name: Install Bootlin MIPS uClibc Toolchain
        if: steps.cache-mips-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          curl -sSL "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--stable-2017.05-toolchains-1-1.tar.bz2" | tar -xjf - -C build/toolchains/
      - name: Compile Hub MIPS Binaries
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh hub
          file payload/bin/hub_daemon payload/bin/hub_rf
          ls -lh payload/bin/hub_* payload/bin/register_ehci payload/bin/eth_fix payload/bin/mknod
