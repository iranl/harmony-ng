name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  changes:
    # A pull request that only changes Markdown files no test reads (the roadmap, guides) skips
    # the builds and the firmware tests; every other change, and every push to main, runs them.
    # The rule is in .github/scripts/code_changed.sh (tested by tests/test_ci_code_changed.sh).
    name: Changed Files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Docs-only change?
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the checkout is the merge of the pull request into main: its first parent is main
          files=$(git diff --name-only HEAD^1 HEAD) || files=""
          code=$(printf '%s\n' "$files" | sh .github/scripts/code_changed.sh)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check-version-sync:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify Version Sync
        run: |
          python scripts/bump_version.py --sync
          git diff --exit-code || (echo "Version numbers out of sync! Run 'python scripts/bump_version.py --sync'" && exit 1)

  build-webui:
    name: Build WebUI & Validate Assets
    needs: changes
    # a failed or missing check runs the job anyway; only "false" skips it
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: 6.0.13
      - name: Build remote screen renderer (WebAssembly)
        run: tools/remote_render/build.sh --wasm android-app/public/assets
      - name: Install dependencies
        working-directory: android-app
        run: npm ci
      - name: Compile frontend bundle
        working-directory: android-app
        run: npm run build
      - name: Verify WebUI build output
        run: |
          test -f android-app/dist/index.html
          test -d android-app/dist/assets
          test -f android-app/dist/assets/remote_render.wasm

  build-remote:
    name: Compile Remote ARM Binaries
    needs: changes
    # a failed or missing check runs the job anyway; only "false" skips it
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Bootlin ARM Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: bootlin-armv5-uclibc-2017.05-9afe6d92b2fd
      - name: Install Bootlin ARMv5 uClibc Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          # Pinned by SHA-256 as well as by name (the cache step keeps whatever was fetched once)
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.bz2" "https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
          echo "9afe6d92b2fdb5eee75c90f776374d19aa1203d5679651b289a4030dc9982036  $RUNNER_TEMP/toolchain.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/toolchain.tar.bz2" -C build/toolchains/
      - name: Compile remote_ui
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh remote
          file remote/bin/remote_ui
          ls -lh remote/bin/remote_ui remote/bin/remote_sync
      - name: Build host screen renderer and render the empty home screen
        run: |
          tools/remote_render/build.sh
          mkdir -p build/tmp/remote-root
          build/tmp/remote-render/remote_render render --root build/tmp/remote-root -o build/tmp/activities.png
          test -s build/tmp/activities.png

  build-hub:
    name: Compile Hub MIPS Binaries
    needs: changes
    # a failed or missing check runs the job anyway; only "false" skips it
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache Bootlin MIPS Toolchain
        id: cache-mips-toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: bootlin-mips32-uclibc-2017.05-a75aeb0f82ea
      - name: Install Bootlin MIPS uClibc Toolchain
        if: steps.cache-mips-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          # Pinned by SHA-256 as well as by name (the cache step keeps whatever was fetched once)
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.bz2" "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
          echo "a75aeb0f82eaeaf1989a7dfdf80219486b5ed1470c29c6f253fbcf824922c29f  $RUNNER_TEMP/toolchain.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/toolchain.tar.bz2" -C build/toolchains/
      - name: Compile Hub MIPS Binaries
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh hub
          file payload/bin/hub_daemon payload/bin/hub_rf
          ls -lh payload/bin/hub_* payload/bin/register_ehci payload/bin/eth_fix payload/bin/mknod

  test-mock-system:
    # Firmware code (Hub daemons, remote UI, device scripts, web UI) built and run on the host
    # against mock hardware; Python only drives the tests. Runs on every change except one made of
    # Markdown files no test reads (job "changes" above). The host tools
    # have their own workflow (host-tools.yml). The tests are split in four groups that run on
    # separate machines at the same time (tests/run_mock_suite.sh, SUITE_GROUP).
    name: Firmware Tests (group ${{ matrix.group }} of 4)
    needs: changes
    # a failed or missing check runs the job anyway; only "false" skips it
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # The host gcc builds every test: a pinned image keeps it from changing under the suite
    # (implicit declarations are errors from gcc 14 on; the suite treats them as errors anyway)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install PyYAML (docs/openapi.yaml validation) and aioharmony (Logitech shim test)
        run: python -m pip install pyyaml aioharmony==1.0.8
      - name: Show the host compiler
        run: gcc --version
      - name: Run Firmware Test Suite (group ${{ matrix.group }} of 4)
        env:
          SUITE_GROUP: ${{ matrix.group }}
        run: |
          chmod +x tests/run_mock_suite.sh
          ./tests/run_mock_suite.sh
