name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0)'
        required: false
        default: ''
      bump:
        description: 'Semver bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare-version:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              TARGET_VER="${{ github.event.inputs.version }}"
            else
              TARGET_VER=$(python scripts/bump_version.py --bump ${{ github.event.inputs.bump }} | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            fi
            python scripts/bump_version.py --version "$TARGET_VER"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to v$TARGET_VER" || true
            git tag "v$TARGET_VER" || true
            git push origin "v$TARGET_VER" || true
            git push origin HEAD:${{ github.ref }} || true
            echo "version=$TARGET_VER" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            python scripts/bump_version.py --version "$TAG_VER"
            echo "version=$TAG_VER" >> $GITHUB_OUTPUT
          fi

  build-webui:
    name: Build WebUI & Gzip Assets
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Build Web Bundle
        working-directory: android-app
        run: |
          npm ci
          npm run build
      - name: Sync to payload/www & Gzip
        run: |
          mkdir -p payload/www
          cp -rf android-app/dist/* payload/www/
          python build/gzip_assets.py payload/www
      - name: Archive WebUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui-assets
          path: payload/www/

  build-elite:
    name: Build Elite ARM Binaries
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Cache Bootlin ARM Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchains
          key: bootlin-armv5-uclibc-2017.05
      - name: Install Bootlin ARMv5 uClibc Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          curl -sSL "https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2017.05-toolchains-1-1.tar.bz2" | tar -xjf - -C build/toolchains/
      - name: Compile Elite Binaries & Extended BusyBox
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh elite
          ./build/build_busybox.sh arm
          mkdir -p build/output/elite
          [ -f elite/bin/busybox ] && cp -f elite/bin/busybox build/output/elite/ || true
          [ -f elite/bin/dropbearmulti_musl ] && cp -f elite/bin/dropbearmulti_musl build/output/elite/ || true
          [ -f elite/b64dec_tiny ] && cp -f elite/b64dec_tiny build/output/elite/ || true
          if [ -f build/output/elite/dropbearmulti_musl ]; then
            for link in dropbear dropbearkey scp; do
              cp -f build/output/elite/dropbearmulti_musl "build/output/elite/$link"
            done
          fi
          if [ -f build/output/elite/busybox ]; then
            cp -f build/output/elite/busybox build/output/elite/mknod
          fi
          (cd build/output/elite && gzip -c -9 elite_ui > elite_ui.gz)
          ls -lh build/output/elite
      - name: Archive Elite Binaries
        uses: actions/upload-artifact@v7
        with:
          name: elite-binaries
          path: build/output/elite/

  build-hub:
    name: Build Hub MIPS Binaries
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Cache Bootlin MIPS Toolchain
        id: cache-mips-toolchain
        uses: actions/cache@v4
        with:
          path: build/toolchains
          key: bootlin-mips32-uclibc-2017.05
      - name: Install Bootlin MIPS uClibc Toolchain
        if: steps.cache-mips-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          curl -sSL "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--stable-2017.05-toolchains-1-1.tar.bz2" | tar -xjf - -C build/toolchains/
      - name: Compile Hub Binaries & Extended BusyBox
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh all
          ./build/build_busybox.sh mips
          mkdir -p build/output/hub
          cp -f payload/bin/hub_* payload/bin/register_ehci payload/bin/eth_fix payload/bin/mknod build/output/hub/
          [ -f payload/bin/busybox ] && cp -f payload/bin/busybox build/output/hub/ || true
          [ -f tools/bin/dropbearmulti_mips ] && cp -f tools/bin/dropbearmulti_mips build/output/hub/dropbearmulti || true
          (cd build/output/hub && gzip -c -9 hub_daemon > hub_daemon.gz)
          ls -lh build/output/hub
      - name: Archive Hub Binaries
        uses: actions/upload-artifact@v7
        with:
          name: hub-binaries
          path: build/output/hub/

  build-android:
    name: Build Android APK
    needs: [prepare-version, build-webui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Build Web Bundle & Sync Capacitor
        working-directory: android-app
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build Android APKs via Gradle
        working-directory: android-app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            export ANDROID_KEYSTORE_PATH="release.jks"
          fi
          ./gradlew assembleDebug assembleRelease
          rm -f app/release.jks

      - name: Collect APKs
        run: |
          mkdir -p build/output/apk
          cp -f android-app/android/app/build/outputs/apk/debug/*.apk build/output/apk/harmony-hub-debug.apk || true
          if ls android-app/android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp -f android-app/android/app/build/outputs/apk/release/*-release.apk build/output/apk/harmony-hub-release.apk
          else
            cp -f android-app/android/app/build/outputs/apk/release/*.apk build/output/apk/harmony-hub-release-unsigned.apk || true
          fi
      - name: Archive Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/output/apk/

  publish-release:
    name: Package and Publish GitHub Release
    needs: [prepare-version, build-webui, build-elite, build-hub, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch git tags
        run: git fetch --tags --force
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Package Release Assets
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          RELEASE_DIR="$PWD/release_assets"
          mkdir -p "$RELEASE_DIR"
          
          # 1. Package Complete Hub Release Bundle
          if [ -d artifacts/hub-binaries ]; then
            mkdir -p staging_hub/bin staging_hub/scripts staging_hub/modules staging_hub/www staging_hub/tools
            cp -rf artifacts/hub-binaries/* staging_hub/bin/
            rm -f staging_hub/bin/hub_daemon.gz 2>/dev/null || true
            cp -rf payload/scripts/* staging_hub/scripts/
            [ -d payload/modules ] && cp -rf payload/modules/*.ko staging_hub/modules/ || true
            if [ -d artifacts/webui-assets ]; then
              cp -rf artifacts/webui-assets/* staging_hub/www/
            fi
            cp -f build/deploy_hub.sh build/deploy_hub.ps1 build/backup_hub.sh staging_hub/
            cp -f tools/root_hub_usb.py tools/harmony_hid.py tools/harmony_firmware.py staging_hub/tools/
            
            (cd staging_hub && zip -r "${RELEASE_DIR}/harmony-hub-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-hub-v${VERSION}.tar.gz" -C staging_hub .
            cp -f artifacts/hub-binaries/hub_daemon.gz "${RELEASE_DIR}/hub_daemon_v${VERSION}.gz"
          fi

          # 2. Package Complete Elite Release Bundle
          if [ -d artifacts/elite-binaries ]; then
            mkdir -p staging_elite/bin staging_elite/tools
            cp -rf artifacts/elite-binaries/* staging_elite/bin/
            rm -f staging_elite/bin/elite_ui.gz staging_elite/bin/elite_ui.ota.gz 2>/dev/null || true
            cp -f elite/rcS.local staging_elite/
            cp -f elite/deploy_elite.py elite/deploy_elite.ps1 staging_elite/
            cp -f tools/root_remote_usb.py tools/harmony_hid.py tools/harmony_firmware.py elite/setup_remote.py staging_elite/tools/
            
            (cd staging_elite && zip -r "${RELEASE_DIR}/harmony-elite-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-elite-v${VERSION}.tar.gz" -C staging_elite .
            cp -f artifacts/elite-binaries/elite_ui.gz "${RELEASE_DIR}/elite_ui_v${VERSION}.gz"
          fi
          
          # 3. Package WebUI Bundle
          if [ -d artifacts/webui-assets ]; then
            (cd artifacts/webui-assets && zip -r "${RELEASE_DIR}/harmony-webui-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-webui-v${VERSION}.tar.gz" -C artifacts/webui-assets .
          fi
          
          # 4. Copy APKs
          if [ -d artifacts/android-apks ]; then
            cp -f artifacts/android-apks/*.apk "${RELEASE_DIR}/"
          fi
          
          # 5. Generate SHA256 checksums
          cd "${RELEASE_DIR}"
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
          ls -lh
      - name: Generate Release Notes
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          python scripts/generate_release_notes.py --version "$VERSION" --output release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          gh release create "v${VERSION}" release_assets/* \
            --title "HarmonyNG v${VERSION}" \
            --notes-file release_notes.md

      - name: Publish to OTA Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.prepare-version.outputs.version }}"
          python scripts/publish_ota.py --version "$VERSION" --push --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" --branch ota