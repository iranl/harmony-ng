name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0)'
        required: false
        default: ''
      bump:
        description: 'Semver bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare-version:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Update Curated CA Certificate Bundle
        id: ca_bundle
        run: |
          python scripts/update_ca_bundle.py
      - name: Determine Version
        id: ver
        run: |
          # This tree builds the Linux 6.18 system (v4, shared uClibc-ng): a 3.x release from it
          # would reach v3 Hubs (branch ota) with binaries their C library cannot run
          require_v4() {
            case "${1#v}" in
              [4-9].*|[1-9][0-9]*.*) ;;
              *) echo "::error::v${1#v}: this tree releases v4 or later only"; exit 1 ;;
            esac
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.version }}" ]; then
              TARGET_VER="${{ github.event.inputs.version }}"
            else
              # --next only prints: --bump would write the files and raise versionCode, and the
              # --version below raises it again (the repository then had +2, the APK +1)
              TARGET_VER=$(python scripts/bump_version.py --next ${{ github.event.inputs.bump }})
            fi
            require_v4 "$TARGET_VER"
            python scripts/bump_version.py --version "$TARGET_VER"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): bump version to v$TARGET_VER" || true
            git tag "v$TARGET_VER" || true
            git push origin "v$TARGET_VER" || true
            git push origin HEAD:${{ github.ref }} || true
            echo "version=$TARGET_VER" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            require_v4 "$TAG_VER"
            python scripts/bump_version.py --version "$TAG_VER"
            if [ -n "$(git status --porcelain payload/config/cacert.pem)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add payload/config/cacert.pem
              git commit -m "chore(certs): update curated ca bundle [skip ci]" || true
              git push origin HEAD:${{ github.event.repository.default_branch || 'main' }} || true
            fi
            echo "version=$TAG_VER" >> $GITHUB_OUTPUT
          fi

  build-webui:
    name: Build WebUI & Gzip Assets
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: 6.0.13
      - name: Build remote screen renderer (WebAssembly)
        run: tools/remote_render/build.sh --wasm android-app/public/assets
      - name: Build Web Bundle
        working-directory: android-app
        run: |
          npm ci
          npm run build
      - name: Sync to payload/www & Gzip
        run: |
          mkdir -p payload/www
          cp -rf android-app/dist/* payload/www/
          python build/gzip_assets.py payload/www
      - name: Archive WebUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui-assets
          path: payload/www/

  build-remote:
    name: Build Remote ARM Binaries
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Cache Bootlin ARM Toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: bootlin-armv5-uclibc-2017.05-9afe6d92b2fd
      - name: Install Bootlin ARMv5 uClibc Toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          # Pinned by SHA-256 as well as by name (the cache step keeps whatever was fetched once)
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.bz2" "https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
          echo "9afe6d92b2fdb5eee75c90f776374d19aa1203d5679651b289a4030dc9982036  $RUNNER_TEMP/toolchain.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/toolchain.tar.bz2" -C build/toolchains/
      - name: Compile Remote Binaries & Extended BusyBox
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh remote
          ./build/build_busybox.sh arm
          mkdir -p build/output/remote
          [ -f remote/bin/busybox ] && cp -f remote/bin/busybox build/output/remote/ || true
          [ -f remote/bin/dropbearmulti_musl ] && cp -f remote/bin/dropbearmulti_musl build/output/remote/ || true
          [ -f remote/b64dec_tiny ] && cp -f remote/b64dec_tiny build/output/remote/ || true
          if [ -f build/output/remote/dropbearmulti_musl ]; then
            for link in dropbear dropbearkey scp; do
              cp -f build/output/remote/dropbearmulti_musl "build/output/remote/$link"
            done
          fi
          if [ -f build/output/remote/busybox ]; then
            cp -f build/output/remote/busybox build/output/remote/mknod
          fi
          (cd build/output/remote && gzip -c -9 remote_ui > remote_ui.gz)
          ls -lh build/output/remote
      - name: Archive Remote Binaries
        uses: actions/upload-artifact@v7
        with:
          name: remote-binaries
          path: build/output/remote/

  build-hub:
    name: Build Hub MIPS Binaries
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Cache Bootlin MIPS Toolchain
        id: cache-mips-toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: bootlin-mips32-uclibc-2017.05-a75aeb0f82ea
      - name: Install Bootlin MIPS uClibc Toolchain
        if: steps.cache-mips-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          # Pinned by SHA-256 as well as by name (the cache step keeps whatever was fetched once)
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.bz2" "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
          echo "a75aeb0f82eaeaf1989a7dfdf80219486b5ed1470c29c6f253fbcf824922c29f  $RUNNER_TEMP/toolchain.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/toolchain.tar.bz2" -C build/toolchains/
      - name: Compile Hub Binaries & Extended BusyBox
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh all
          # static BusyBox for stock Hubs (tools/root_hub_usb.py, tools/backup_hub.py): payload/bin/busybox
          LINK=static ./build/build_busybox.sh mips
          mkdir -p build/output/stock_tools
          cp -f payload/bin/busybox build/output/stock_tools/busybox
          cp -f tools/bin/dropbearmulti_mips build/output/stock_tools/dropbearmulti_mips
          mkdir -p build/output/hub
          cp -a payload/bin/hub_* payload/bin/register_ehci payload/bin/eth_fix payload/bin/mknod build/output/hub/ 2>/dev/null || cp -f payload/bin/hub_* payload/bin/register_ehci payload/bin/eth_fix payload/bin/mknod build/output/hub/
          # shared BearSSL for plugins (scripts/publish_ota.py puts it in hub_ota.tar.gz as lib/)
          cp -f payload/lib/libbearssl.so.0 build/output/hub/
          (cd build/output/hub && gzip -c -9 hub_daemon > hub_daemon.gz)
          ls -lh build/output/hub
          # BTstack dev build (info logs) and the two .debug files: a release asset of their own,
          # never in the bundle or the OTA package
          mkdir -p build/output/btstack_dev_asset
          cp -f build/output/hub_btstack_dev build/output/hub_btstack_dev.debug build/output/hub_btstack.debug build/output/btstack_dev_asset/
      - name: Archive Hub Binaries
        uses: actions/upload-artifact@v7
        with:
          name: hub-binaries
          path: build/output/hub/
      - name: Archive Stock Hub Tools
        uses: actions/upload-artifact@v7
        with:
          name: stock-tools
          path: build/output/stock_tools/
      - name: Archive BTstack Dev Build
        uses: actions/upload-artifact@v7
        with:
          name: hub-btstack-dev
          path: build/output/btstack_dev_asset/

  build-kernel6:
    name: Build Linux 6.18 Hub System (kernel + root file system)
    needs: prepare-version
    runs-on: ubuntu-latest
    env:
      KVER: '6.18.65'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Cache Bootlin MIPS Toolchain
        id: cache-mips-toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains
          key: bootlin-mips32-uclibc-2017.05-a75aeb0f82ea
      - name: Install Bootlin MIPS uClibc Toolchain
        if: steps.cache-mips-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/toolchains
          curl -fsSL -o "$RUNNER_TEMP/toolchain.tar.bz2" "https://toolchains.bootlin.com/downloads/releases/toolchains/mips32/tarballs/mips32--uclibc--stable-2017.05-toolchains-1-1.tar.bz2"
          echo "a75aeb0f82eaeaf1989a7dfdf80219486b5ed1470c29c6f253fbcf824922c29f  $RUNNER_TEMP/toolchain.tar.bz2" | sha256sum -c -
          tar -xjf "$RUNNER_TEMP/toolchain.tar.bz2" -C build/toolchains/
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu flex bison bc xz-utils u-boot-tools squashfs-tools pkg-config
      - name: Cache kernel source
        id: cache-kernel-src
        uses: actions/cache@v5
        with:
          path: ~/kbuild6/linux-${{ env.KVER }}.tar.xz
          key: linux-${{ env.KVER }}
      - name: Download kernel source
        if: steps.cache-kernel-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kbuild6
          # build/build_kernel6.sh checks its SHA-256
          curl -fsSL -o ~/kbuild6/linux-$KVER.tar.xz "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz"
      - name: Build the system tools, kernel and root file system
        run: |
          chmod +x build/*.sh
          ./build/compile_all.sh util
          LINK=static ./build/compile_all.sh util
          ./build/build_busybox.sh mips
          ./build/build_minimal_dropbear.sh
          ./build/build_wpa_supplicant.sh
          ./build/build_bluez_tools.sh
          ./build/build_e2fsprogs.sh
          WORK="$RUNNER_TEMP/kwork" ./build/build_kernel6.sh
          STAGE="$RUNNER_TEMP/rootfs" ./build/build_rootfs6.sh
          # what tools/install_kernel6.py needs, in the layout of the release bundle (kernel6/)
          mkdir -p build/output/kernel6_asset/static
          cp -f build/output/kernel6/harmony-hub-flash.uImage build/output/kernel6/harmony-hub-rootfs.sqfs build/output/kernel6_asset/
          cp -f build/output/kernel6/static/hub_util build/output/kernel6_asset/static/
          for s in rc.sh udhcpc.sh modprobe.sh usb_gadget.sh; do tr -d '\r' < build/kernel6/$s > build/output/kernel6_asset/$s; done
          ls -lR build/output/kernel6_asset
      - name: Archive Linux 6.18 System
        uses: actions/upload-artifact@v7
        with:
          name: kernel6-images
          path: build/output/kernel6_asset/

  build-android:
    name: Build Android APK
    needs: [prepare-version, build-webui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Sync Version
        run: python scripts/bump_version.py --version ${{ needs.prepare-version.outputs.version }}
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: 'android-app/package-lock.json'
      - name: Build Web Bundle & Sync Capacitor
        working-directory: android-app
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build Android APKs via Gradle
        working-directory: android-app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
            export ANDROID_KEYSTORE_PATH="release.jks"
          fi
          ./gradlew assembleDebug assembleRelease
          rm -f app/release.jks

      - name: Collect APKs
        run: |
          mkdir -p build/output/apk
          cp -f android-app/android/app/build/outputs/apk/debug/*.apk build/output/apk/harmony-hub-debug.apk || true
          if ls android-app/android/app/build/outputs/apk/release/*-release.apk 1> /dev/null 2>&1; then
            cp -f android-app/android/app/build/outputs/apk/release/*-release.apk build/output/apk/harmony-hub-release.apk
          else
            cp -f android-app/android/app/build/outputs/apk/release/*.apk build/output/apk/harmony-hub-release-unsigned.apk || true
          fi
      - name: Archive Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/output/apk/

  publish-release:
    name: Package and Publish GitHub Release
    needs: [prepare-version, build-webui, build-remote, build-hub, build-kernel6, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch git tags
        run: git fetch --tags --force
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Package Release Assets
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          RELEASE_DIR="$PWD/release_assets"
          mkdir -p "$RELEASE_DIR"
          
          # 1. Package Complete Hub Release Bundle
          if [ -d artifacts/hub-binaries ]; then
            mkdir -p staging_hub/bin staging_hub/scripts staging_hub/www staging_hub/tools
            cp -rf artifacts/hub-binaries/* staging_hub/bin/
            rm -f staging_hub/bin/hub_daemon.gz 2>/dev/null || true
            cp -rf payload/scripts/* staging_hub/scripts/
            if [ -d artifacts/webui-assets ]; then
              cp -rf artifacts/webui-assets/* staging_hub/www/
            fi
            cp -f build/deploy_hub.py staging_hub/
            printf '%s\n' "$VERSION" > staging_hub/VERSION
            # static BusyBox and Dropbear for a stock Hub (tools/root_hub_usb.py looks in tools/bin)
            if [ -d artifacts/stock-tools ]; then
              mkdir -p staging_hub/tools/bin
              cp -f artifacts/stock-tools/* staging_hub/tools/bin/
            fi
            cp -f tools/root_hub_usb.py tools/harmony_hid.py tools/harmony_firmware.py tools/migrate_hub_configs.py tools/backup_hub.py tools/restore_stock.py tools/factory_reset.py tools/ssh_hostkeys.py tools/icon_pack.py tools/install_kernel6.py tools/rollback_kernel6.py staging_hub/tools/
            # the Linux 6.18 system for tools/install_kernel6.py (bundle layout: kernel6/)
            if [ -d artifacts/kernel6-images ]; then
              mkdir -p staging_hub/kernel6
              cp -rf artifacts/kernel6-images/* staging_hub/kernel6/
              chmod 755 staging_hub/kernel6/static/hub_util staging_hub/kernel6/*.sh
            fi
            if [ -d payload/config ]; then
              mkdir -p staging_hub/config
              cp -rf payload/config/* staging_hub/config/
            fi
            
            (cd staging_hub && zip -r "${RELEASE_DIR}/harmony-hub-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-hub-v${VERSION}.tar.gz" -C staging_hub .
            cp -f artifacts/hub-binaries/hub_daemon.gz "${RELEASE_DIR}/hub_daemon_v${VERSION}.gz"
          fi
          if [ -d artifacts/hub-btstack-dev ]; then
            tar -czf "${RELEASE_DIR}/hub_btstack_dev_v${VERSION}.tar.gz" -C artifacts/hub-btstack-dev .
          fi

          # 2. Package Complete Remote Release Bundle
          if [ -d artifacts/remote-binaries ]; then
            mkdir -p staging_remote/bin staging_remote/tools staging_remote/drivers/windows/rndis
            cp -rf artifacts/remote-binaries/* staging_remote/bin/
            rm -f staging_remote/bin/remote_ui.gz staging_remote/bin/remote_ui.ota.gz 2>/dev/null || true
            cp -f remote/rcS.local remote/init.sh remote/remote_watchdog.sh remote/safe_reboot.sh remote/factory_reset.sh staging_remote/
            cp -f remote/deploy_remote.py staging_remote/
            cp -f tools/harmony_hid.py tools/harmony_firmware.py tools/usb_state.py tools/setup_remote_driver.ps1 tools/factory_reset.py tools/ssh_hostkeys.py remote/setup_remote.py staging_remote/tools/
            cp -rf drivers/windows/rndis/* staging_remote/drivers/windows/rndis/

            (cd staging_remote && zip -r "${RELEASE_DIR}/harmony-remote-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-remote-v${VERSION}.tar.gz" -C staging_remote .
            cp -f artifacts/remote-binaries/remote_ui.gz "${RELEASE_DIR}/remote_ui_v${VERSION}.gz"
          fi
          
          # 3. Package WebUI Bundle
          if [ -d artifacts/webui-assets ]; then
            (cd artifacts/webui-assets && zip -r "${RELEASE_DIR}/harmony-webui-v${VERSION}.zip" .)
            tar -czvf "${RELEASE_DIR}/harmony-webui-v${VERSION}.tar.gz" -C artifacts/webui-assets .
          fi
          
          # 4. Copy APKs
          if [ -d artifacts/android-apks ]; then
            cp -f artifacts/android-apks/*.apk "${RELEASE_DIR}/"
          fi
          
          # 5. Generate SHA256 checksums
          cd "${RELEASE_DIR}"
          sha256sum * > sha256sums.txt
          cat sha256sums.txt
          ls -lh
      - name: Generate Release Notes
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          python scripts/generate_release_notes.py --version "$VERSION" --output release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          gh release create "v${VERSION}" release_assets/* \
            --title "HarmonyNG v${VERSION}" \
            --notes-file release_notes.md

      - name: Publish to OTA Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 release key (64 hex characters): signs manifest.json, Hubs refuse unsigned updates
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ needs.prepare-version.outputs.version }}"
          # scripts/publish_ota.py ships the system image from build/output/kernel6 (kernel6/ in the manifest)
          mkdir -p build/output/kernel6
          cp -f artifacts/kernel6-images/harmony-hub-flash.uImage artifacts/kernel6-images/harmony-hub-rootfs.sqfs build/output/kernel6/
          # v4 (Linux 6.18) releases go to ota4 and point v3 Hubs at them (VERSION_V4 on ota). Never
          # ota itself from this tree (prepare-version refuses a 3.x version already)
          case "${VERSION#v}" in
            [4-9].*|[1-9][0-9]*.*) ;;
            *) echo "::error::v${VERSION#v} is not a v4 release: not published"; exit 1 ;;
          esac
          python scripts/publish_ota.py --version "${VERSION#v}" --require-signature --push --remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" --branch ota4 --v4-pointer-branch ota