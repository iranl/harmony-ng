      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                name: {type: string}
                type: {type: string}
                icon: {type: string}
                order: {type: integer}
                startSequence: {type: array}
                stopSequence: {type: array}
              required: [id, name]
            example:
              id: "123456"
              name: Watch TV
              type: Custom
              icon: tv.png
              order: 1
              startSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOn
                - type: Delay
                  delay: 1500
              stopSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOff
      responses:
        '200':
          description: Activity saved
          content:
            application/json:
              example:
                ok: true

