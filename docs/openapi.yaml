      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              activityId: "123456"
              state: switching
              progress: 50
              step: 2
              totalSteps: 4
      responses:
        '200':
          description: Progress broadcasted
          content:
            application/json:
              example:
                ok: true

  /api/activity-save:
    post:
