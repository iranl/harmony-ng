    get:
      tags:
        - RF & Elite Remote
      summary: Elite remote firmware update status
      responses:
        '200':
          description: Remote OTA transfer status
          content:
            application/json:
              example:
                in_progress: false
                slot: 1
                status: 0
                sent_bytes: 0
                total_bytes: 0
                sent_chunks: 0
                total_chunks: 0
                error: ""

  /api/rf/ota-start:
    post:
      tags:
        - RF & Elite Remote
      summary: Start Elite remote firmware update over RF
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Remote update started
          content:
            application/json:
              example:
                status: started
                ok: true
        '409':
          description: Update already in progress

  /api/ui-remote-layout:
    get:
      tags:
        - UI Remote Layout
      summary: Get customized web and touch UI remote button layouts
      description: Retrieves layout definitions stored in /data/harmony/web_remote_layouts.json.
      responses:
        '200':
          description: Layout configuration
          content:
            application/json:
              example:
                ok: true
                layouts: {}
    post:
      tags:
        - UI Remote Layout
      summary: Save web and touch UI remote button layout configuration
      description: Persists layout definitions to /data/harmony/web_remote_layouts.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              layouts:
                "123456":
                  grid: []
      responses:
        '200':
          description: Layout configuration saved
          content:
            application/json:
              example:
                ok: true

  /api/elite-mapping:
    get:
      tags:
        - RF & Physical Remotes
      summary: Get physical remote button mapping (Elite, Companion, Smart Control)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Remote slot number (1 or 2)
      responses:
        '200':
          description: Mapping array
          content:
            application/json:
              example:
                ok: true
                mappings: []

  /api/elite-mapping-save:
    post:
      tags:
        - RF & Physical Remotes
      summary: Save physical remote button mapping (Elite, Companion, Smart Control)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Remote slot number (1 or 2)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                ok: true

  /api/remote-mapping-copy:
    post:
      tags:
        - RF & Physical Remotes
      summary: Copy physical remote button mapping from one slot to another
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 2]
          description: Source remote slot
        - name: to
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 2]
          description: Destination remote slot
      responses:
        '200':
          description: Mapping copied
          content:
            application/json:
              example:
                ok: true
                message: Copied mapping from slot 1 to slot 2

  /api/mqtt-status:
    get:
      tags:
        - Network & MQTT
      summary: MQTT client connection state
      responses:
        '200':
          description: Broker connection metadata
          content:
            application/json:
              example:
                ok: true
                connected: true
                host: 192.168.1.50
                port: 1883
                username: homeassistant
                clientId: harmony_hub
                baseTopic: harmony/hub

  /api/mqtt-save:
    post:
      tags:
        - Network & MQTT
      summary: Configure MQTT broker connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                host: {type: string}
                port: {type: integer, default: 1883}
                username: {type: string}
                password: {type: string}
                baseTopic: {type: string, default: "harmony/hub"}
                clientId: {type: string}
              required: [host]
            example:
              enabled: true
              host: 192.168.1.50
              port: 1883
              username: homeassistant
              password: password
              baseTopic: harmony/hub
              clientId: harmony_hub
      responses:
        '200':
          description: MQTT settings saved
          content:
            application/json:
              example:
                ok: true

  /api/wifi-scan:
    get:
      tags:
        - Network & MQTT
      summary: Scan for available 2.4GHz Wi-Fi networks
      responses:
        '200':
          description: List of discovered Wi-Fi access points
          content:
            application/json:
              example:
                ok: true
                networks:
                  - ssid: MyWiFiNetwork
                    bssid: "7c:10:c9:b6:ae:58"
                    signal: -45
                    channel: 1
                    frequency: 2412
                    security: WPA2
                    flags: "[WPA2-PSK-CCMP][ESS]"

  /api/wifi-test:
    post:
      tags:
        - Network & MQTT
      summary: Test Wi-Fi association without saving configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: {type: string}
                password: {type: string}
                open: {type: integer, default: 0}
                hidden: {type: integer, default: 0}
                keep_password: {type: integer, default: 0}
              required: [ssid]
            example:
              ssid: MyWiFiNetwork
              password: SecretPassword
      responses:
        '200':
          description: Wi-Fi connection test succeeded
          content:
            application/json:
              example:
                ok: true
                message: Wi-Fi test connection successful
        '400':
          description: Wi-Fi connection test failed
          content:
            application/json:
              example:
                ok: false
                error: "Authentication failed: incorrect Wi-Fi password"

  /api/wifi-save:
    post:
      tags:
        - Network & MQTT
      summary: Save Wi-Fi credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: {type: string}
                password: {type: string}
                apply: {type: string, default: "apply"}
              required: [ssid]
            example:
              ssid: MyWiFiNetwork
              password: SecretPassword
              apply: apply
      responses:
        '200':
          description: Wi-Fi updated
          content:
            application/json:
              example:
                ok: true
                message: Wi-Fi settings saved

  /api/ethernet-save:
    post:
      tags:
        - Network & MQTT
      summary: Configure USB Ethernet adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eth_mode: {type: string, enum: [dhcp, static], default: dhcp}
                eth_ip: {type: string}
                eth_netmask: {type: string, default: 255.255.255.0}
                eth_gateway: {type: string}
                eth_dns: {type: string}
                apply: {type: string, default: "apply"}
            example:
              eth_mode: dhcp
              eth_ip: 192.168.1.100
              eth_netmask: 255.255.255.0
              eth_gateway: 192.168.1.1
              eth_dns: 192.168.1.1
              apply: apply
      responses:
        '200':
          description: Ethernet configuration saved
          content:
            application/json:
              example:
                ok: true
                message: Ethernet configuration saved

  /api/update-status:
    get:
      tags:
        - Updates & Maintenance
      summary: Firmware & software version details
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              example:
                ok: true
                current_version: 1.0.4
                version: 1.0.4
                local_version: "v1.0.4 (a1b2c3d)"
                remote_version: v1.0.4
                commit: a1b2c3d
                build_time: "Oct 21 2026 13:00:00"
                fw_version: 4.15.600
                firmware: 4.15.600
                rf_version: "0x20 CC2544"
                bt_version: "BTstack v1.5 (UART)"
                arch: "mips (AR9344)"
                update_available: false

  /api/update-check:
    get:
      tags:
        - Updates & Maintenance
      summary: Check online for firmware updates
      responses:
        '200':
          description: Check result
          content:
            application/json:
              example:
                ok: true
                current_version: 1.0.4
                message: Hub binaries and WebUI are up to date (v1.0.4).
                has_update: false

  /api/update-apply:
    post:
      tags:
        - Updates & Maintenance
      summary: Trigger OTA update application
      responses:
        '200':
          description: Update started in background
          content:
            application/json:
              example:
                ok: true
                status: applying
                message: Software update triggered. Hub services restarting in background.

  /export/{target}:
    get:
      tags:
        - Backup & Restore
      summary: Export configuration bundle or table
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            enum: [bundle, devices, activities, settings, mqtt, network, wifi, bluetooth, bt_remote_map, elite_remote_map, ui_remote_layout, auth, hub_id]
          example: bundle
      responses:
        '200':
          description: Configuration snapshot
          content:
            application/json:
              example:
                version: 1
                timestamp: 1792584000
                devices: {...}
                activities: {...}
                settings: {...}

  /import:
    post:
      tags:
        - Backup & Restore
      summary: Import configuration bundle or section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: {type: string, default: "bundle"}
                payload: {type: object}
              required: [target, payload]
            example:
              target: bundle
              payload:
                devices: {...}
                activities: {...}
                settings: {...}
      responses:
        '200':
          description: Configuration imported and applied
          content:
            application/json:
              example:
                ok: true

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication for multi-user RBAC.
        When authentication is enabled on the Hub, requests can supply the `Authorization: Basic <base64(user:pass)>` header.
        Users can have `admin` or `user` roles.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token (Session or PAT)
      description: |
        OAuth2 Bearer Token Authentication.
        Supports in-memory session tokens (`hht_...` generated via `/api/auth/token`) and persistent Personal Access Tokens (`pat_...` generated via `/api/auth/tokens`).
        Supply header `Authorization: Bearer <token>`.
    digestAuth:
      type: http
      scheme: digest
      description: |
        HTTP Digest Authentication (RFC 7616 / RFC 2617) with SHA-256.
        Standard curl, Postman, Home Assistant digest authentication without sending plaintext credentials over the wire.
