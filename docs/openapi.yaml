            application/json:
              example:
                ok: true

  /api/rf:
    get:
      tags:
        - RF & Remote
      summary: CC2544 RF subsystem status
      description: |
        Proxied to hub_rf (port 8092). Returns remote RF status, paired slots, battery telemetry, and RF link statistics (frames_rx, acked_sent, acked_ok, retries, naks, last_seen_s).
      responses:
        '200':
          description: RF status
          content:
            application/json:
              example:
                running: true
                ok: true
                fw_version: "v1.00"
                paired: true
                rf_address: "12345678"
                hub_rf_address: "12345678"
                pairing_active: false
                sync_pending: false
                sync_pending_slot: 0
                sync_pending_diff: ""
                hub_config_version: 3
                ota:
                  in_progress: false
                  slot: 0
                  status: 0
                  sent_bytes: 0
                  total_bytes: 0
                  sent_chunks: 0
                  total_chunks: 0
                  error: ""
                slots:
                  - slot: 1
                    name: "Harmony Companion (Slot 1)"
                    active: true
                    in_sync: true
                    address: "12345678"
                    rf_address: "12345678"
                    model: "Harmony Companion"
                    has_screen: false
                    supports_ota: false
                    sw_version: "N/A"
                    config_version: 0
                    battery:
                      percent: 95
                      charging: false
                      voltage_mv: 3020
                    link:
                      frames_rx: 1520
                      acked_sent: 412
                      acked_ok: 398
                      retries: 14
                      naks: 9
                      last_seen_s: 2
                  - slot: 2
                    name: "Harmony Elite (Slot 2)"
                    active: true
                    in_sync: true
                    address: "87654321"
                    rf_address: "87654321"
                    model: "elite"
                    has_screen: true
                    supports_ota: true
                    sw_version: "v2.0.2"
                    remote_id: "20141001120000-000002"
                    config_version: 3
                    battery:
                      percent: 78
                      charging: false
                      voltage_mv: 3840
                    link:
                      frames_rx: 210
                      acked_sent: 85
                      acked_ok: 82
                      retries: 3
                      naks: 1
                      last_seen_s: 14

  /api/rf/status-changed:
    post:
      tags:
        - RF & Remote
      summary: Internal. hub_rf pushes its status object when it changed
      description: |
        Loopback only. hub_rf posts the GET /api/rf/status object whenever it changed (at most
        once a second); the daemon emits an rf_status WebSocket event when the object differs from
        the last one (link counters and battery.voltage_mv ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              example:
                ok: true
                changed: true
        '400':
          description: Body is not a JSON object
        '403':
          description: Not from loopback

  /api/rf/pair:
    get:
      tags:
        - RF & Remote
      summary: Start RF pairing beacon
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Pairing started
          content:
            application/json:
              example:
                status: pairing_started
    post:
      tags:
        - RF & Remote
      summary: Start RF pairing beacon (POST)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Pairing started
          content:
            application/json:
              example:
                status: pairing_started

  /api/rf/sleep:
    get:
      tags:
        - RF & Remote
      summary: Put paired remote to sleep (Suspend-to-RAM)
      description: Broadcasts or directs RF_MSG_SLEEP_REQ (0x1D) command over CC2544 RF to trigger immediate Suspend-to-RAM on battery-powered touchscreen remotes.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: Remote slot (0 for all active remotes, 1 for slot 1, 2 for slot 2)
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress
    post:
      tags:
        - RF & Remote
      summary: Put paired remote to sleep (POST)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress

  /api/rf/wake:
    post:
      tags:
        - RF & Remote
      summary: Turn a paired remote's screen on over RF
      description: Sends RF_MSG_WAKE (0x30, ACK'd) to the remote, which turns its screen on (or restarts its idle timeout when the screen is on) as a key press would. Tries for about 10 s in the background and logs whether the remote acknowledged it. A remote in deep standby (suspended to RAM on battery) does not receive it; it reports again at its next hourly alarm or key press.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Remote slot
      responses:
        '202':
          description: Wake request accepted (status waking), or a wake for a remote is already running (status already_waking)
          content:
            application/json:
              example:
                status: waking
                slot: 1
                ok: true
        '400':
          description: The remote in this slot is a Companion (no screen)
        '409':
          description: RF OTA update in progress
        '500':
          description: The background worker could not be started

