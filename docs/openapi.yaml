  /api/rf/sleep:
    get:
      tags:
        - RF & Elite Remote
      summary: Put paired Elite remote to sleep (Suspend-to-RAM)
      description: Broadcasts or directs RF_MSG_SLEEP_REQ (0x1D) command over CC2544 RF to trigger immediate Suspend-to-RAM on battery-powered Elite remotes.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: Remote slot (0 for all active remotes, 1 for slot 1, 2 for slot 2)
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress
    post:
      tags:
        - RF & Elite Remote
      summary: Put paired Elite remote to sleep (POST)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress

