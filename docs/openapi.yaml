  /api/bt-mouse:
    post:
      tags:
        - Bluetooth HID
      summary: Send Bluetooth mouse movement, clicks, or scroll
      description: |
        Sends HID Report ID 3 mouse packets to the connected host via /tmp/bthid_input.
        Supports continuous delta streaming or named actions (click, down, up, wheel). Also available under /api/v1/bt/mouse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dx:
                  type: integer
                  description: Relative X movement delta
                  default: 0
                dy:
                  type: integer
                  description: Relative Y movement delta
                  default: 0
                wheel:
                  type: integer
                  description: Vertical scroll wheel delta
                  default: 0
                buttons:
                  type: integer
                  description: Button bitmask (1=Left, 2=Right, 4=Middle)
                  default: 0
                action:
                  type: string
                  enum: [click, down, up, wheel]
                  description: Named mouse action
                button:
                  type: string
                  enum: [left, right, middle]
                  default: left
                target:
                  type: string
                  description: Target Bluetooth host BD_ADDR
            example:
              dx: 15
              dy: -5
              buttons: 0
              wheel: 0
      responses:
        '200':
          description: Mouse event processed
          content:
            application/json:
              example:
                ok: true

  /api/bt/reconnect:
    post:
      tags:
        - Bluetooth HID
      summary: Trigger Bluetooth host reconnection
      description: Spawns the background reconnect worker (bt_reconnect.sh) to re-establish connection with paired hosts. Also available as /bt/reconnect.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: Target BD_ADDR or deviceId (optional, connects all if omitted)
                duration:
                  type: integer
                  description: Connection attempt timeout in seconds
                  default: 30
                delay:
                  type: integer
                  description: Delay before starting reconnection in seconds
                  default: 0
            example:
              target: "AA:BB:CC:DD:EE:FF"
              duration: 30
              delay: 0
      responses:
        '200':
          description: Reconnect triggered
          content:
            application/json:
              example:
                ok: true
                message: Bluetooth reconnect triggered

