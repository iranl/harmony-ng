              properties:
                ssid: {type: string}
                password: {type: string}
                apply: {type: string, default: "apply"}
              required: [ssid]
            example:
              ssid: MyWiFiNetwork
              password: SecretPassword
              apply: apply
      responses:
        '200':
          description: Wi-Fi updated
          content:
            application/json:
              example:
                ok: true
                message: Wi-Fi settings saved

  /api/ethernet-save:
    post:
      tags:
        - Network & MQTT
      summary: Configure USB Ethernet adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eth_mode: {type: string, enum: [dhcp, static], default: dhcp}
                eth_ip: {type: string}
                eth_netmask: {type: string, default: 255.255.255.0}
                eth_gateway: {type: string}
                eth_dns: {type: string}
                apply: {type: string, default: "apply"}
            example:
              eth_mode: dhcp
              eth_ip: 192.168.1.100
              eth_netmask: 255.255.255.0
              eth_gateway: 192.168.1.1
              eth_dns: 192.168.1.1
              apply: apply
      responses:
        '200':
          description: Ethernet configuration saved
          content:
            application/json:
              example:
                ok: true
                message: Ethernet configuration saved

  /api/update-status:
    get:
      tags:
        - Updates & Maintenance
      summary: Firmware & software version details
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              example:
                ok: true
                current_version: 1.0.4
                version: 1.0.4
                local_version: "v1.0.4 (a1b2c3d)"
                remote_version: v1.0.4
                commit: a1b2c3d
                build_time: "Oct 21 2026 13:00:00"
                fw_version: 4.15.600
                firmware: 4.15.600
                rf_version: "0x20 CC2544"
                bt_version: "BTstack v1.5 (UART)"
                arch: "mips (AR9344)"
                update_available: false

  /api/update-check:
    get:
      tags:
        - Updates & Maintenance
      summary: Check online for firmware updates
      description: Queries GitHub releases or local update state. Also available under /api/update-check-state.
      responses:
        '200':
          description: Check result
          content:
            application/json:
              example:
                ok: true
                current_version: "2.1.1"
                message: Hub binaries and WebUI are up to date (v2.1.1).
                has_update: false
    post:
      tags:
        - Updates & Maintenance
      summary: Check online for firmware updates (custom repository or version)
      description: Checks for updates against a specific GitHub repository, API token, or target version.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                  description: Target GitHub repository owner/name
                token:
                  type: string
                  description: GitHub personal access token (optional)
                remote_version:
                  type: string
                  description: Expected remote version override
            example:
              repo: "iranl/harmony-ng"
              remote_version: "2.1.1"
      responses:
        '200':
          description: Check result
          content:
            application/json:
              example:
                ok: true
                current_version: "2.1.1"
                version: "2.1.1"
                remote_version: "2.1.1"
                update_available: false

  /api/update-apply:
    post:
      tags:
        - Updates & Maintenance
      summary: Trigger OTA update application
      responses:
        '200':
          description: Update started in background
          content:
            application/json:
              example:
                ok: true
                status: applying
                message: Software update triggered. Hub services restarting in background.

  /export/{target}:
    get:
      tags:
        - Backup & Restore
      summary: Export configuration bundle or table
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            enum: [bundle, devices, activities, settings, mqtt, network, wifi, bluetooth, bt_remote_map, elite_remote_map, ui_remote_layout, auth, hub_id]
          example: bundle
      responses:
        '200':
          description: Configuration snapshot
          content:
            application/json:
              example:
                version: 1
                timestamp: 1792584000
                devices: {...}
                activities: {...}
                settings: {...}

  /import:
    post:
      tags:
        - Backup & Restore
      summary: Import configuration bundle or section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: {type: string, default: "bundle"}
                payload: {type: object}
              required: [target, payload]
            example:
              target: bundle
              payload:
                devices: {...}
                activities: {...}
                settings: {...}
      responses:
        '200':
          description: Configuration imported and applied
          content:
            application/json:
              example:
                ok: true

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication for multi-user RBAC.
        When authentication is enabled on the Hub, requests can supply the `Authorization: Basic <base64(user:pass)>` header.
        Users can have `admin` or `user` roles.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token (Session or PAT)
      description: |
        OAuth2 Bearer Token Authentication.
        Supports in-memory session tokens (`hht_...` generated via `/api/auth/token`) and persistent Personal Access Tokens (`pat_...` generated via `/api/auth/tokens`).
        Supply header `Authorization: Bearer <token>`.
    digestAuth:
      type: http
      scheme: digest
      description: |
        HTTP Digest Authentication (RFC 7616 / RFC 2617) with SHA-256.
        Standard curl, Postman, Home Assistant digest authentication without sending plaintext credentials over the wire.
