openapi: 3.1.0
info:
  title: Harmony Hub Control API
  version: 2.5.3
  description: |
    REST and WebSocket API for the open-source **Harmony Hub** firmware and **Harmony remote** RF daemon.
    
    Runs natively on port `8089` on Atheros AR9344 MIPS hardware. Transparently proxies `/api/rf/*` calls to the `hub_rf` daemon on port `8092`.
    
    ### Testing Locally
    Use the **Servers** dropdown or "Try it out" to send requests directly to your Harmony Hub.
    The Hub announces itself over mDNS as `harmony-ng-<hub_id>.local` (port 8089).
    "Try it out" works only when this page is opened from the Hub itself or from `localhost`:
    a request a browser sends for a page of another origin is answered `403`
    `{"ok":false,"error":"Cross-site request refused"}` (API.md, "Requests from web pages").
    Clients outside a browser (`curl`, scripts) are not affected.

    ### Authentication
    Authentication is off after install: until an admin turns it on (API.md 11), every client on
    the LAN is admin and no credentials are needed, hence the empty alternative in the global
    `security`. Once it is on, every route under `/api/` (and the legacy `/ir/`, `/bt/`,
    `/export/`, `/import`, `/wifi`, `/ethernet`, `/system`, `/mqtt` names) needs `basicAuth` or
    `bearerAuth`, except `POST /api/auth/token` and `GET /health`. Accounts with the `user` role may
    call only the routes listed in API.md 11.5. Requests from the Hub itself (127.0.0.1) are
    always admin.

    Without valid credentials such a route answers `401` `{"ok":false,"error":"Unauthorized"}`.
    A `user` account gets `403` `{"ok":false,"error":"Forbidden: Admin access required"}` on
    every route that is not in this list (all other routes are admin only):
    `GET` `/api/status`, `/api/auth/me`, `/api/activities`, `/api/activity`,
    `/api/current_activity`, `/api/devices`, `/api/inventory`, `/api/icons`,
    `/api/icons/archive`, `/assets/icons.tar.gz`, `/api/custom-icons`, `/api/ui-remote-layout`;
    `POST` `/api/auth/logout`, `/api/activity`, `/api/activity-start`, `/api/poweroff`,
    `/api/activity-stop`, `/api/activity-cancel`, `/api/ir-send`, `/ir/send`, `/api/ir-raw`,
    `/api/button-press`, `/api/mqtt-publish`, `/api/bt-mouse`, `/api/v1/bt/mouse`.
    The other names of `/api/activity-cancel` (`/api/activity-reset`, `/api/interlock-reset`)
    are not in the list and need the admin role.

    ### Replies every route can give
    These are not repeated under each operation: `401` and `403` as above; `413`
    `Request body too large` for a body over 64 KB (2 MB for `POST /import` and
    `POST /api/custom-icons`, 256 KB for `/api/rf-mapping-save`, `/api/remote-mapping-save` and
    `POST /api/ui-remote-layout`); `400` `Bad request` for a body shorter than its
    `Content-Length`; `404` `{"ok":false,"error":"Not Found"}` for an unknown route or a method
    the route does not take. These replies are JSON objects with `ok: false` and `error`.

    The `/api/rf/*` routes are served by `hub_rf`: one request (headers and body) may be at
    most 4095 bytes (`413`, or `400` `Request body incomplete`), and when `hub_rf` does not
    run, every `/api/rf/*` request, whatever its method, is answered `200` with the
    "stopped" status object shown under `GET /api/rf`, so check its `running` field.
servers:
  - url: http://{hubIp}:8089
    description: Configurable Harmony Hub IP
    variables:
      hubIp:
        default: 192.168.1.100
        description: IP address or hostname of Harmony Hub
  - url: http://harmony-ng-{hubId}.local:8089
    description: mDNS Hostname
    variables:
      hubId:
        default: 20140101120000-000001
        description: The Hub's hub_id (GET /api/status)
  - url: http://127.0.0.1:8089
    description: Localhost / SSH Tunnel
security:
  - {}
  - basicAuth: []
  - bearerAuth: []
tags:
  - name: System & Status
    description: Hub health, system telemetry, diagnostics, and settings
  - name: Activities
    description: Activity state machine, sequences, and orchestrator control
  - name: Devices & Commands
    description: Device inventory, IR/BT key management, and batch operations
  - name: Hardware & IR
    description: Direct IR blasting, Pronto hex transmission, and button pulses
  - name: Bluetooth HID
    description: Bluetooth host pairing, connection management, and BLE remotes
  - name: RF & Remote
    description: 'CC2544 2.4GHz RF transceiver and Harmony remote management. On every /api/rf/* route that takes a slot, the slot may be given in the query (?slot=1) or in a JSON body ({"slot": 1}); a value other than 1 or 2 is answered 400 (0 or all are accepted only by pair, unpair, sleep and push-icon, where they mean every remote).'
  - name: Network & MQTT
    description: Wi-Fi, USB Ethernet, and MQTT broker configuration
  - name: Updates & Maintenance
    description: OTA software upgrades and system actions
  - name: Backup & Restore
    description: Configuration bundle export and atomic import
  - name: Authentication & Users
    description: Multi-user RBAC management, session inspection, and user account provisioning
  - name: Custom Icons
    description: Upload, crop, store, and RF-sync custom PNG icons for activities, devices, and commands
  - name: UI Remote Layout
    description: Web and touch UI button mapping and custom layout configuration

paths:
  /health:
    get:
      tags:
        - System & Status
      summary: Health check
      description: Returns service status of hub_daemon. Never needs credentials. Any method is answered. GET / gives the same reply when the Hub has no web UI file to serve for it.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              example:
                status: ok
                service: hub_daemon
                version: 2.4.2
                min_app_version: 1.3.0

  /ws:
    get:
      tags:
        - System & Status
      summary: WebSocket live telemetry & event stream
      description: |
        WebSocket connection for real-time activity transitions, IR/RF events, and hub telemetry.
        Requires upgrade headers `Connection: Upgrade` and `Upgrade: websocket`. The Hub upgrades
        a request on any path that carries `Upgrade: websocket`, not only `/ws`.
        With authentication enabled the upgrade needs a PAT or session token, as
        `Authorization: Bearer <token>` or `?token=<token>` in the request line (401 otherwise;
        loopback callers are exempt). The token's role applies to the actions sent on the socket.
        Pushed messages (type, seq, ts): activity_state, activity_progress, config_changed,
        bt_status, rf_status, mqtt_status, button, ir_received, ir_capture; see docs/API.md
        section 10.
      parameters:
        - name: token
          in: query
          required: false
          schema: {type: string}
          description: PAT (pat_...) or session token (hht_...) when authentication is enabled
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401':
          description: Authentication enabled and no valid token
      x-websocket-messages:
        description: |
          Messages on the socket after the upgrade (docs/API.md section 10). Client messages are
          JSON objects with "action" and an optional "msgId" echoed in the reply. Pushed messages
          carry "type", "seq" (sequence number, from 1 per daemon run) and "ts" (Unix seconds);
          nothing is replayed to a client that connects later, the snapshot is its first frame.
          A numeric "msgId" and a string "id" of the request are both echoed in the reply. An ack
          is {type: ack, action, ok}; a failed one also carries "code" (the HTTP status of the
          REST equivalent) and "error". An unknown action is acked with code 400. With a
          user-role token an action is allowed when its REST equivalent is (403 otherwise).
        client:
          ping: {reply: pong}
          get_state: {reply: activity_state}
          get_snapshot: {reply: snapshot}
          send_command: {reply: ack, fields: [deviceId, command, cmdAction, num_repeats, delay_secs, hold_secs], description: "command is one name or a list of up to 32 names. A list, repeats or a hold run as a queued job; their ack carries state started or queued"}
          ir_send: {reply: ack, description: Same as send_command}
          start_activity: {reply: ack, fields: [activity], description: "The ack carries state starting or queued. id is the request id; it is taken as the activity only when activity is missing and id names a configured activity"}
          stop_activity: {reply: ack, description: The ack carries state stopping or queued}
          power_off: {reply: ack, description: Same as stop_activity}
          cancel_activity: {reply: ack, description: Also drops the queued command jobs (commandsCancelled in the ack)}
          reset_interlock: {reply: ack, description: Same as cancel_activity}
          cancel_commands: {reply: ack, description: Drops the queued command jobs only (commandsCancelled in the ack)}
          bt_key: {reply: ack, fields: [key, keyAction, target]}
          bt_text: {reply: ack, fields: [text, target]}
          bt_mouse: {reply: ack, fields: [dx, dy, buttons, wheel, mouseAction, button, target]}
          ir_raw: {reply: ack, fields: [frequency, timings, port, repeats], description: As POST /api/ir-raw}
          ir_capture: {reply: ack, fields: [enabled]}
          rf_wake: {reply: ack, fields: [slot], description: "As POST /api/rf/wake (slot 1 or 2, default 1)"}
          rf_sleep: {reply: ack, fields: [slot], description: "As POST /api/rf/sleep (slot 1 or 2, default 1)"}
          sync: {reply: ack, description: As POST /api/sync}
          update_check: {reply: ack, fields: [repo, token, remote_version], description: As POST /api/update-check}
          update_apply: {reply: ack, fields: [repo, token], description: As POST /api/update-apply}
          activity_help: {reply: ack, fields: [activity, dry_run], description: As POST /api/activity/help}
          activity_help_answer: {reply: ack, fields: [device, "on"], description: As POST /api/activity/help/answer}
        pushed:
          activity_state:
            example: {type: activity_state, seq: 17, ts: 1762387200, activity: "123456", state: 2, stateName: running, busy: false, sending: true, queued: null}
          activity_progress:
            description: May also carry error (a step failed) and failedSteps
            example: {type: activity_progress, seq: 18, ts: 1762387200, activity: "123456", activityId: "123456", state: starting, stateCode: 1, step: 2, currentStep: 2, total: 6, totalSteps: 6, desc: TV PowerOn, stepDesc: TV PowerOn}
          config_changed:
            example: {type: config_changed, seq: 19, ts: 1762387200, files: [devices]}
          bt_status:
            description: The GET /api/bt-status object when it changed
            example: {type: bt_status, seq: 20, ts: 1762387200, ok: true, running: true, connected: true, pairing: false, hosts: [{addr: "AA:BB:CC:DD:EE:FF", name: Media Player, connected: true, paired: true, cid: 6}]}
          rf_status:
            description: The GET /api/rf/status object when it changed (link counters and battery.voltage_mv are not changes)
            example: {type: rf_status, seq: 21, ts: 1762387200, ok: true, slots: []}
          mqtt_status:
            description: MQTT client state, sent when it changes (docs/API.md 10.13a)
            example: {type: mqtt_status, seq: 23, ts: 1762387200, enabled: true, connected: true, broker: 192.168.1.50, port: 1883, baseTopic: harmony/hub, haDiscovery: true}
          button:
            description: First press and release of a physical key on an RF remote, with the mapped device command when any. Also sent for keys of a Bluetooth remote (source bt_remote), for POST /api/button-press (the source the caller gave, else api) and for a command sent to an MQTT-type device (source api); slot is present only for a key of an RF remote.
            example: {type: button, seq: 22, ts: 1762387200, slot: 1, button: VolumeUp, action: press, source: remote_rf, deviceId: "70321456", command: VolumeUp}
          ir_received:
            description: One learned IR signal while the capture mode is on (POST /api/ir-capture). timings are signed microseconds (+ mark, - space) of one frame ending with the gap; modulation is the measured carrier in Hz or null.
            example: {type: ir_received, seq: 57, ts: 1762387257, modulation: 37700, timings: [4537, -4518, 505, -505, 505, -1513, 505, -55833]}
          ir_capture:
            description: The IR capture mode turned on or off, or its receiver problem changed. ir_capture_error is present only while there is a problem.
            example: {type: ir_capture, seq: 58, ts: 1762387260, ir_capture: true}
          snapshot:
            description: First frame after the upgrade and the reply to get_snapshot
            example:
              type: snapshot
              hub: {hub_id: "20140101120000-000001", hub_name: Living Room Hub, version: 2.2.0, api_version: 2, capabilities: [events, snapshot, ws_auth, ws_keepalive, ir_raw, ir_capture, mdns, legacy, mqtt_v2, rf_wake], auth_enabled: false, uptime_sec: 34821, boot_time: 1762352379, legacy_enabled: false, mdns_enabled: false, ir_capture: false}
              activity_state: {type: activity_state, activity: "-1", state: 0, stateName: idle, busy: false, sending: false, queued: null, seq: 3, ts: 1762387100}
              bt_status: null
              rf_status: null
              mqtt_status: {type: mqtt_status, seq: 2, ts: 1762387100, enabled: false, connected: false, broker: "", port: 1883, baseTopic: harmony/hub, haDiscovery: true}
              config: {files: {devices: 1762387000, activities: 1762387000, settings: 1762380000, remote_map: 1762387000}}
              seq: 42
              ts: 1762387200

  /api/status:
    get:
      tags:
        - System & Status
      summary: High-level hub status
      description: |
        Returns active activity, state machine status, uptime, MQTT connection and the Hub's
        identity: hub_id (factory unit id from the mfg partition), version and commit of this
        firmware, api_version (2; changes only on a breaking change) and the capability flags of
        the compiled-in features (events, snapshot, ws_auth, ws_keepalive, ir_raw, rf_wake, ...).
        boot_time is null until the clock is set. ir_capture_error is present only while the
        IR receiver has a problem.
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                firmware: 4.15.600
                hub_id: "20140101120000-000001"
                version: 2.2.0
                commit: abc1234
                api_version: 2
                capabilities: [events, snapshot, ws_auth, ws_keepalive, ir_raw, ir_capture, mdns, legacy, mqtt_v2, rf_wake]
                legacy_enabled: false
                mdns_enabled: true
                ir_capture: false
                activity: "-1"
                state: 0
                busy: false
                ip: 192.168.1.100
                total_kb: 5120
                free_kb: 1372
                cache_total_kb: 5120
                cache_free_kb: 1824
                uptime_sec: 10421
                boot_time: 1762352379
                updating: false
                auth_enabled: false
                role: admin
                user: admin
                mqtt:
                  connected: true
                  broker: 192.168.1.50
                  port: 1883
                  baseTopic: harmony/hub
                  v2: true
                has_icons: true

  /api/system-info:
    get:
      tags:
        - System & Status
      summary: Linux system telemetry
      description: Returns CPU load, memory usage, uptime, and kernel details.
      responses:
        '200':
          description: System info
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                uptime: "1d 4h 12m (101520s)"
                loadavg: "0.12 0.08 0.05"
                kernel: "Linux version 3.3.8 (mips Atheros AR9344)"
                firmware: "4.15.600"
                version: "2.4.2"
                commit: abc1234
                build_time: "Nov 14 2026 18:00:00"
                memory: "Total: 128 MB, Free: 48 MB (Avail: 72 MB)"
                mem_total_kb: 131072
                mem_free_kb: 49152
                mem_available_kb: 73728
                network_details: "=== Network Interfaces (/proc/net/dev) ===\n..."

  /api/disk-space:
    get:
      tags:
        - System & Status
      summary: Storage partition status
      description: Returns filesystem storage metrics for flash partitions (/data and /cache).
      responses:
        '200':
          description: Storage partition details
          content:
            application/json:
              example:
                ok: true
                total_kb: 5120
                free_kb: 1696
                used_kb: 3424
                percent_free: 33
                cache_total_kb: 5120
                cache_free_kb: 1824
                cache_used_kb: 3296
                cache_percent_free: 35

  /api/network-status:
    get:
      tags:
        - Network & MQTT
      summary: Network interfaces and carrier status
      description: Details Ethernet, Wi-Fi, MAC, IP, and default routing interface.
      responses:
        '200':
          description: Network status
          content:
            application/json:
              example:
                ok: true
                usb_host_mode: true
                active_interface: eth0
                connection_type: "Dual (Ethernet Active + Wi-Fi Standby)"
                mode: ethernet
                ip: 192.168.1.100
                netmask: 255.255.255.0
                mac: 02:00:00:00:00:01
                gateway: 192.168.1.1
                eth_present: true
                eth_onboard: false
                eth_carrier: true
                eth_interface: eth0
                eth_ip: 192.168.1.100
                eth_mask: 255.255.255.0
                eth_mac: 02:00:00:00:00:01
                wifi_connected: true
                wifi_interface: ath0
                wifi_ip: 192.168.1.101
                wifi_mask: 255.255.255.0
                wifi_mac: 02:00:00:00:00:02
                wifi_ssid: ExampleSSID
                config: {eth_enabled: true, eth_fallback_wifi: true, eth_mode: dhcp, usb_wifi_setup: true}
                ifconfig: "eth0      Link encap:Ethernet ..."

  /api/services:
    get:
      tags:
        - System & Status
      summary: Background daemons status
      responses:
        '200':
          description: Service running states
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true
                rf_running: true
                bt_enabled: true
                bt_running: true

  /api/services/rf-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle CC2544 RF daemon
      description: Also available under /api/rf-toggle. A request without enable turns the daemon off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
                  default: false
            example:
              enable: true
      responses:
        '200':
          description: Service toggled
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true
        '500':
          description: The setting could not be saved (turning off only)

  /api/services/bt-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle BTstack daemon
      description: Also available under /api/bt-toggle. A request without enable turns the daemon off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
                  default: false
            example:
              enable: true
      responses:
        '200':
          description: Service toggled. bt_running is the process at that moment; after turning on, hub_btstack starts within about 5 s.
          content:
            application/json:
              example:
                ok: true
                bt_enabled: true
                bt_running: false
        '500':
          description: The setting could not be saved (turning off only)

  /api/logs:
    get:
      tags:
        - System & Status
      summary: Hub log tail
      description: "daemon and rf /tmp/harmony-init.log (the output of hub_daemon and hub_rf), btstack /tmp/hub-btstack.log, network /tmp/harmony-network.log, system logread (or dmesg). Any other value gives the daemon log; source in the reply says which. At most the last 12 KB of a log file are returned."
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [daemon, btstack, rf, system, network]
            default: daemon
          description: Target log stream
      responses:
        '200':
          description: Recent log output
          content:
            application/json:
              example:
                ok: true
                source: daemon
                logs: "[INFO] Harmony hub daemon listening on port 8089\n..."

  /api/icons:
    get:
      tags:
        - System & Status
      summary: Available PNG icon names
      responses:
        '200':
          description: Array of icon filenames
          content:
            application/json:
              example:
                - tv.png
                - receiver.png
                - gamepad.png
                - apple_tv.png

  /assets/icons.tar.gz:
    get:
      tags:
        - Custom Icons
      summary: Download the icon archive (same as GET /api/icons/archive)
      responses:
        '200':
          description: Icons tarball stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          description: The Hub has no icon archive

  /api/icons/archive:
    get:
      tags:
        - Custom Icons
      summary: Download full icon archive (tar.gz)
      description: Returns the stock icon archive as it is stored on the Hub (also served as /assets/icons.tar.gz). Custom icons are not in it. HEAD is answered too.
      responses:
        '200':
          description: Icons tarball stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          description: The Hub has no icon archive

  /api/custom-icons:
    get:
      tags:
        - Custom Icons
      summary: List custom PNG icons
      description: Returns array of custom uploaded icons stored in /data/harmony/custom_icons. type is activity or device for the files named activity_<id>.png and device_<id>.png (id is then the part after the prefix); any other file has no type and its id is the file name without .png.
      responses:
        '200':
          description: Custom icons list
          content:
            application/json:
              example:
                - filename: activity_123456.png
                  url: /assets/icons/activity_123456.png
                  size: 4096
                  type: activity
                  id: "123456"
                - filename: custom_appletv.png
                  url: /assets/icons/custom_appletv.png
                  size: 3200
                  id: custom_appletv
    post:
      tags:
        - Custom Icons
      summary: Upload custom PNG icon
      description: |
        Uploads base64-encoded PNG image (enforces <= 16 KB size limit) and saves to /data/harmony/custom_icons.
        Automatically notifies hub_rf over local socket (port 8092) to propagate icon to paired touchscreen remotes.
        One of id and name is required. With name the file is custom_<name>.png (name in lower
        case, every character other than a letter, a digit, - or _ becomes _) and type and id do
        not name the file; without name the file is <type>_<id>.png.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  default: activity
                  description: Target entity type (activity, device, or custom)
                id:
                  type: string
                  description: Entity identifier or icon identifier (required when name is not given)
                name:
                  type: string
                  description: Custom icon name (required when id is not given)
                image_base64:
                  type: string
                  description: Base64-encoded PNG data (can also be provided as data)
              required: [image_base64]
            example:
              type: activity
              id: "123456"
              name: apple_tv_dark
              image_base64: "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0..."
      responses:
        '200':
          description: Custom icon saved and RF sync triggered
          content:
            application/json:
              example:
                ok: true
                filename: custom_apple_tv_dark.png
                url: /assets/icons/custom_apple_tv_dark.png
                size: 2840
        '400':
          description: Invalid PNG data or missing parameters (neither id nor name, or no image)
        '413':
          description: The decoded image is larger than 16 KB
        '500':
          description: Flash storage write failure
        '507':
          description: No room for more custom icons (128 icons or 512 KB); delete some first
    delete:
      tags:
        - Custom Icons
      summary: Delete custom PNG icon
      description: Removes custom icon from persistent storage and flash cache. Answers 200 also when no such file existed.
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
          example: custom_apple_tv_dark.png
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: activity
      responses:
        '200':
          description: Custom icon deleted
          content:
            application/json:
              example:
                ok: true
                deleted: custom_apple_tv_dark.png
        '400':
          description: Invalid or missing icon identifier

  /api/custom-icons/proxy-fetch:
    get:
      tags:
        - Custom Icons
      summary: Proxy download external image (CORS fallback)
      description: Downloads external HTTP/HTTPS image via wget on the Hub to bypass browser CORS constraints.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Target external image URL
          example: "https://example.com/logo.png"
      responses:
        '200':
          description: Downloaded image PNG stream
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid URL scheme
        '413':
          description: Image exceeds 2 MB limit
        '502':
          description: External download failed

  /api/auth/me:
    get:
      tags:
        - Authentication & Users
      summary: Get current authenticated session & RBAC status
      description: Returns active username, role (admin or user), and whether HTTP authentication is enabled.
      responses:
        '200':
          description: Session info retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                authenticated: true
                username: admin
                role: admin

  /api/auth/token:
    post:
      tags:
        - Authentication & Users
      summary: OAuth2 Password Grant / Login
      description: Exchanges username and password credentials for an expiring Bearer token. Needs no credentials itself. While authentication is off, a token for the admin role is issued for any body, without a password check. The body may also be sent as application/x-www-form-urlencoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              example:
                ok: true
                access_token: "hht_018f3a9e2c4d8b7a1e5f..."
                token_type: "Bearer"
                expires_in: 86400
                username: admin
                role: admin
        '401':
          description: Invalid username or password
        '429':
          description: Too many failed logins from this address (locked from the third failure in a row, 2 s doubling up to 30 s)
          content:
            application/json:
              example:
                ok: false
                error: Too many failed attempts. Try again in 4 seconds
                retry_after: 4
        '500':
          description: The session token could not be created

  /api/auth/logout:
    post:
      tags:
        - Authentication & Users
      summary: Session Logout
      description: Invalidates active Bearer session token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                ok: true
                message: Logged out

  /api/auth/tokens-reset:
    post:
      tags:
        - Authentication & Users
      summary: Move an unreadable token file aside
      description: >-
        When config/tokens.json cannot be read or parsed, moves it to config/tokens.json.bad and
        starts an empty token list. Admin logged in with an account (not a token). Every access
        token then has to be created again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  example: true
      responses:
        '200':
          description: File moved aside, empty list started
          content:
            application/json:
              example:
                ok: true
                moved_to: config/tokens.json.bad
        '400':
          description: confirm is not true
        '403':
          description: Not an admin, or called with a token
        '409':
          description: The token file is readable (nothing done)
        '500':
          description: The file could not be moved or the new list not written
        '503':
          description: The token list is busy, try again

  /api/auth/tokens:
    get:
      tags:
        - Authentication & Users
      summary: List Personal Access Tokens
      description: >-
        Returns the Personal Access Tokens. An admin sees every token; an operator logged in with
        its account sees that account's tokens; a role user token sees its owner's tokens only when
        the owner is an operator account, else only itself. last_used_at is always 0 (it is set when
        the token is created and not updated).
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        '200':
          description: Token list retrieved
          content:
            application/json:
              example:
                ok: true
                tokens:
                  - id: tok_1a2b3c4d
                    name: "Home Assistant"
                    role: admin
                    owner: admin
                    created_at: 1729940000
                    last_used_at: 0
        '500':
          description: The token file exists but cannot be read or parsed (left unchanged)
    post:
      tags:
        - Authentication & Users
      summary: Generate Personal Access Token
      description: >-
        Generates a persistent PAT (`pat_...`). The raw token is returned once upon creation.
        Refused while authentication is off. name defaults to "Personal Access Token", role to admin.
        An operator (role `user`) may create tokens for its own account only, logged in with the
        account (session or Basic, not with a PAT); its tokens always have the role `user`.
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Home Assistant
                role:
                  type: string
                  enum: [admin, user]
                  example: admin
      responses:
        '201':
          description: Token created
          content:
            application/json:
              example:
                ok: true
                id: tok_1a2b3c4d
                name: "Home Assistant"
                role: admin
                token: "pat_3f8a9b1c2d4e..."
        '403':
          description: An operator called with a token instead of an account login
        '409':
          description: Authentication is off, or the token limit is reached (64 on the Hub, 10 per operator account)
        '429':
          description: More than 30 token changes in a minute by this operator account
        '500':
          description: The token file cannot be read or written (left unchanged)
        '503':
          description: The token list is busy, try again
    delete:
      tags:
        - Authentication & Users
      summary: Revoke Personal Access Token
      description: >-
        The id may be given in the query or in a JSON body ({"id":"tok_..."}).
        An admin revokes any token. An operator revokes only the tokens of its own account or the
        token it calls with; any other id answers 404.
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: false
          description: Token ID to revoke (or id in a JSON body)
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                ok: true
                message: Token deleted
        '400':
          description: No token id given
        '404':
          description: No such token, or (operator) not a token of this account
        '429':
          description: More than 30 token changes in a minute by this operator account
        '500':
          description: The token file cannot be read or written (left unchanged)
        '503':
          description: The token list is busy, try again

  /api/users/delete:
    post:
      tags:
        - Authentication & Users
      summary: Delete a user account (same as DELETE /api/users)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
              required: [username]
      responses:
        '200':
          description: Account deleted
        '400':
          description: Username missing, or it is the only admin
        '404':
          description: Unknown user

  /api/users:
    get:
      tags:
        - Authentication & Users
      summary: List user accounts (Admin only)
      description: Returns all configured local HTTP Basic auth user accounts.
      responses:
        '200':
          description: User accounts retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                users:
                  - username: admin
                    role: admin
                  - username: family
                    role: user
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    post:
      tags:
        - Authentication & Users
      summary: Create or update user account (Admin only)
      description: |
        Adds a new user account or updates password and role of an existing account.
        auth_enabled in the same request turns authentication on or off. Rules (400 otherwise):
        the name is shorter than 32 bytes and has no ":" or line break; the password is at most
        128 bytes and is required for a new account; at most 16 accounts; the change must leave
        at least one admin account ("Create an admin account first", "Cannot demote the last
        admin account"). 500 when the accounts cannot be saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  description: Required for a new account; for an existing one, left out keeps the password
                role:
                  type: string
                  enum: [admin, user]
                  default: user
                auth_enabled:
                  type: boolean
                  description: Turns authentication on (true) or off (false); left out keeps the current state
              required: [username]
            example:
              username: family
              password: secretpassword
              role: user
      responses:
        '200':
          description: >-
            User account saved. A request with auth_enabled true that turns authentication on also
            returns auth_enabled and "to_check": every other account and every access token, to
            check and delete what is not recognised (while authentication was off anybody could make
            them). "tokens_unreadable": true in it when the token file could not be read (its tokens
            are not listed).
          content:
            application/json:
              example:
                ok: true
                message: User account saved
                auth_enabled: true
                to_check:
                  users: [{username: guest, role: admin}]
                  tokens: [{id: tok_1a2b3c4d, name: Old script, owner: guest, role: admin, created_at: 1729940000},
                           {id: tok_5e6f7a8b, name: Gone script, owner: old, role: admin, owner_missing: true}]
        '400':
          description: Invalid request or payload error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '500':
          description: A new account's name has access tokens left by a deleted account and the token file cannot be changed
        '503':
          description: The token list is busy, try again
    delete:
      tags:
        - Authentication & Users
      summary: Delete user account (Admin only)
      description: Removes a user account. Cannot delete the sole administrator account. Also accepts POST to /api/users/delete.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Username to delete (can also be passed in JSON body)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
            example:
              username: family
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              example:
                ok: true
                message: User deleted
        '400':
          description: Cannot delete sole admin account or missing username
        '404':
          description: User not found

  /api/settings:
    get:
      tags:
        - System & Status
      summary: Global hub settings
      description: |
        Returns global hub settings. Note that Bluetooth auto-reconnect parameters are configured per-device in /api/inventory.
        `timezone` accepts standard IANA timezone identifiers (e.g. "Europe/Amsterdam", "America/New_York", "Asia/Tokyo") or explicit POSIX TZ strings (e.g. "CET-1CEST,M3.5.0,M10.5.0/3").
      responses:
        '200':
          description: Hub configuration
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                dry_run: false
                ntp_server: pool.ntp.org
                timezone: Europe/Amsterdam
                led_mode: green
                mdns_enabled: true
                legacy_enabled: false
    post:
      tags:
        - System & Status
      summary: Save global hub settings
      description: |
        Updates global hub settings.
        `timezone` accepts standard IANA timezone identifiers (e.g. "Europe/Amsterdam") or POSIX TZ strings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hub_name: {type: string}
                dry_run: {type: boolean, description: "Runtime only: never stored as true, so it is off again after a restart or reboot"}
                ntp_server: {type: string, description: "Default empty (pool.ntp.org). Stored at once, used from the next hub_daemon start"}
                timezone: {type: string, description: "IANA timezone name or POSIX TZ string"}
                led_mode:
                  type: string
                  description: "Front light colour while the Hub runs normally: green, amber (also orange), red or off. The older values always_on (green) and always_off (off) are still accepted. Stored as sent without a check; a value the Hub does not know shows green."
                mdns_enabled: {type: boolean, default: true, description: "mDNS responder for _harmony-ng._tcp; takes effect at once"}
                legacy_enabled: {type: boolean, default: false, description: "Logitech protocol shim on port 8088 (never authenticated) and its SSDP responder; takes effect at once, off closes every 8088 client"}
            example:
              hub_name: Living Room Hub
              dry_run: false
              ntp_server: pool.ntp.org
              timezone: Europe/Amsterdam
              led_mode: green
              mdns_enabled: true
              legacy_enabled: false
      responses:
        '200':
          description: Settings saved; the reply carries ok and every setting, as GET /api/settings
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                dry_run: false
                ntp_server: ""
                timezone: Europe/Amsterdam
                led_mode: green
                mdns_enabled: true
                legacy_enabled: false
        '400':
          description: "Unknown timezone: use a name from the list or a POSIX TZ string (nothing is saved)"
        '500':
          description: The settings could not be saved

  /api/system-action:
    post:
      tags:
        - Updates & Maintenance
      summary: Execute system maintenance action
      description: |
        Reboot the hub, run factory reset, configure authentication, or send raw MQTT messages. Also available under /system.
        mqtt_publish sends payload on topic as it is (an empty payload is sent as "cmd") and
        answers {"ok": true}; there is no retain option. The auth action answers
        {"ok": true, "auth_enabled": <bool>, "message": "Authentication settings updated"}; a
        request without authEnabled keeps the current state. An unknown or missing action
        answers 200 {"ok": true} and does nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [reboot, factory_reset, mqtt_publish, auth]
                confirm:
                  type: string
                  description: Required confirmation string ('RESET') for factory_reset
                topic:
                  type: string
                  description: MQTT topic for mqtt_publish action
                payload:
                  type: string
                  description: MQTT payload for mqtt_publish action
                authEnabled:
                  type: boolean
                  description: Enable or disable HTTP authentication (auth action)
                authUsername:
                  type: string
                  description: Primary admin username (auth action)
                authPassword:
                  type: string
                  description: Primary admin password (auth action)
              required: [action]
            examples:
              reboot:
                value: {action: reboot}
              factoryReset:
                value: {action: factory_reset, confirm: RESET}
              mqttPublish:
                value: {action: mqtt_publish, topic: harmony/hub/notify, payload: "{\"event\":\"ready\"}"}
              auth:
                value: {action: auth, authEnabled: true, authUsername: admin, authPassword: secretpassword}
      responses:
        '200':
          description: >-
            Action accepted. The auth action that turns authentication on also answers auth_enabled
            and "to_check": every account but the admin it sets and every access token, to check
            (as POST /api/users).
          content:
            application/json:
              example:
                ok: true
                message: Rebooting hub now
        '400':
          description: "factory_reset without confirm RESET; auth: a name of 32 bytes or more or with ':' or a line break, a password over 128 bytes, renaming the admin without the password, or turning authentication on with no admin account and no password"
        '409':
          description: "reboot while a software update runs (Software update in progress. Manual reboot blocked.); auth: the admin name is taken by another account"
        '500':
          description: "factory_reset: the reset script is not installed on this Hub; auth: the accounts could not be saved, or the admin name has access tokens left by a deleted account and the token file cannot be changed"
        '503':
          description: "auth: the token list is busy, try again"

  /api/inventory:
    get:
      tags:
        - Devices & Commands
      summary: Get device inventory
      description: Returns configured devices and command profiles. Also available under /api/devices. The example is an infrared device. A Bluetooth device (type BT) has bdaddr and the btAutoReconnect, btReconnectDurationSec and btReconnectDelaySec fields instead of controlPort; an MQTT device has mqttEnabled, mqttTopic and mqttPulseMs instead. Their commands have no port and repeats.
      responses:
        '200':
          description: Device list
          content:
            application/json:
              example:
                devices:
                  - id: "70321456"
                    name: LG OLED TV
                    type: Television
                    manufacturer: LG
                    model: OLED65C2
                    controlPort: 7
                    interDeviceDelay: 500
                    interKeyDelay: 100
                    holdInterKeyDelay: 200
                    defaultInterDeviceDelay: 500
                    powerOnDelay: 1500
                    isPowerAlwaysOn: false
                    powerOnSequence: []
                    powerOffSequence: []
                    commands:
                      - name: PowerToggle
                        keyCode: ""
                        raw: "0000 006d 0022 0002 0155 00aa ..."
                        port: 7
                        repeats: 3

  /api/devices:
    get:
      tags:
        - Devices & Commands
      summary: Get device inventory (alias for /api/inventory)
      description: Returns configured devices and command profiles.
      responses:
        '200':
          description: Device list
          content:
            application/json:
              example:
                devices:
                  - id: "70321456"
                    name: LG OLED TV
                    type: Television
                    manufacturer: LG
                    model: OLED65C2
                    controlPort: 7
                    interDeviceDelay: 500
                    interKeyDelay: 100
                    holdInterKeyDelay: 200
                    defaultInterDeviceDelay: 500
                    powerOnDelay: 1500
                    isPowerAlwaysOn: false
                    powerOnSequence: []
                    powerOffSequence: []
                    commands:
                      - name: PowerToggle
                        keyCode: ""
                        raw: "0000 006d 0022 0002 0155 00aa ..."
                        port: 7
                        repeats: 3

  /api/device-save:
    post:
      tags:
        - Devices & Commands
      summary: Save or update device
      description: Creates or updates a device definition. Also available under /api/new-device, /ir/device, /ir/new-device, /ir/device-mqtt, /ir/device-power. No field is required. Without deviceId (also accepted as id) a new device gets the lowest free number as its id; a new device without name is named after its id. A device is a Bluetooth device by its type (BT, Bluetooth or BTHID) and an MQTT device by mqttEnabled or type MQTT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                name: {type: string}
                type: {type: string}
                manufacturer: {type: string}
                model: {type: string}
                controlPort: {type: integer}
                mqttTopic: {type: string}
                mqttEnabled: {type: boolean}
                mqttPulseMs: {type: integer, default: 1000, description: "Length of the MQTT pulse in ms (mqttPulse is ignored here)"}
                interDeviceDelay: {type: integer, minimum: 0, maximum: 10000, default: 500, description: "ms waited before a command to this device after one to another device"}
                interKeyDelay: {type: integer, minimum: 0, maximum: 10000, default: 100, description: "ms between two different commands to this device"}
                holdInterKeyDelay: {type: integer, minimum: 0, maximum: 10000, default: 200, description: "ms between repeats of the same command"}
                icon: {oneOf: [{type: string}, {type: integer}]}
                powerOnDelay: {type: integer}
                isPowerAlwaysOn: {type: boolean}
                powerOnSequence: {type: array, items: {type: object}}
                powerOffSequence: {type: array, items: {type: object}}
                bdaddr: {type: string, description: "Bluetooth host address of a Bluetooth device (older name btHost)"}
                btAutoReconnect: {type: boolean, default: true, description: "Reconnect the Bluetooth host when a command is sent to it, or when the trigger command is sent"}
                btReconnectDurationSec: {type: integer, description: "Reconnect attempts last this many seconds (60 when 0 or missing)"}
                btReconnectDelaySec: {type: integer, description: "Seconds before the reconnect starts after the trigger command (2 when missing)"}
                btTriggerDeviceId: {type: string, description: "Device whose command starts the reconnect"}
                btTriggerCommandName: {type: string, description: "Command that starts the reconnect (also deviceId:Command)"}
            example:
              deviceId: "70321456"
              name: LG OLED TV
              type: Television
              manufacturer: LG
              model: OLED65C2
              controlPort: 7
              interDeviceDelay: 500
      responses:
        '200':
          description: Device saved; deviceId and id carry the id of the saved device
          content:
            application/json:
              example:
                ok: true
                deviceId: "70321456"
                id: "70321456"
        '400':
          description: 'No usable body, a timing field that is not a number, or a send delay outside 0..10000 ms; the body is {"ok": false} and nothing is saved'
        '500':
          description: devices.json could not be written (ok false, with error)

  /api/device-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete device
      description: Also available under /ir/delete-device, and with the DELETE method on both paths (the id may then be given as ?id=). deviceId is also accepted as id. The reply is 200 with ok false when no device has that id or no id is given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
              required: [deviceId]
            example:
              deviceId: "70321456"
      responses:
        '200':
          description: Device deleted
          content:
            application/json:
              example:
                ok: true
        '409':
          description: >-
            The device is in use by activities, other devices or remote key bindings (not counted:
            its own map page, which is removed with it, sections of deleted activities, pages of
            deleted devices, the map of a slot without a remote: hub_rf does not report it active
            and its version file names no remote, or hub_rf does not answer and there is no version
            file); nothing changed
          content:
            application/json:
              example:
                ok: false
                error: "Device is in use: remove it from these activities, devices and remote keys first"
                deviceId: "1"
                users:
                  - {type: activity, id: "10", name: Watch TV, fields: [startSequence]}
                  - {type: remote_map, slot: 1, count: 1, keys: [activities/10/VolumeUp],
                     groups: [{type: activity, id: "10", name: Watch TV, count: 1}]}

  /api/device-commands:
    get:
      tags:
        - Devices & Commands
      summary: Get all commands for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
          example: "70321456"
          description: Also accepted as id. Without it, or for an unknown device, the reply is an empty commands list.
      responses:
        '200':
          description: Commands list
          content:
            application/json:
              example:
                ok: true
                commands:
                  - name: PowerToggle
                    keyCode: ""
                    raw: "0000 006d 0022 0002 0155 00aa ..."
                    port: 7
                    repeats: 3

  /api/command-save:
    post:
      tags:
        - Devices & Commands
      summary: Save command for device
      description: Adds a command to a device or updates it. Also available under /ir/command and /bt/command. The reply is 200 with ok false when deviceId or name is missing or no device has that id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string, description: "Also accepted as id"}
                name: {type: string}
                oldName: {type: string, description: "Current name of the command, to rename it to name"}
                raw: {type: string, description: "The code (also accepted as code). Left out on an update, the stored code is kept"}
                script: {type: string, description: "Bluetooth macro; stored as the code BT:SCRIPT:<script>"}
                port: {type: integer, description: "IR ports 1..7; left out, a new command uses the device's controlPort and an existing one keeps its port"}
                repeats: {type: integer, default: 3, description: "Stored as 3 on every save that leaves it out"}
              required: [deviceId, name]
            example:
              deviceId: "70321456"
              name: VolumeUp
              raw: "0000 006d 0022 0002 0155 00aa ..."
              port: 7
              repeats: 2
      responses:
        '200':
          description: Command saved
          content:
            application/json:
              example:
                ok: true
        '500':
          description: devices.json could not be written (ok false, with error)

  /api/command-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete command from device
      description: Also available under /ir/delete-command and /bt/delete-command. deviceId is also accepted as id, command as name. The reply is 200 with ok false when the device or the command does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                command: {type: string}
              required: [deviceId, command]
            example:
              deviceId: "70321456"
              command: VolumeUp
      responses:
        '200':
          description: Command deleted
          content:
            application/json:
              example:
                ok: true
        '500':
          description: devices.json could not be written (ok false, with error)

  /api/commands-batch:
    post:
      tags:
        - Devices & Commands
      summary: Batch import commands
      description: Also available under /ir/commands-batch. The reply is 200 with ok false and count 0 when no device has that id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                commands:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      raw: {type: string}
                      port: {type: integer}
                      repeats: {type: integer}
                    required: [name, raw]
              required: [deviceId, commands]
            example:
              deviceId: "70321456"
              commands:
                - name: PowerOn
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
                - name: PowerOff
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
      responses:
        '200':
          description: Commands imported
          content:
            application/json:
              example:
                ok: true
                count: 2
        '500':
          description: devices.json could not be written (ok false, with error)

  /api/activities:
    get:
      tags:
        - Activities
      summary: List all activities
      responses:
        '200':
          description: Activity list and current state
          content:
            application/json:
              example:
                activities:
                  - id: "123456"
                    name: Watch TV
                    type: Custom
                    icon: tv.png
                    order: 1
                    startSequence:
                      - {type: Command, command: PowerOn, deviceId: "70321456"}
                    stopSequence:
                      - {type: Command, command: PowerOff, deviceId: "70321456"}
                currentId: "-1"
                state: 0

  /api/activity:
    get:
      tags:
        - Activities
      summary: Current activity and state
      description: Returns active activity ID, state, busy status (interlock held), sending flag (pending command transmission) and the request queued behind the running transition (null when none). Also available under /api/current_activity.
      responses:
        '200':
          description: Current activity ID and orchestrator state
          content:
            application/json:
              example:
                activity: "-1"
                state: 0
                busy: false
                queued: null
                sending: false
    post:
      tags:
        - Activities
      summary: Start or switch activity
      description: Initiates transition to target activity. Also available under /api/activity-start. A request made while another transition runs is not refused but queued behind it (state queued). With dry_run true nothing is sent and the reply is the list of steps the switch would run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity: {type: string, description: "Activity id, as a string or a number (also accepted as id)"}
                dry_run: {type: boolean, default: false}
              required: [activity]
            example:
              activity: "123456"
              dry_run: false
      responses:
        '200':
          description: Transition initiated (state starting) or queued behind the running one (state queued). With dry_run the step preview instead.
          content:
            application/json:
              examples:
                started:
                  value: {success: true, state: starting}
                queued:
                  value: {success: true, state: queued}
                dryRun:
                  value:
                    target: "123456"
                    switchedDurationMs: 250
                    trueEndMs: 250
                    steps:
                      - {description: "Starting: PowerOn", type: 2, deviceId: "70321456", command: PowerOn, delayMs: 250}
                      - {description: Activity switched, type: 4, stepType: Switched, delayMs: 0}
                    backgroundSteps: []
        '400':
          description: No activity given (Missing activity parameter)
        '409':
          description: Only with dry_run, while a transition runs (Interlock busy)
        '500':
          description: The transition could not be built, for example an unknown activity id (Could not build the transition)

  /api/current_activity:
    get:
      tags:
        - Activities
      summary: Current activity and state (alias for /api/activity)
      responses:
        '200':
          description: Current activity ID and orchestrator state
          content:
            application/json:
              example:
                activity: "-1"
                state: 0
                busy: false
                queued: null
                sending: false

  /api/activity/help:
    post:
      tags:
        - Activities
      summary: Repair the running activity
      description: |
        Re-sends the running activity's start sequence, as if starting from Power Off, except power toggles, and lists the devices whose power command is a toggle so the caller can ask whether each is on.
        With `dry_run: true`, nothing is sent and `preview` holds the steps that would be sent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: string
                  description: Target activity ID (defaults to running activity)
                dry_run:
                  type: boolean
                  default: false
            example:
              activity: "1"
              dry_run: false
      responses:
        '200':
          description: Activity start commands re-sent, toggle devices returned
          content:
            application/json:
              example:
                success: true
                activity: "1"
                toggleDevices:
                  - id: "4"
                    name: "Sony Projector"
                    command: "PowerToggle"
        '409':
          description: Interlock busy, or activity is not running
          content:
            application/json:
              example:
                ok: false
                error: "Interlock busy"
        '500':
          description: The activity's commands could not be built, or no memory

  /api/activity/help/answer:
    post:
      tags:
        - Activities
      summary: Answer help power toggle prompt
      description: |
        Answers the question for one device of the last Help. "on": false sends that device's
        power toggle; "on": true sends nothing. Each device takes one answer. The questions are
        void once the Hub left the Help's activity or after 5 minutes (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  description: Device ID
                "on":
                  type: boolean
                  description: Whether the device is already on
              required: [device, "on"]
            example:
              device: "4"
              "on": false
      responses:
        '200':
          description: Answer processed
          content:
            application/json:
              example:
                success: true
                sent: true
        '404':
          description: Device is not waiting for a Help answer
        '409':
          description: The Help question is no longer valid (the Hub left the Help's activity, or it is older than 5 minutes)

  /api/poweroff:
    post:
      tags:
        - Activities
      summary: Stop activity and power off
      description: Initiates activity shutdown sequence. Also available under /api/activity-stop. While another transition runs the request is queued behind it (state queued). With dry_run true nothing is sent and the reply is the step preview, as for POST /api/activity.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: false}
            example:
              dry_run: false
      responses:
        '200':
          description: Power-off sequence initiated (state stopping) or queued behind the running transition (state queued). With dry_run the step preview instead.
          content:
            application/json:
              examples:
                stopping:
                  value: {success: true, state: stopping}
                queued:
                  value: {success: true, state: queued}
                dryRun:
                  value: {target: "-1", switchedDurationMs: 0, trueEndMs: 0, steps: [], backgroundSteps: []}
        '409':
          description: Only with dry_run, while a transition runs (busy)
        '500':
          description: The transition could not be built

  /api/activity-cancel:
    post:
      tags:
        - Activities
      summary: Force reset orchestrator interlock
      description: Cancels stalled activity transitions and resets orchestrator to idle. Also available under /api/activity-reset and /api/interlock-reset; those two names need the admin role, /api/activity-cancel is also open to the user role.
      responses:
        '200':
          description: Interlock reset
          content:
            application/json:
              example:
                success: true
                message: Activity cancelled / interlock reset

  /api/activity-progress:
    post:
      tags:
        - Activities
      summary: Broadcast activity switching progress
      description: >-
        Sends an activity_progress event to the WebSocket clients and MQTT, built from the known
        fields of the body (activity or activityId, state or stateCode, step or currentStep, total
        or totalSteps, desc or stepDesc); nothing else of the body is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              activityId: "123456"
              state: starting
              step: 2
              totalSteps: 4
              desc: TV PowerOn
      responses:
        '200':
          description: Progress event sent
          content:
            application/json:
              example:
                ok: true
        '400':
          description: The body is not a JSON object

  /api/activity-save:
    post:
      tags:
        - Activities
      summary: Save activity definition
      description: No field is required. Without id (also accepted as activityId) a new activity is created with the lowest free number from 1 to 99 as its id. Defaults for a new activity are name "Custom Activity", type "Custom", icon "Default", order 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                name: {type: string}
                type: {type: string}
                icon: {type: string}
                order: {type: integer}
                startSequence: {type: array}
                stopSequence: {type: array}
                deviceIds: {type: array, items: {type: string}, description: "Devices of the activity (also accepted as devices)"}
            example:
              id: "123456"
              name: Watch TV
              type: Custom
              icon: tv.png
              order: 1
              startSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOn
                - type: Delay
                  delay: 1500
              stopSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOff
      responses:
        '200':
          description: Activity saved
          content:
            application/json:
              example:
                ok: true
                message: Activity saved successfully
        '400':
          description: 'No usable body: {"ok": false, "message": "Failed to save activity"}'
        '500':
          description: activities.json could not be written (ok false, with error)

  /api/activity-delete:
    post:
      tags:
        - Activities
      summary: Delete activity
      description: >-
        Also removes the activity's sections (activities/<id>) from remote_slot1_map.json,
        remote_slot2_map.json and bt_remote_map.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
              required: [id]
            example:
              id: "123456"
      responses:
        '200':
          description: Activity deleted. ok is false, still with 200, when no activity has that id or no id is given.
          content:
            application/json:
              example:
                ok: true
        '409':
          description: The activity is running; power off or start another activity first

  /api/activity-test-sequence:
    post:
      tags:
        - Activities
      summary: Test sequence execution
      description: Runs the steps one after the other before answering. Each step waits its delay, at most 3 s; at most 64 steps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
                  description: Also accepted as sequence
              required: [steps]
            example:
              steps:
                - type: Command
                  deviceId: "70321456"
                  command: PowerToggle
                - type: Delay
                  delay: 500
      responses:
        '200':
          description: Sequence test completed
          content:
            application/json:
              example:
                ok: true
                executed: 2
        '400':
          description: More than 64 steps (the most a saved sequence can hold)
          content:
            application/json:
              example:
                ok: false
                error: Too many steps (limit 64)

  /api/sync:
    post:
      tags:
        - Activities
      summary: Reload configuration from flash
      description: Forces daemon to reload JSON configs from flash and marks the remotes' configuration as waiting for a push (sync_pending in the RF status); the push itself is /api/rf/push-config. Also available under /api/reload.
      responses:
        '200':
          description: Configurations reloaded
          content:
            application/json:
              example:
                ok: true
                message: Configuration reloaded and synchronized

  /api/ir-send:
    post:
      tags:
        - Hardware & IR
      summary: Transmit IR code or device command
      description: |
        Transmits an IR command by device ID and one command name, or raw Pronto hex. Also
        available under /ir/send. A list of commands, num_repeats, delay_secs and hold_secs are
        taken only by the WebSocket and MQTT send_command action (API.md 10.3, 8.1), not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string, description: "Device id (also accepted as device_id, device or id)"}
                command: {type: string, description: "One command name (also accepted as name); a list answers 400"}
                action:
                  type: string
                  enum: [press, down, hold, repeat, release, up, tap]
                  default: tap
                  description: Button action for key holding and repeating
                pronto: {type: string, description: "Pronto hex, or a Harmony code (also accepted as code or raw)"}
                port: {type: integer, default: 7}
                repeats: {type: integer, default: 1}
            examples:
              byDevice:
                value:
                  deviceId: "70321456"
                  command: PowerToggle
                  action: tap
              byPronto:
                value:
                  pronto: "0000 006d 0022 0002 0155 00aa ..."
                  port: 7
                  repeats: 3
      responses:
        '200':
          description: IR command transmitted
          content:
            application/json:
              example:
                ok: true
                deviceId: "70321456"
                command: PowerToggle
        '400':
          description: Neither deviceId with one command name nor a Pronto code
        '500':
          description: The send failed, or the device or the command is not known ("error":"IR transmit failed")

  /api/ir-raw:
    post:
      tags:
        - Hardware & IR
      summary: Send a raw infrared frame (carrier + microsecond timings)
      description: |
        Timings are either signed (positive mark, negative space, alternating) or all positive
        alternating mark/space starting with a mark. An odd count (ending with a mark) is accepted:
        the Hub adds 40 ms of silence after the last mark (not counted in duration_ms).
        Capability flag ir_raw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timings]
              properties:
                frequency: {type: integer, default: 38000, description: "Carrier in Hz, 20000 to 60000; 0 is the default (no unmodulated output)"}
                timings:
                  type: array
                  minItems: 2
                  maxItems: 2048
                  items: {type: integer, minimum: -65535, maximum: 65535, description: "Never 0: each value is 1 to 65535 us, with a minus sign for a space in the signed form"}
                port: {type: integer, minimum: 1, maximum: 7, default: 7}
                repeats: {type: integer, minimum: 1, maximum: 10, default: 1, description: "Written into the code; the frame is sent once"}
            example:
              frequency: 38000
              timings: [9000, -4500, 560, -560, 560, -1690]
              port: 1
              repeats: 1
      responses:
        '200':
          description: Frame sent
          content:
            application/json:
              example:
                ok: true
                count: 6
                frequency: 38000
                duration_ms: 17
        '400':
          description: Validation error, the error names the field
        '409':
          description: Another IR transmission is in progress
          content:
            application/json:
              example:
                ok: false
                error: busy
        '500':
          description: The send failed ("error":"IR transmit failed")

  /api/pronto-blast:
    post:
      tags:
        - Hardware & IR
      summary: Raw Pronto IR blaster burst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pronto: {type: string}
                ports: {type: integer, default: 7}
                repeats: {type: integer, default: 3}
              required: [pronto]
            example:
              pronto: "0000 006d 0022 0002 0155 00aa ..."
              ports: 7
              repeats: 3
      responses:
        '200':
          description: Blaster burst sent
          content:
            application/json:
              example:
                success: true
        '400':
          description: No pronto code given (Missing pronto parameter)
        '500':
          description: The send failed (IR send failed)

  /api/capture:
    post:
      tags:
        - Hardware & IR
      summary: Learn an IR code from the Hub's receiver
      description: Waits for one IR signal and returns it as a Harmony raw timing string. timeout may also be given in the query (?timeout=5).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
      responses:
        '200':
          description: "Signal captured (pulses: number of P and S intervals in raw, marks and spaces together; duration_us: their sum)"
          content:
            application/json:
              example:
                ok: true
                raw: "F9470P0960S0258..."
                keycode: "F9470P0960S0258..."
                mode: raw
                carrier_hz: 38000
                pulses: 26
                duration_us: 24000
        '408':
          description: No signal before the timeout
        '409':
          description: Another capture is running, the IR capture mode is on, or an IR send holds the hardware
        '500':
          description: The capture failed for another reason (IR capture failed)
        '503':
          description: No IR receiver

  /api/ir-capture:
    post:
      tags:
        - Hardware & IR
      summary: IR capture mode on or off
      description: |
        While on, a thread keeps the IR receiver open and every button press becomes an ir_received
        event (WebSocket, MQTT <base>/ir/received). Sends keep working; what the receiver reads
        during a send is dropped. POST /api/capture answers 409 meanwhile. Off at every start.
        Also the WebSocket and MQTT action ir_capture. Capability flag ir_capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
              required: [enabled]
      responses:
        '200':
          description: Mode set
          content:
            application/json:
              example:
                ok: true
                ir_capture: true
        '400':
          description: enabled missing or not a boolean
        '409':
          description: A one-shot capture is running
        '500':
          description: The mode could not be changed for another reason
        '503':
          description: No IR receiver, or it could not be set up

  /api/ir-test-learned:
    post:
      tags:
        - Hardware & IR
      summary: Send a learned IR code once through a device's IR ports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                keycode: {type: string, description: "The learned code (also accepted as raw or code)"}
                raw: {type: string}
            example:
              deviceId: "3"
              keycode: "F9470P0960S0258..."
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              example:
                ok: true
                port: 7
        '400':
          description: Missing code, or a code the IR encoder does not understand
        '500':
          description: The send failed (ok false, port, "error":"IR transmit failed")

  /api/button-press:
    post:
      tags:
        - Hardware & IR
      summary: Report a key press (button event on the WebSocket and MQTT)
      description: Reports a key press (button event on the WebSocket and MQTT). Also available under /api/mqtt-publish, an older name of the same route with the same role; it publishes nothing by itself. Nothing is sent to a device. One of button and command is required. An event is emitted for action press or release (and when action is left out, as a press).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string, description: "Also accepted as id"}
                device: {type: string, description: "Ignored"}
                button: {type: string, description: "Physical key name (hub_rf). When present, command is the device command the key was mapped to."}
                command: {type: string}
                source: {type: string, description: "Copied into the event; api when left out"}
                action: {type: string, enum: [press, hold, release], description: "press and release give a button event on the WebSocket; hold repeats do not"}
                topic: {type: string, description: "Ignored (kept for old clients)"}
                pulseMs: {type: integer, description: "Ignored (kept for old clients)"}
                slot: {type: integer, enum: [1, 2], description: "RF remote slot of the key. No default: without it the event has no slot and goes to <base>/button on MQTT, not <base>/remote/<slot>/button"}
            example:
              deviceId: "70321456"
              command: VolumeUp
      responses:
        '200':
          description: Button reported (a button event on the WebSocket and on MQTT)
          content:
            application/json:
              example:
                ok: true
                button: VolumeUp
        '400':
          description: Neither button nor command given (Missing command parameter)

  /api/bt-mouse:
    post:
      tags:
        - Bluetooth HID
      summary: Send Bluetooth mouse movement, clicks, or scroll
      description: |
        Sends HID Report ID 3 mouse packets to the connected host via /tmp/bthid_input.
        Supports continuous delta streaming or named actions (click, down, up, wheel). Also available under /api/v1/bt/mouse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dx:
                  type: integer
                  description: Relative X movement delta
                  default: 0
                dy:
                  type: integer
                  description: Relative Y movement delta
                  default: 0
                wheel:
                  type: integer
                  description: Vertical scroll wheel delta
                  default: 0
                buttons:
                  type: integer
                  description: Button bitmask (1=Left, 2=Right, 4=Middle)
                  default: 0
                action:
                  type: string
                  enum: [click, down, up, wheel]
                  description: Named mouse action
                button:
                  type: string
                  enum: [left, right, middle]
                  default: left
                  description: Letters only; any name other than right and middle means left
                target:
                  type: string
                  description: Target Bluetooth host BD_ADDR
            example:
              dx: 15
              dy: -5
              buttons: 0
              wheel: 0
      responses:
        '200':
          description: Mouse event processed. ok is false, still with 200, when hub_btstack is not reading its key pipe (Bluetooth off or not running).
          content:
            application/json:
              example:
                ok: true
        '400':
          description: target is not a Bluetooth address, or button is not a plain name

  /api/bt/reconnect:
    post:
      tags:
        - Bluetooth HID
      summary: Trigger Bluetooth host reconnection
      description: Spawns the background reconnect worker (bt_reconnect.sh) to re-establish connection with paired hosts. Also available as /bt/reconnect.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: "Bluetooth address of the host (also accepted as bdaddr or deviceId, but always an address). Left out: the default host (the running activity's host, else the pinned one)."
                duration:
                  type: integer
                  description: Connection attempt timeout in seconds (at most 3600)
                  default: 30
                delay:
                  type: integer
                  description: Delay before starting reconnection in seconds (at most 3600)
                  default: 0
            example:
              target: "AA:BB:CC:DD:EE:FF"
              duration: 30
              delay: 0
      responses:
        '200':
          description: Reconnect triggered
          content:
            application/json:
              example:
                ok: true
                message: Bluetooth reconnect triggered
        '400':
          description: target is not a Bluetooth address (XX:XX:XX:XX:XX:XX)

  /api/bt-status:
    get:
      tags:
        - Bluetooth HID
      summary: Bluetooth stack and pairing status
      responses:
        '200':
          description: 'hub_btstack''s status plus ok, running, connected and pairing (docs/API.md 6.1). Before hub_btstack wrote its first status the reply is {"ok": true, "running": <bool>, "state": "running" or "stopped", "connected": false, "pairing": false, "hosts": []}.'
          content:
            application/json:
              example:
                backend: btstack
                pid: 1234
                state: connecting
                target: "11:22:33:44:55:66"
                last_button: VolumeUp
                last_seen: 1762387200
                remote: {connected: true, addr: "11:22:33:44:55:66"}
                host: {connected: true, addr: "AA:BB:CC:DD:EE:FF", name: Media Player, pairing: false}
                hosts:
                  - {addr: "AA:BB:CC:DD:EE:01", name: Television, connected: false, paired: true, cid: 2}
                  - {addr: "AA:BB:CC:DD:EE:FF", name: Media Player, connected: true, paired: true, cid: 6}
                ok: true
                running: true
                connected: true
                pairing: false

  /api/bt-pairing:
    post:
      tags:
        - Bluetooth HID
      summary: Trigger Bluetooth HID keyboard pairing
      description: Turns the pairing mode for a Bluetooth host on or off. A request without enable turns it off. The device the new host belongs to is needed only to turn it on. The mode ends by itself after 180 s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable: {type: boolean, default: false}
                name: {type: string, default: "Harmony Keyboard"}
                deviceId: {type: string, description: "Device the paired host is linked to (also accepted as targetDev, which is read first). Required with enable true."}
            example:
              enable: true
              name: Harmony Keyboard
              deviceId: "70321456"
      responses:
        '200':
          description: Pairing mode toggled
          content:
            application/json:
              example:
                ok: true
                pairing: true
        '400':
          description: enable true without a device (Target device is required for Bluetooth pairing)

  /api/bt-connect:
    post:
      tags:
        - Bluetooth HID
      summary: Connect to Bluetooth host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bdaddr: {type: string, description: "Host address. Left out: the default host (the running activity's host, else the pinned one)"}
            example:
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Connection initiated
          content:
            application/json:
              example:
                ok: true
        '400':
          description: bdaddr is not a Bluetooth address (XX:XX:XX:XX:XX:XX)

  /api/bt-disconnect:
    post:
      tags:
        - Bluetooth HID
      summary: Disconnect Bluetooth host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bdaddr: {type: string, description: "Host address. Left out: every connected host is disconnected"}
            example:
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              example:
                ok: true
        '400':
          description: bdaddr is not a Bluetooth address (XX:XX:XX:XX:XX:XX)

  /api/bt-link-device:
    post:
      tags:
        - Bluetooth HID
      summary: Link device profile to Bluetooth MAC
      description: Stores bdaddr as the Bluetooth host of the device. A request without bdaddr removes the device's link. deviceId is also accepted as id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                bdaddr: {type: string}
              required: [deviceId]
            example:
              deviceId: "70321456"
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Device linked
          content:
            application/json:
              example:
                ok: true
        '400':
          description: deviceId missing, or bdaddr is not a Bluetooth address
        '404':
          description: no device with that id
        '500':
          description: devices.json could not be saved

  /api/bt-forget-host:
    post:
      tags:
        - Bluetooth HID
      summary: Forget a paired Bluetooth host
      description: >-
        Admin only. Clears the bdaddr of the devices linked to the host, removes the default host
        file when it names it, then hub_btstack drops the host's link key, closes its link and
        removes it from the host list. The devices that used it send their keys to the default
        host (the last host paired) until linked again. The host can only come back through a new
        pairing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addr: {type: string, description: "XX:XX:XX:XX:XX:XX (bdaddr is accepted too)"}
              required: [addr]
            example:
              addr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Host forgotten
          content:
            application/json:
              example:
                ok: true
                addr: "AA:BB:CC:DD:EE:FF"
                devices_cleared: 1
                default_host_cleared: true
        '400':
          description: addr is not a Bluetooth address, or is 00:00:00:00:00:00
        '403':
          description: not an admin account
        '500':
          description: devices.json could not be saved, or hub_btstack did not take the command (send it again)
        '503':
          description: hub_btstack is not running (Bluetooth off); nothing was changed

  /api/remote-status:
    get:
      tags:
        - Bluetooth HID
      summary: BLE remote connection status
      description: |
        Returns connection state of the paired BLE remote (e.g. Homatics B25). Also available under /api/remote-pair-status. When a BLE remote is sleeping, the first button press wakes its radio (showing a red light on B25) and drops; the second button registers after the remote reconnects to the Hub.
        The reply is hub_btstack's status (the fields of GET /api/bt-status: state, target,
        last_button, last_seen, remote, host, hosts) plus ok, running (the hub_btstack process),
        bdaddr (the pinned remote, when there is one) and, after a scan, scanning and devices:
        the results of POST /api/remote-scan are read here. The link state of the remote is
        remote.connected and state (ready when connected). Without a status from hub_btstack
        the reply is {"state": "idle", "ok": true, "running": false}. When the status names no
        remote but bt_remote_map.json holds an address, the reply adds bdaddr, name and
        connected, where connected only says that hub_btstack runs.
      responses:
        '200':
          description: Remote link state
          content:
            application/json:
              example:
                state: ready
                target: "11:22:33:44:55:66"
                remote: {connected: true, addr: "11:22:33:44:55:66"}
                ok: true
                running: true
                scanning: false
                devices:
                  - {addr: "11:22:33:44:55:66", bdaddr: "11:22:33:44:55:66", name: Homatics B25, rssi: -52, pairing: true}
                bdaddr: "11:22:33:44:55:66"

  /api/remote-scan:
    post:
      tags:
        - Bluetooth HID
      summary: Scan for BLE remotes
      description: The scan runs for 8 s. Its results are read with GET /api/remote-status (scanning, devices).
      responses:
        '200':
          description: Scan started
          content:
            application/json:
              example:
                ok: true
                state: scanning
                message: Bluetooth remote scan started

  /api/remote-scan-stop:
    post:
      tags:
        - Bluetooth HID
      summary: Stop scanning for BLE remotes
      description: Halts active BTstack remote discovery scan.
      responses:
        '200':
          description: Scan stopped
          content:
            application/json:
              example:
                ok: true
                state: idle
                message: Bluetooth remote scan stopped

  /api/remote-pair:
    post:
      tags:
        - Bluetooth HID
      summary: Pair BLE remote
      description: A request without bdaddr does nothing, although it is answered 200 with the same message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bdaddr: {type: string}
              required: [bdaddr]
            example:
              bdaddr: "11:22:33:44:55:66"
      responses:
        '200':
          description: Pair command issued
          content:
            application/json:
              example:
                ok: true
                message: Pair command issued to BTstack
        '400':
          description: bdaddr is not a Bluetooth address (XX:XX:XX:XX:XX:XX)

  /api/remote-unpair:
    post:
      tags:
        - Bluetooth HID
      summary: Forget the pinned BLE remote
      description: Removes the remote's address from bt_remote_map.json; hub_btstack disconnects it and deletes its target file, LE bond and HOGD record, then stays idle (no scan, no automatic adoption). Classic hosts are not touched. docs/API.md 6.6.
      responses:
        '200':
          description: Forget command issued
          content:
            application/json:
              example:
                ok: true
                state: standby
                map_cleared: true
                message: Bluetooth remote forgotten

  /api/remote-mapping:
    get:
      tags:
        - Bluetooth HID
      summary: Get BLE remote button bindings
      responses:
        '200':
          description: 'The stored bt_remote_map.json, as it was saved (no ok field is added). While no map is stored: {"ok": true, "remote": {"name": "Homatics B25", "bdaddr": ""}, "activities": {}}.'
          content:
            application/json:
              example:
                remote:
                  name: Homatics B25
                  bdaddr: "11:22:33:44:55:66"
                activities: {}

  /api/remote-mapping-save:
    post:
      tags:
        - Bluetooth HID
      summary: Save BLE remote button bindings
      description: The body is stored as bt_remote_map.json. It may be up to 256 KB (other routes 64 KB).
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Mapping saved
          content:
            application/json:
              example:
                ok: true
        '400':
          description: No body (Request body required), or the body is not a JSON object
        '413':
          description: Body of 256 KB or more (Mapping too large)
        '500':
          description: The file could not be written

  /api/rf:
    get:
      tags:
        - RF & Remote
      summary: CC2544 RF subsystem status
      description: |
        Proxied to hub_rf (port 8092). Returns remote RF status, paired slots, battery telemetry, and RF link statistics (frames_rx, acked_sent, acked_ok, retries, naks, last_seen_s).
        link.key_events counts the key frames received from a remote that numbers them, link.key_events_lost the numbers missing between them (key frames are sent once, without acknowledgement), split into key_lost_press, key_lost_release and key_lost_other; all 0 for a remote that does not number its key frames. docs/API.md 7.1.
        battery.reported_at is the Unix time of the last report (null before the first one or while the clock was not set), battery.restored is true for a value read back from RAM after a hub_rf restart, until the remote reports again. docs/API.md 7.1.
        Per slot, the product: model (ultimate, ultimate_one, ultimate_home, elite, 950, touch,
        companion, smart_control, unknown), model_name (the stock product name, null
        while unknown), skin (the skin id a touchscreen remote reports, null when not reported) and
        equad_id (the CC2544's EquadID for the slot, null when not known: 16417 = 0x4021
        touchscreen remotes, 16414 = 0x401E Smart Control, 16422 / 16423 Companion). A touchscreen
        remote is unknown until it reports its skin id. docs/API.md 7.1.
        An address that is not known is the string "None". sync_pending_diff is a text for the
        user; it has a value also while sync_pending is false.
        When hub_rf does not run, hub_daemon answers this route, and every other /api/rf/*
        request whatever its method, with 200 and
        {"ok": true, "running": false, "state": "stopped", "connected": false,
        "pairing_active": false, "paired": false, "rf_address": "None", "hub_rf_address": "None",
        "slots": [{"slot": 1, "active": false, "address": "None", "rf_address": "None"},
        {"slot": 2, ...}]}: check running before reading the reply of any /api/rf/* call.
      responses:
        '200':
          description: RF status
          content:
            application/json:
              example:
                running: true
                ok: true
                fw_version: "v1.00"
                paired: true
                rf_address: "12345678"
                hub_rf_address: "12345678"
                pairing_active: false
                sync_pending: false
                sync_pending_slot: 0
                sync_pending_diff: "Hub configuration changed. Push settings to sync."
                hub_config_version: 3
                ota:
                  in_progress: false
                  slot: 0
                  status: 0
                  sent_bytes: 0
                  total_bytes: 0
                  sent_chunks: 0
                  total_chunks: 0
                  error: ""
                slots:
                  - slot: 1
                    name: "Harmony Companion (Slot 1)"
                    active: true
                    in_sync: true
                    address: "12345678"
                    rf_address: "12345678"
                    model: "companion"
                    model_name: "Harmony Companion"
                    skin: null
                    equad_id: 16422
                    has_screen: false
                    supports_ota: false
                    sw_version: "N/A"
                    config_version: 0
                    battery:
                      percent: 95
                      charging: false
                      voltage_mv: 3020
                      reported_at: null
                      restored: false
                    link:
                      frames_rx: 1520
                      acked_sent: 412
                      acked_ok: 398
                      retries: 14
                      naks: 9
                      key_events: 0
                      key_events_lost: 0
                      key_lost_press: 0
                      key_lost_release: 0
                      key_lost_other: 0
                      last_seen_s: 2
                  - slot: 2
                    name: "Harmony Ultimate (Slot 2)"
                    active: true
                    in_sync: true
                    address: "87654321"
                    rf_address: "87654321"
                    model: "ultimate"
                    model_name: "Harmony Ultimate"
                    skin: 100
                    equad_id: 16417
                    has_screen: true
                    supports_ota: true
                    sw_version: "v2.0.2"
                    remote_id: "20141001120000-000002"
                    config_version: 3
                    battery:
                      percent: 78
                      charging: false
                      voltage_mv: 3840
                      reported_at: 1794000000
                      restored: false
                    link:
                      frames_rx: 210
                      acked_sent: 85
                      acked_ok: 82
                      retries: 3
                      naks: 1
                      key_events: 640
                      key_events_lost: 3
                      key_lost_press: 1
                      key_lost_release: 0
                      key_lost_other: 2
                      last_seen_s: 14

  /api/rf/status-changed:
    post:
      tags:
        - RF & Remote
      summary: Internal. hub_rf pushes its status object when it changed
      description: |
        Loopback only. hub_rf posts the GET /api/rf/status object whenever it changed (at most
        once a second); the daemon emits an rf_status WebSocket event when the object differs from
        the last one (link counters and battery.voltage_mv ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              example:
                ok: true
                changed: true
        '400':
          description: Body is not a JSON object
        '403':
          description: Not from loopback

  /api/rf/status:
    get:
      tags:
        - RF & Remote
      summary: CC2544 RF subsystem status (same object as GET /api/rf)
      description: |
        Proxied to hub_rf (port 8092); the object of GET /api/rf. hub_rf answers every /api/rf/
        request it does not know (another path, or another method than documented) with this
        status and 200, not 404, and does nothing else.
      responses:
        '200':
          description: RF status (see GET /api/rf)

  /api/rf/pair:
    get:
      tags:
        - RF & Remote
      summary: Start RF pairing beacon
      description: Opens the radio's pairing lock for 30 s. The slot has no effect; the radio gives the remote a free slot itself.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
          description: Accepted (0, all, 1 or 2) but not used
      responses:
        '200':
          description: Pairing started
          content:
            application/json:
              example:
                status: pairing_started
        '400':
          description: slot is not 0, all, 1 or 2
        '409':
          description: RF OTA update in progress
    post:
      tags:
        - RF & Remote
      summary: Start RF pairing beacon (POST)
      description: Same as GET.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
          description: Accepted (0, all, 1 or 2) but not used
      responses:
        '200':
          description: Pairing started
          content:
            application/json:
              example:
                status: pairing_started
        '400':
          description: slot is not 0, all, 1 or 2
        '409':
          description: RF OTA update in progress

  /api/rf/sleep:
    get:
      tags:
        - RF & Remote
      summary: Put paired remote to sleep (Suspend-to-RAM)
      description: Broadcasts or directs RF_MSG_SLEEP_REQ (0x1D) command over CC2544 RF to trigger immediate Suspend-to-RAM on battery-powered touchscreen remotes. Companion slots are skipped (sent is then 0). 400 for a slot other than 0, all, 1 or 2.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: Remote slot (0 for all active remotes, 1 for slot 1, 2 for slot 2)
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress
    post:
      tags:
        - RF & Remote
      summary: Put paired remote to sleep (POST)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
      responses:
        '200':
          description: Sleep command dispatched
          content:
            application/json:
              example:
                status: sleep_dispatched
                slot: 1
                sent: 1
                ok: true
        '409':
          description: RF OTA update in progress

  /api/rf/wake:
    post:
      tags:
        - RF & Remote
      summary: Turn a paired remote's screen on over RF
      description: Sends RF_MSG_WAKE (0x30, ACK'd) to the remote, which turns its screen on (or restarts its idle timeout when the screen is on) as a key press would. Tries for about 10 s in the background and logs whether the remote acknowledged it. A remote in deep standby (suspended to RAM on battery) does not receive it; it reports again at its next hourly alarm or key press.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Remote slot
      responses:
        '202':
          description: Wake request accepted (status waking), or a wake for a remote is already running (status already_waking)
          content:
            application/json:
              examples:
                waking:
                  value: {status: waking, slot: 1, ok: true}
                alreadyWaking:
                  value: {status: already_waking, slot: 1, ok: true}
        '400':
          description: The remote in this slot is a Companion (no screen), or slot is not 1 or 2
        '409':
          description: RF OTA update in progress
        '500':
          description: The background worker could not be started
          content:
            application/json:
              example:
                status: error
                slot: 1
                ok: false

  /api/rf/push-icon:
    get:
      tags:
        - RF & Remote
      summary: Push custom icon to remote over RF
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Activity or device identifier
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: activity
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
      responses:
        '202':
          description: Icon push started in the background (the result is in the hub_rf log)
          content:
            application/json:
              example:
                status: icon_push_started
                id: "123456"
                slot: 0
                ok: true
        '400':
          description: id or type not 1..19 of A-Z a-z 0-9 _ -, or slot not 0, 1 or 2
        '409':
          description: RF OTA update in progress
        '500':
          description: The background worker could not be started
    post:
      tags:
        - RF & Remote
      summary: Push custom icon to remote over RF (POST)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: activity
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
      responses:
        '202':
          description: Icon push started in the background (the result is in the hub_rf log)
          content:
            application/json:
              example:
                status: icon_push_started
                id: "123456"
                slot: 0
                ok: true
        '400':
          description: id or type not 1..19 of A-Z a-z 0-9 _ -, or slot not 0, 1 or 2
        '409':
          description: RF OTA update in progress
        '500':
          description: The background worker could not be started

  /api/rf/pull-config:
    get:
      tags:
        - RF & Remote
      summary: Request configuration pull from remote slot
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Pull request sent
          content:
            application/json:
              example:
                status: pull_requested
                slot: 1
                ok: true
        '400':
          description: The remote in this slot is a Companion (Companion remotes do not support config pull), or slot is not 1 or 2
        '409':
          description: RF OTA update in progress
    post:
      tags:
        - RF & Remote
      summary: Request configuration pull from remote slot (POST)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Pull request sent
          content:
            application/json:
              example:
                status: pull_requested
                slot: 1
                ok: true
        '400':
          description: The remote in this slot is a Companion (Companion remotes do not support config pull), or slot is not 1 or 2
        '409':
          description: RF OTA update in progress

  /api/rf/remote-direct-buttons:
    get:
      tags:
        - RF & Remote
      summary: Get touchscreen direct command button grid
      description: Kept for old clients. Returns the stored file; remote direct mode was removed, so nothing uses it.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Direct button grid definition
          content:
            application/json:
              example:
                page1: []
                page2: []
                buttons: {}
    post:
      tags:
        - RF & Remote
      summary: Save touchscreen direct command button grid
      description: Kept for old clients. Stores the body as remote_slot<N>_direct_buttons.json; remote direct mode was removed (remoteMode is always 0), so nothing reads the file and nothing is pushed to the remote. The request (headers and body) may be at most 4095 bytes.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              page1:
                - id: "1"
                  label: Netflix
                  cmd: LaunchNetflix
              page2: []
              buttons: {}
      responses:
        '200':
          description: Saved (never pushed)
          content:
            application/json:
              example:
                status: saved
                ok: true
        '409':
          description: RF OTA update in progress
        '500':
          description: The file could not be written (Could not save the direct buttons (flash full?))

  /api/rf/log-level:
    get:
      tags:
        - RF & Remote
      summary: Query or update RF daemon log level
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2, 3]
          description: Log level (0=ERROR, 1=WARN, 2=INFO, the default, 3=DEBUG). A value outside 0..3 is ignored. Without it the level is only read.
      responses:
        '200':
          description: Current or updated log level
          content:
            application/json:
              example:
                log_level: 2
                ok: true
    post:
      tags:
        - RF & Remote
      summary: Query or update RF daemon log level (POST)
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2, 3]
          description: As for GET; read from the query only, also for POST
      responses:
        '200':
          description: Updated log level
          content:
            application/json:
              example:
                log_level: 2
                ok: true

  /api/rf/send:
    get:
      tags:
        - RF & Remote
      summary: Transmit raw RF hex frame
      description: Only GET, and hex must be the first query parameter; any other form of the request is answered with the status object of GET /api/rf and sends nothing. At most 64 bytes are sent.
      parameters:
        - name: hex
          in: query
          required: true
          schema:
            type: string
          example: "120150000000000000000000000000000000000000000000000000000000"
      responses:
        '200':
          description: Raw frame transmitted. Also the reply when no byte of hex could be read and nothing was transmitted; there is no ok field.
          content:
            application/json:
              example:
                status: sent
        '409':
          description: RF OTA update in progress

  /api/rf/stop-pair:
    get:
      tags:
        - RF & Remote
      summary: Stop RF pairing mode
      responses:
        '200':
          description: Pairing stopped
          content:
            application/json:
              example:
                status: pairing_stopped
    post:
      tags:
        - RF & Remote
      summary: Stop RF pairing mode (POST)
      responses:
        '200':
          description: Pairing stopped
          content:
            application/json:
              example:
                status: pairing_stopped

  /api/rf/unpair:
    post:
      tags:
        - RF & Remote
      summary: Unpair remote slot (same as GET)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: 1 or 2 unpairs that slot; 0, all or no slot unpairs every remote
      responses:
        '200':
          description: Slot unpaired
          content:
            application/json:
              example:
                status: unpaired
                ok: true
        '400':
          description: slot is not 0, all, 1 or 2
        '409':
          description: RF OTA update in progress
    get:
      tags:
        - RF & Remote
      summary: Unpair remote slot
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: 1 or 2 unpairs that slot; 0, all or no slot unpairs every remote
      responses:
        '200':
          description: Slot unpaired
          content:
            application/json:
              example:
                status: unpaired
                ok: true
        '400':
          description: slot is not 0, all, 1 or 2
        '409':
          description: RF OTA update in progress

  /api/rf/remote-config:
    get:
      tags:
        - RF & Remote
      summary: Get remote configuration
      description: |
        Returns the stored remote_slot<N>_config.json as it is (written by the last POST, or
        from the settings the remote reported), else the defaults shown here. Every setting is
        there twice: under the name shown and under an older snake_case name with a number
        value (touch, physical_nav, cap_buttons, gyro, gyro_rate, btn_backlight, night_start,
        night_end, nav_key, nav_mode, usbeth, confirm_act, touch_sensitivity, remote_mode,
        no_screen, debug_logging, power_debug). theme and layout are present only when set.
        For a Companion slot the reply is
        {"slot": N, "model": "companion", "has_screen": false, "supports_ota": false, "in_sync": true}.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Remote settings
          content:
            application/json:
              example:
                slot: 1
                brightness: 2
                timeout: 10
                touchEnabled: true
                physicalNavEnabled: false
                capButtonsEnabled: true
                gyroEnabled: true
                gyroRate: 50
                btnBacklight: 2
                nightStart: 22
                nightEnd: 7
                navToggleKey: 139
                navToggleMode: 1
                usbEth: false
                confirmActivity: true
                touchSensitivity: 2
                remoteMode: 0
                noScreen: false
                debugLogging: false
                powerDebug: false
                language: en
                language_id: 0
    post:
      tags:
        - RF & Remote
      summary: Save and push remote configuration
      description: |
        Stores the settings and sends them to the remote. The whole set is written each time: a
        field left out is saved and sent with the default below, not with its stored value, so
        send every field. Each field is also accepted under its snake_case name (see GET).
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slot: {type: integer, enum: [1, 2], description: "Overrides the slot of the query"}
                brightness: {type: integer, default: 2}
                timeout: {type: integer, default: 10, minimum: 5, maximum: 600, description: "Screen timeout in seconds; values outside 5..600 are brought into the range"}
                touchEnabled: {type: boolean, default: false, description: "Off when left out"}
                capButtonsEnabled: {type: boolean, default: true}
                gyroEnabled: {type: boolean, default: true}
                gyroRate: {type: integer, default: 50}
                btnBacklight: {type: integer, default: 2, minimum: 0, maximum: 2}
                nightStart: {type: integer, default: 22, minimum: 0, maximum: 23}
                nightEnd: {type: integer, default: 7, minimum: 0, maximum: 23}
                navToggleKey: {type: integer, default: 139}
                navToggleMode: {type: integer, default: 1}
                confirmActivity: {type: boolean, default: false}
                touchSensitivity: {type: integer, default: 2, minimum: 1, maximum: 3}
                remoteMode: {type: integer, description: "Ignored: always saved and sent as 0"}
                usbEth: {type: boolean, default: false}
                physicalNavEnabled: {type: boolean, default: false, description: "Navigation with the keys; sets layout to list"}
                noScreen: {type: boolean, default: false}
                debugLogging: {type: boolean, default: false, description: "Also accepted as powerDebug"}
                language: {type: string, default: en, description: "en, de, fr, nl, es or it (or 0..5)"}
                theme: {type: string, description: "classic, dark, light or colourful; left out keeps the remote's own choice"}
                layout: {type: string, description: "theme, list, grid or carousel; left out keeps the remote's own choice"}
            example:
              brightness: 2
              timeout: 10
              touchEnabled: true
              capButtonsEnabled: true
              gyroEnabled: true
              gyroRate: 50
              btnBacklight: 2
              nightStart: 22
              nightEnd: 7
              navToggleKey: 139
              navToggleMode: 1
              confirmActivity: false
              touchSensitivity: 2
              usbEth: false
              language: en
      responses:
        '200':
          description: Saved and pushed over RF
          content:
            application/json:
              example:
                status: saved_and_pushed
                ok: true
        '400':
          description: The remote in this slot is a Companion (no screen or motion settings), or slot is not 1 or 2
        '409':
          description: RF OTA update in progress
        '500':
          description: The settings were sent to the remote but could not be saved on the Hub

  /api/rf/push-config:
    get:
      tags:
        - RF & Remote
      summary: Trigger OTA config sync to remote (same as POST)
      responses:
        '200':
          description: OTA config push started
          content:
            application/json:
              example:
                status: push_started
        '409':
          description: RF OTA update in progress
        '500':
          description: The push could not be started (config push not started)
    post:
      tags:
        - RF & Remote
      summary: Trigger OTA config sync to remote
      responses:
        '200':
          description: OTA config push started
          content:
            application/json:
              example:
                status: push_started
        '409':
          description: RF OTA update in progress
        '500':
          description: The push could not be started (config push not started)

  /api/rf/sync:
    get:
      tags:
        - RF & Remote
      summary: Resync current activity to remote display
      responses:
        '200':
          description: Activity synced. During an RF OTA update nothing is sent and the reply is the second example.
          content:
            application/json:
              examples:
                synced:
                  value: {status: synced}
                otaInProgress:
                  value: {status: ota_in_progress, ok: true}

  /api/rf/ota-status:
    get:
      tags:
        - RF & Remote
      summary: Remote firmware update status
      description: "Returns OTA progress, chunk counts, and the transfer or download status code (API.md 7.5). status: 0 idle, 3 preparing or downloading the image, 1 sending, 2 sent, -1 failed (error says why). slot is 0 until an update was started."
      responses:
        '200':
          description: Remote OTA transfer status
          content:
            application/json:
              example:
                in_progress: false
                slot: 0
                status: 0
                sent_bytes: 0
                total_bytes: 0
                sent_chunks: 0
                total_chunks: 0
                error: ""

  /api/rf/ota-start:
    post:
      tags:
        - RF & Remote
      summary: Start remote firmware update over RF
      description: Initiates on-demand download of remote OTA package to /tmp (RAM) and streams chunks over CC2544 RF.
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
      responses:
        '200':
          description: Remote update started
          content:
            application/json:
              example:
                status: started
                slot: 1
                ok: true
        '400':
          description: Companion remotes do not support OTA
          content:
            application/json:
              example:
                status: unsupported
                slot: 1
                error: Companion remotes do not support OTA
                ok: false
        '409':
          description: Update or download already in progress
          content:
            application/json:
              example:
                status: already_in_progress
                slot: 1
                error: RF OTA already in progress on slot 1
                ok: false

  /api/ui-remote-layout:
    get:
      tags:
        - UI Remote Layout
      summary: Get customized web and touch UI remote button layouts
      description: Retrieves layout definitions stored in /data/harmony/web_remote_layouts.json.
      responses:
        '200':
          description: 'The stored file, as it was saved (no ok field is added). While no file is stored: {"ok": true, "layouts": {}}.'
          content:
            application/json:
              example:
                layouts:
                  "123456":
                    grid: []
    post:
      tags:
        - UI Remote Layout
      summary: Save web and touch UI remote button layout configuration
      description: Persists layout definitions to /data/harmony/web_remote_layouts.json. The body is stored as the file. It may be up to 256 KB (other routes 64 KB).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              layouts:
                "123456":
                  grid: []
      responses:
        '200':
          description: Layout configuration saved
          content:
            application/json:
              example:
                ok: true
        '400':
          description: No body (Request body required), or the body is not a JSON object
        '413':
          description: Body of 256 KB or more (Mapping too large)
        '500':
          description: The file could not be written

  /api/rf-mapping:
    get:
      tags:
        - RF & Remote
      summary: Get physical remote button mapping (Elite / Ultimate, Companion, Smart Control)
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Remote slot number (1 or 2); any other value means slot 1
      responses:
        '200':
          description: 'The stored remote_slot<N>_map.json, as it was saved (an object, no ok field is added). While no map is stored: {"ok": true, "mappings": []}.'
          content:
            application/json:
              example:
                activities:
                  "123456":
                    VolumeUp: {type: command, action: device_cmd, deviceId: "70321456", command: VolumeUp}
                    PowerOffActivity: {type: command, action: poweroff}
                devices: {}

  /api/rf-mapping-save:
    post:
      tags:
        - RF & Remote
      summary: Save physical remote button mapping (Elite / Ultimate, Companion, Smart Control)
      description: The body is stored as remote_slot<N>_map.json and the slot is marked as waiting for a push (sync_pending in the RF status). The body may be up to 256 KB (other routes 64 KB).
      parameters:
        - name: slot
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: 'Remote slot number (1 or 2). "slot": 2 in the body selects slot 2 as well.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                ok: true
        '400':
          description: No body (Request body required), or the body is not a JSON object
        '413':
          description: Body of 256 KB or more (Mapping too large)
        '500':
          description: The file could not be written

  /api/rf-mapping-copy:
    post:
      tags:
        - RF & Remote
      summary: Copy physical remote button mapping from one slot to another
      description: from and to may also be given as numbers in a JSON body. The destination slot is marked as waiting for a push. A source slot without a stored map gives the destination an empty map.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 1
          description: Source remote slot
        - name: to
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
            default: 2
          description: Destination remote slot
      responses:
        '200':
          description: Mapping copied
          content:
            application/json:
              example:
                ok: true
                from: 1
                to: 2
        '500':
          description: The copy could not be written

  /api/mqtt-status:
    get:
      tags:
        - Network & MQTT
      summary: MQTT connection state and settings
      responses:
        '200':
          description: Status. config is the stored settings without the password, plus has_password; it is missing until the settings were saved once.
          content:
            application/json:
              example:
                ok: true
                connected: true
                broker: 192.168.1.50
                port: 1883
                baseTopic: harmony/hub
                v2: true
                config: {enabled: true, host: 192.168.1.50, port: 1883, username: homeassistant, baseTopic: harmony/hub, clientId: harmony_hub, discoveryPrefix: homeassistant, haDiscovery: true, has_password: true}

  /api/mqtt-save:
    post:
      tags:
        - Network & MQTT
      summary: Save the MQTT broker settings (v2)
      description: |
        Also available as POST /mqtt. haDiscovery (default true) and discoveryPrefix control the
        Home Assistant discovery entities. Fields of the old MQTT layer with no v2 equivalent
        (name, keepAlive, the per-remote event topics) are ignored and removed from the stored
        file. The client reconnects after a save. Topics, the command channel, the kept inbound
        topics, MQTT-type devices and the discovery entities: docs/API.md 8.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean, description: "Left out on the first save, it becomes true; later it keeps its stored value"}
                host: {type: string}
                port: {type: integer, default: 1883}
                username: {type: string, description: "An empty user name removes the stored password"}
                password: {type: string, description: "kept when absent or empty; stored only when a user name is stored"}
                baseTopic: {type: string, default: harmony/hub}
                clientId: {type: string, default: harmony-local-mqtt}
                discoveryPrefix: {type: string, default: homeassistant}
                haDiscovery: {type: boolean, default: true, description: "publish the Home Assistant discovery entities; off clears them"}
            example:
              enabled: true
              host: 192.168.1.50
              port: 1883
              username: homeassistant
              password: secret
              baseTopic: harmony/hub
              clientId: harmony_hub
              discoveryPrefix: homeassistant
              haDiscovery: true
      responses:
        '200':
          description: Saved
          content:
            application/json:
              example:
                ok: true
                message: MQTT settings saved
        '400':
          description: No usable body (Invalid parameters)
        '500':
          description: The settings could not be saved

  /api/device-mqtt-test:
    post:
      tags:
        - Devices & Commands
      summary: Publish the MQTT pulse of a device once
      description: |
        "1" on the resolved topic, then "0" after the pulse, the way a command to an MQTT-type
        device does (docs/API.md 3.8 and 8.1). topic overrides the device's mqttTopic; without
        both, the template {root}/button/{device}/{command} is used. The pulse is pulseMs,
        1000 ms when left out: the device's mqttPulseMs is not used on this route. command
        defaults to PowerToggle. In the template {base_topic}, {baseTopic}, {base} and {root}
        stand for the base topic, {device}, {device_id}, {deviceId} and {deviceName} for the
        device name, {command} and {button} for the command; a topic that starts with "/" and
        names no base is put under the base topic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string, description: "Also accepted as id"}
                device: {type: string, description: "device name, used for {device} in the template"}
                command: {type: string, default: PowerToggle}
                topic: {type: string, description: "template with {base_topic}, {device}, {command} (also accepted as mqttTopic)"}
                pulseMs: {type: integer, default: 1000, description: "Also accepted as mqttPulse"}
            example:
              deviceId: "3"
              device: Plug
              command: PowerToggle
              topic: "{base_topic}/button/{device}/{command}"
              pulseMs: 1000
      responses:
        '200':
          description: Published
          content:
            application/json:
              example:
                ok: true
                topic: harmony/hub/button/Plug/PowerToggle
                pulseMs: 1000
                message: MQTT test publish sent
        '503':
          description: MQTT disabled or the broker not connected

  /api/wifi-scan:
    get:
      tags:
        - Network & MQTT
      summary: Scan for available 2.4GHz Wi-Fi networks
      responses:
        '200':
          description: List of discovered Wi-Fi access points
          content:
            application/json:
              example:
                ok: true
                networks:
                  - ssid: MyWiFiNetwork
                    bssid: "7c:10:c9:b6:ae:58"
                    signal: -45
                    channel: 1
                    frequency: 2412
                    security: WPA2
                    flags: "[WPA2-PSK-CCMP][ESS]"

  /api/wifi-test:
    post:
      tags:
        - Network & MQTT
      summary: Test Wi-Fi association without saving configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: {type: string}
                password: {type: string}
                open: {type: integer, default: 0}
                hidden: {type: integer, default: 0}
                keep_password: {type: integer, default: 0}
              required: [ssid]
            example:
              ssid: MyWiFiNetwork
              password: SecretPassword
      responses:
        '200':
          description: Wi-Fi connection test succeeded
          content:
            application/json:
              example:
                ok: true
                message: Wi-Fi test connection successful
        '400':
          description: Wi-Fi connection test failed
          content:
            application/json:
              example:
                ok: false
                error: "Incorrect Wi-Fi password"

  /api/wifi-save:
    post:
      tags:
        - Network & MQTT
      summary: Save Wi-Fi credentials
      description: Also available as POST /wifi. With apply set to reconfigure, apply, 1 or reboot the Hub first tests the connection (unless force is set) and changes nothing when the test fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssid: {type: string}
                password: {type: string}
                open: {type: integer, default: 0, description: "1 for a network without a password"}
                hidden: {type: integer, default: 0, description: "1 for a hidden network"}
                keep_password: {type: integer, default: 0, description: "1 to use the stored password when password is empty"}
                force: {type: integer, default: 0, description: "1 to skip the connection test before applying"}
                apply: {type: string, default: "save", description: "save writes the settings only; reconfigure, apply, 1 or reboot test the connection first and then apply them"}
              required: [ssid]
            example:
              ssid: MyWiFiNetwork
              password: SecretPassword
              apply: apply
      responses:
        '200':
          description: Wi-Fi updated. The message is "Wi-Fi settings verified and applied" when apply asked to apply them, "Wi-Fi settings saved" otherwise.
          content:
            application/json:
              example:
                ok: true
                message: Wi-Fi settings verified and applied
        '400':
          description: 'Missing or empty SSID, an SSID or password that cannot be used, or the connection test failed ("Wi-Fi test connection failed: <reason>. Settings not changed.")'
        '500':
          description: The settings could not be saved

  /api/ethernet-save:
    post:
      tags:
        - Network & MQTT
      summary: Configure USB Ethernet adapter
      description: Also available as POST /ethernet. Every save rewrites the whole ethernet.conf. A field left out gets its default, not its stored value, so send every field each time; only usb_wifi_setup left out keeps its stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eth_enabled: {type: boolean, default: true}
                eth_fallback_wifi: {type: boolean, default: true}
                eth_mode: {type: string, enum: [dhcp, static], default: dhcp}
                eth_ip: {type: string}
                eth_netmask: {type: string, default: 255.255.255.0}
                eth_gateway: {type: string}
                eth_dns: {type: string}
                usb_wifi_setup: {type: boolean, description: "Wi-Fi setup over USB (USB_WIFI_SETUP in ethernet.conf, default true). Left out = the stored value is kept. false refuses every USB request; the next service start or boot starts no hub_usbwifi and does not wait for a computer on the USB port."}
                apply: {type: string, description: "apply, 1, reconfigure or restart applies the settings now; anything else or nothing only saves them"}
            example:
              eth_mode: dhcp
              eth_ip: 192.168.1.100
              eth_netmask: 255.255.255.0
              eth_gateway: 192.168.1.1
              eth_dns: 192.168.1.1
              apply: apply
      responses:
        '200':
          description: Ethernet configuration saved
          content:
            application/json:
              example:
                ok: true
                message: Ethernet configuration saved
        '400':
          description: Static values that cannot work (the error says which, for example "Static mode needs a valid IPv4 address"), or no usable body (Invalid parameters)
        '500':
          description: The settings could not be saved

  /api/update-status:
    get:
      tags:
        - Updates & Maintenance
      summary: Firmware & software version details
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              example:
                ok: true
                current_version: 1.0.4
                version: 1.0.4
                local_version: "v1.0.4 (a1b2c3d)"
                remote_version: v1.0.4
                commit: a1b2c3d
                build_time: "Oct 21 2026 13:00:00"
                fw_version: 4.15.600
                firmware: 4.15.600
                rf_version: "0x20 CC2544"
                bt_version: "BTstack v1.5 (UART)"
                arch: "mips (AR9344)"
                update_available: false
                updating: false
                update_state: idle
              schema:
                type: object
                properties:
                  updating:
                    type: boolean
                    description: true while update_state is running or restarting
                  update_state:
                    type: string
                    enum: [idle, running, restarting, failed]
                    description: State of the last update-apply since the Hub started (see docs/API.md 2.1)
                  update_step:
                    type: string
                    description: Last output line of update.sh (running only, when it has one; untranslated)
                  update_target:
                    type: string
                    description: Version installed, while the services restart (restarting only)
                  update_error:
                    type: string
                    description: First error line of update.sh, the cause (failed only, untranslated)

  /api/update-check:
    get:
      tags:
        - Updates & Maintenance
      summary: Check online for firmware updates
      description: Downloads the published VERSION from the default update source (the official ota branch). Also available under /api/update-check-state. Admin only, also for GET. The check runs update.sh and can take several seconds.
      responses:
        '200':
          description: Check result (the same object for GET and POST)
          content:
            application/json:
              example:
                ok: true
                current_version: "2.1.1"
                remote_version: "2.1.1"
                message: Hub binaries and WebUI are up to date (v2.1.1).
                has_update: false
                update_available: false
    post:
      tags:
        - Updates & Maintenance
      summary: Check online for firmware updates (custom repository or version)
      description: Checks for updates against another update source, with a token for a private one, or records a version the client already knows.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                  description: "Base URL of the update source (where VERSION, manifest.json and the bundle files are published); default the official ota branch. Only A-Z a-z 0-9 / . : - _ @ ~ are taken, any other value is ignored."
                token:
                  type: string
                  description: "Sent as 'Authorization: token <token>' with every download. Letters, digits, - and _ only, else ignored."
                remote_version:
                  type: string
                  description: "A version the client already knows (also accepted as version): stored as the latest version, nothing is downloaded"
            example:
              repo: "https://raw.githubusercontent.com/iranl/harmony-ng/ota"
      responses:
        '200':
          description: Check result
          content:
            application/json:
              example:
                ok: true
                current_version: "2.1.1"
                remote_version: "2.1.1"
                message: Hub binaries and WebUI are up to date (v2.1.1).
                has_update: false
                update_available: false

  /api/update-apply:
    post:
      tags:
        - Updates & Maintenance
      summary: Trigger OTA update application
      description: >-
        Refused with 409 and status activity_switch (fields busy, sending, queued) while an
        activity switch runs, a request is queued behind it, or its last steps are still being
        sent: the update ends with a services restart, which must not cut a switch in the
        middle. Refused with 409 and status busy while an update runs or the services restart
        after one (update_state running or restarting).
      responses:
        '200':
          description: Update started in background
          content:
            application/json:
              example:
                ok: true
                status: applying
                message: Software update triggered. Hub services downloading and applying in background.
        '409':
          description: An update started earlier is still running (one started more than 30 minutes ago no longer blocks)
          content:
            application/json:
              example:
                ok: false
                status: busy
                error: A software update is already running
      requestBody:
        required: false
        description: |
          Runs update.sh apply in the background. Only a release whose manifest.json carries a
          valid signature by a release key built into the firmware is installed (API.md 2.3),
          whatever server repo names. repo chooses where the firmware is downloaded from, so the
          route is admin only once authentication is on; with authentication off (the default) any
          LAN client may call it.
        content:
          application/json:
            schema:
              type: object
              properties:
                repo:
                  type: string
                  description: Base URL of the update source, as for /api/update-check
                token:
                  type: string
                  description: Token for a private update source, as for /api/update-check

  /export/{target}:
    get:
      tags:
        - Backup & Restore
      summary: Export configuration bundle or table
      description: |
        A single target returns the stored file: JSON, except network (ethernet), wifi and auth,
        which are text/plain. bundle returns one JSON object with version, timestamp and a
        section per stored file: devices, activities, settings, mqtt, network, wifi, bluetooth,
        bt_remote_map, remote_slot1_map, remote_slot2_map, ui_remote_layout, auth, users, hub_id,
        plus btstack_keys (the Bluetooth key store, base64). The bundle holds secrets: the MQTT
        broker password (mqtt), the Wi-Fi password (wifi), the account password hashes (users)
        and the Bluetooth link keys (btstack_keys). Its reply carries the header
        X-Checksum-CRC32.
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            enum: [bundle, devices, activities, settings, mqtt, network, ethernet, wifi, bluetooth, bt_remote_map, remote-mapping, remote_slot1_map, remote_slot2_map, ui_remote_layout, ui-remote-layout, auth, users]
          description: Any other target answers 404. hub_id is only a section of bundle.
          example: bundle
      responses:
        '200':
          description: Configuration snapshot
          content:
            application/json:
              example:
                version: 1
                timestamp: 1792584000
                devices: {...}
                activities: {...}
                settings: {...}
        '404':
          description: Unknown target (Export target not found)
        '409':
          description: Another import or export is running

  /import:
    post:
      tags:
        - Backup & Restore
      summary: Import configuration bundle or section
      description: |
        target is required (there is no default): bundle, or one of devices, activities,
        settings, mqtt, network (ethernet), wifi, bluetooth, bt_remote_map (remote-mapping),
        remote_slot1_map, remote_slot2_map, ui_remote_layout (ui-remote-layout), auth, users.
        For bundle the payload may be the bundle object, the bundle as a JSON string, or left
        out: the body itself is then taken as the bundle. Every section is checked first; when
        one is not valid nothing is changed. The body may be up to 2 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: {type: string, description: "bundle or a single export target"}
                payload: {description: "An object, or the content as a string; optional for bundle"}
                restore_network: {type: boolean, default: false, description: "In a bundle, write the wifi and network sections too (skipped otherwise)"}
              required: [target]
            example:
              target: bundle
              payload:
                devices: {...}
                activities: {...}
                settings: {...}
      responses:
        '200':
          description: >-
            Configuration imported and applied. When an import of the accounts turns authentication
            on, the reply also carries auth_enabled and "to_check" (every account and access token,
            as POST /api/users).
          content:
            application/json:
              example:
                ok: true
                message: Restored successfully
        '400':
          description: 'No or unknown target ({"ok": false, "message": "Import failed"}), or a section that is not valid ("Import refused, nothing was changed: ''<section>'' is not valid")'
        '409':
          description: Another import or export is running
        '413':
          description: Body over 2 MB
        '500':
          description: 'The files could not be written (Import failed: could not write the files)'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication for multi-user RBAC.
        When authentication is enabled on the Hub, requests can supply the `Authorization: Basic <base64(user:pass)>` header.
        Users can have `admin` or `user` roles. The password goes over the network on every request
        (plain HTTP): prefer a token. Digest authentication is not offered.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token (Session or PAT)
      description: |
        OAuth2 Bearer Token Authentication.
        Supports in-memory session tokens (`hht_...` generated via `/api/auth/token`) and persistent Personal Access Tokens (`pat_...` generated via `/api/auth/tokens`).
        Supply header `Authorization: Bearer <token>`.
