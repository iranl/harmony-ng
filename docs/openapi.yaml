openapi: 3.1.0
info:
  title: Harmony Hub Control API
  version: 2.3.0
  description: |
    REST and WebSocket API for the open-source **Harmony Hub** firmware and **Harmony remote** RF daemon.
    
    Runs natively on port `8089` on Atheros AR9344 MIPS hardware. Transparently proxies `/api/rf/*` calls to the `hub_rf` daemon on port `8092`.
    
    ### Testing Locally
    Use the **Servers** dropdown or "Try it out" to send requests directly to your Harmony Hub.
    *Default Hub IP*: `harmony.local:8089`
servers:
  - url: http://{hubIp}:8089
    description: Configurable Harmony Hub IP
    variables:
      hubIp:
        default: 192.168.1.100
        description: IP address or hostname of Harmony Hub
  - url: http://harmony.local:8089
    description: Default Hub IP
  - url: http://harmony.local:8089
    description: mDNS Hostname
  - url: http://127.0.0.1:8089
    description: Localhost / SSH Tunnel
tags:
  - name: System & Status
    description: Hub health, system telemetry, diagnostics, and settings
  - name: Activities
    description: Activity state machine, sequences, and orchestrator control
  - name: Devices & Commands
    description: Device inventory, IR/BT key management, and batch operations
  - name: Hardware & IR
    description: Direct IR blasting, Pronto hex transmission, and button pulses
  - name: Bluetooth HID
    description: Bluetooth host pairing, connection management, and BLE remotes
  - name: RF & Remote
    description: CC2544 2.4GHz RF transceiver and Harmony remote management
  - name: Network & MQTT
    description: Wi-Fi, USB Ethernet, and MQTT broker configuration
  - name: Updates & Maintenance
    description: OTA software upgrades and system actions
  - name: Backup & Restore
    description: Configuration bundle export and atomic import
  - name: Authentication & Users
    description: Multi-user RBAC management, session inspection, and user account provisioning
  - name: Custom Icons
    description: Upload, crop, store, and RF-sync custom PNG icons for activities, devices, and commands
  - name: UI Remote Layout
    description: Web and touch UI button mapping and custom layout configuration

paths:
  /health:
    get:
      tags:
        - System & Status
      summary: Health check
      description: Returns service status of hub_daemon.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              example:
                status: ok
                service: hub_daemon

  /ws:
    get:
      tags:
        - System & Status
      summary: WebSocket live telemetry & event stream
      description: |
        WebSocket connection for real-time activity transitions, IR/RF events, and hub telemetry.
        Requires upgrade headers `Connection: Upgrade` and `Upgrade: websocket`.
        With authentication enabled the upgrade needs a PAT or session token, as
        `Authorization: Bearer <token>` or `?token=<token>` in the request line (401 otherwise;
        loopback callers are exempt). The token's role applies to the actions sent on the socket.
        Pushed messages (type, seq, ts): activity_state, activity_progress, config_changed,
        bt_status, rf_status, button; see docs/API.md section 10.
      parameters:
        - name: token
          in: query
          required: false
          schema: {type: string}
          description: PAT (pat_...) or session token (hht_...) when authentication is enabled
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401':
          description: Authentication enabled and no valid token
      x-websocket-messages:
        description: |
          Messages on the socket after the upgrade (docs/API.md section 10). Client messages are
          JSON objects with "action" and an optional "msgId" echoed in the reply. Pushed messages
          carry "type", "seq" (sequence number, from 1 per daemon run) and "ts" (Unix seconds);
          nothing is replayed to a client that connects later, the snapshot is its first frame.
        client:
          ping: {reply: pong}
          get_state: {reply: activity_state}
          get_snapshot: {reply: snapshot}
          send_command: {reply: ack, fields: [deviceId, command, cmdAction]}
          start_activity: {reply: ack, fields: [id]}
          stop_activity: {reply: ack}
          cancel_activity: {reply: ack}
          bt_key: {reply: ack}
          bt_text: {reply: ack}
          bt_mouse: {reply: ack}
        pushed:
          activity_state:
            example: {type: activity_state, seq: 17, ts: 1762387200, activity: "123456", state: 2, stateName: running, busy: false, sending: true}
          activity_progress:
            example: {type: activity_progress, seq: 18, ts: 1762387200, activity: "123456", activityId: "123456", state: starting, stateCode: 1, step: 2, currentStep: 2, total: 6, totalSteps: 6, desc: TV PowerOn, stepDesc: TV PowerOn}
          config_changed:
            example: {type: config_changed, seq: 19, ts: 1762387200, files: [devices]}
          bt_status:
            description: The GET /api/bt-status object when it changed
            example: {type: bt_status, seq: 20, ts: 1762387200, ok: true, running: true, connected: true, pairing: false, hosts: [{addr: "AA:BB:CC:DD:EE:FF", name: Media Player, connected: true, paired: true, cid: 6}]}
          rf_status:
            description: The GET /api/rf/status object when it changed (link counters and battery.voltage_mv are not changes)
            example: {type: rf_status, seq: 21, ts: 1762387200, ok: true, slots: []}
          button:
            description: First press and release of a physical key on an RF remote, with the mapped device command when any
            example: {type: button, seq: 22, ts: 1762387200, slot: 1, button: VolumeUp, action: press, source: remote_rf, deviceId: "70321456", command: VolumeUp}
          snapshot:
            description: First frame after the upgrade and the reply to get_snapshot
            example:
              type: snapshot
              hub: {hub_id: "20140101120000-000001", hub_name: Living Room Hub, version: 2.2.0, api_version: 2, capabilities: [events, snapshot, ws_auth, ws_keepalive, ir_raw, rf_wake], auth_enabled: false, uptime_sec: 34821, legacy_enabled: false, mdns_enabled: false}
              activity_state: {type: activity_state, activity: "-1", state: 0, stateName: idle, busy: false, sending: false, seq: 3, ts: 1762387100}
              bt_status: null
              rf_status: null
              config: {files: {devices: 1762387000, activities: 1762387000, settings: 1762380000, remote_map: 1762387000}}
              seq: 42
              ts: 1762387200

  /api/status:
    get:
      tags:
        - System & Status
      summary: High-level hub status
      description: |
        Returns active activity, state machine status, uptime, MQTT connection and the Hub's
        identity: hub_id (factory unit id from the mfg partition), version and commit of this
        firmware, api_version (2; changes only on a breaking change) and the capability flags of
        the compiled-in features (events, snapshot, ws_auth, ws_keepalive, ir_raw, rf_wake, ...).
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                firmware: 4.15.600
                hub_id: "20140101120000-000001"
                version: 2.2.0
                commit: abc1234
                api_version: 2
                capabilities: [events, snapshot, ws_auth, ws_keepalive, ir_raw, mdns, mqtt_v2, rf_wake]
                legacy_enabled: false
                mdns_enabled: true
                activity: "-1"
                state: 0
                busy: false
                ip: 192.168.1.100
                total_kb: 5120
                free_kb: 1372
                uptime_sec: 10421
                updating: false
                auth_enabled: false
                role: admin
                user: admin
                mqtt:
                  connected: true
                  broker: 192.168.1.50
                  port: 1883
                  baseTopic: harmony/hub
                  v2: true

  /api/system-info:
    get:
      tags:
        - System & Status
      summary: Linux system telemetry
      description: Returns CPU load, memory usage, uptime, and kernel details.
      responses:
        '200':
          description: System info
          content:
            application/json:
              example:
                uptime: "1d 4h 12m (101520s)"
                load: "0.12 0.08 0.05"
                kernel: "Linux version 3.3.8 (mips Atheros AR9344)"
                memory: "Total: 128 MB, Free: 48 MB (Avail: 72 MB)"
                network: "=== Network Interfaces (/proc/net/dev) ===\n..."

  /api/disk-space:
    get:
      tags:
        - System & Status
      summary: Storage partition status
      description: Returns filesystem storage metrics for flash partitions (/data and /cache).
      responses:
        '200':
          description: Storage partition details
          content:
            application/json:
              example:
                ok: true
                total_kb: 5120
                free_kb: 1696
                used_kb: 3424
                percent_free: 33
                cache_total_kb: 5120
                cache_free_kb: 1824
                cache_used_kb: 3296
                cache_percent_free: 35

  /api/network-status:
    get:
      tags:
        - Network & MQTT
      summary: Network interfaces and carrier status
      description: Details Ethernet, Wi-Fi, MAC, IP, and default routing interface.
      responses:
        '200':
          description: Network status
          content:
            application/json:
              example:
                ok: true
                usb_host_mode: true
                active_interface: eth0
                connection_type: "Dual (Ethernet Active + Wi-Fi Standby)"
                mode: ethernet
                ip: 192.168.1.100
                netmask: 255.255.255.0
                mac: 02:00:00:00:00:01
                gateway: 192.168.1.1
                eth_present: true
                eth_carrier: true
                eth_interface: eth0
                wifi_connected: true
                wifi_ssid: ExampleSSID

  /api/services:
    get:
      tags:
        - System & Status
      summary: Background daemons status
      responses:
        '200':
          description: Service running states
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true
                rf_running: true
                bt_enabled: true
                bt_running: true

  /api/services/rf-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle CC2544 RF daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
              required: [enable]
            example:
              enable: true
      responses:
        '200':
          description: Service toggled
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true

  /api/services/bt-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle BTstack daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
              required: [enable]
            example:
              enable: true
      responses:
        '200':
          description: Service toggled
          content:
            application/json:
              example:
                ok: true
                bt_running: true

  /api/logs:
    get:
      tags:
        - System & Status
      summary: Hub log tail
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [daemon, btstack, rf, system, network]
            default: daemon
          description: Target log stream
      responses:
        '200':
          description: Recent log output
          content:
            application/json:
              example:
                ok: true
                source: daemon
                log: "[INFO] Harmony hub daemon listening on port 8089\n..."

  /api/icons:
    get:
      tags:
        - System & Status
      summary: Available PNG icon names
      responses:
        '200':
          description: Array of icon filenames
          content:
            application/json:
              example:
                - tv.png
                - receiver.png
                - gamepad.png
                - apple_tv.png

  /api/icons/archive:
    get:
      tags:
        - Custom Icons
      summary: Download full icon archive (tar.gz)
      description: Returns compressed tarball containing stock and custom icons (/assets/icons.tar.gz).
      responses:
        '200':
          description: Icons tarball stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary

  /api/custom-icons:
    get:
      tags:
        - Custom Icons
      summary: List custom PNG icons
      description: Returns array of custom uploaded icons stored in /data/harmony/custom_icons.
      responses:
        '200':
          description: Custom icons list
          content:
            application/json:
              example:
                - filename: activity_123456.png
                  url: /assets/icons/activity_123456.png
                  size: 4096
                  type: activity
                  id: "123456"
                - filename: custom_appletv.png
                  url: /assets/icons/custom_appletv.png
                  size: 3200
                  type: custom
                  id: appletv
    post:
      tags:
        - Custom Icons
      summary: Upload custom PNG icon
      description: |
        Uploads base64-encoded PNG image (enforces <= 16 KB size limit) and saves to /data/harmony/custom_icons.
        Automatically notifies hub_rf over local socket (port 8092) to propagate icon to paired touchscreen remotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  default: activity
                  description: Target entity type (activity, device, or custom)
                id:
                  type: string
                  description: Entity identifier or icon identifier
                name:
                  type: string
                  description: Optional custom icon name
                image_base64:
                  type: string
                  description: Base64-encoded PNG data (can also be provided as data)
              required: [image_base64]
            example:
              type: activity
              id: "123456"
              name: apple_tv_dark
              image_base64: "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0..."
      responses:
        '200':
          description: Custom icon saved and RF sync triggered
          content:
            application/json:
              example:
                ok: true
                filename: custom_apple_tv_dark.png
                url: /assets/icons/custom_apple_tv_dark.png
                size: 2840
        '400':
          description: Invalid PNG data or missing parameters
        '500':
          description: Flash storage write failure
    delete:
      tags:
        - Custom Icons
      summary: Delete custom PNG icon
      description: Removes custom icon from persistent storage and flash cache.
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
          example: custom_apple_tv_dark.png
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: activity
      responses:
        '200':
          description: Custom icon deleted
          content:
            application/json:
              example:
                ok: true
                deleted: custom_apple_tv_dark.png
        '400':
          description: Invalid or missing icon identifier

  /api/custom-icons/proxy-fetch:
    get:
      tags:
        - Custom Icons
      summary: Proxy download external image (CORS fallback)
      description: Downloads external HTTP/HTTPS image via wget on the Hub to bypass browser CORS constraints.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Target external image URL
          example: "https://example.com/logo.png"
      responses:
        '200':
          description: Downloaded image PNG stream
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid URL scheme
        '413':
          description: Image exceeds 2 MB limit
        '502':
          description: External download failed

  /api/auth/me:
    get:
      tags:
        - Authentication & Users
      summary: Get current authenticated session & RBAC status
      description: Returns active username, role (admin or user), and whether HTTP authentication is enabled.
      responses:
        '200':
          description: Session info retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                username: admin
                role: admin

  /api/auth/token:
    post:
      tags:
        - Authentication & Users
      summary: OAuth2 Password Grant / Login
      description: Exchanges username and password credentials for an expiring Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              example:
                ok: true
                access_token: "hht_018f3a9e2c4d8b7a1e5f..."
                token_type: "Bearer"
                expires_in: 86400
                username: admin
                role: admin
        '401':
          description: Invalid username or password

  /api/auth/logout:
    post:
      tags:
        - Authentication & Users
      summary: Session Logout
      description: Invalidates active Bearer session token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                ok: true
                message: Logged out

  /api/auth/tokens:
    get:
      tags:
        - Authentication & Users
      summary: List Personal Access Tokens (Admin only)
      description: Returns active Personal Access Tokens for third-party home automation integrations.
      security:
        - bearerAuth: []
        - digestAuth: []
        - basicAuth: []
      responses:
        '200':
          description: Token list retrieved
          content:
            application/json:
              example:
                ok: true
                tokens:
                  - id: tok_1a2b3c4d
                    name: "Home Assistant"
                    role: admin
                    created_at: 1729940000
                    last_used_at: 1729950000
    post:
      tags:
        - Authentication & Users
      summary: Generate Personal Access Token (Admin only)
      description: Generates a persistent PAT (`pat_...`). The raw token is returned once upon creation.
      security:
        - bearerAuth: []
        - digestAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Home Assistant
                role:
                  type: string
                  enum: [admin, user]
                  example: admin
      responses:
        '201':
          description: Token created
          content:
            application/json:
              example:
                ok: true
                id: tok_1a2b3c4d
                name: "Home Assistant"
                role: admin
                token: "pat_3f8a9b1c2d4e..."
    delete:
      tags:
        - Authentication & Users
      summary: Revoke Personal Access Token (Admin only)
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
          description: Token ID to revoke
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                ok: true
                message: Token deleted

  /api/users:
    get:
      tags:
        - Authentication & Users
      summary: List user accounts (Admin only)
      description: Returns all configured local HTTP Basic auth user accounts.
      responses:
        '200':
          description: User accounts retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                users:
                  - username: admin
                    role: admin
                  - username: family
                    role: user
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    post:
      tags:
        - Authentication & Users
      summary: Create or update user account (Admin only)
      description: Adds a new user account or updates password and role of an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
                  default: user
              required: [username]
            example:
              username: family
              password: secretpassword
              role: user
      responses:
        '200':
          description: User account saved
          content:
            application/json:
              example:
                ok: true
                message: User account saved
        '400':
          description: Invalid request or payload error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    delete:
      tags:
        - Authentication & Users
      summary: Delete user account (Admin only)
      description: Removes a user account. Cannot delete the sole administrator account. Also accepts POST to /api/users/delete.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Username to delete (can also be passed in JSON body)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
            example:
              username: family
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              example:
                ok: true
                message: User deleted
        '400':
          description: Cannot delete sole admin account or missing username
        '404':
          description: User not found

  /api/settings:
    get:
      tags:
        - System & Status
      summary: Global hub settings
      description: |
        Returns global hub settings. Note that Bluetooth auto-reconnect parameters are configured per-device in /api/inventory.
        `timezone` accepts standard IANA timezone identifiers (e.g. "Europe/Amsterdam", "America/New_York", "Asia/Tokyo") or explicit POSIX TZ strings (e.g. "CET-1CEST,M3.5.0,M10.5.0/3").
      responses:
        '200':
          description: Hub configuration
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                dry_run: false
                ntp_server: pool.ntp.org
                timezone: Europe/Amsterdam
                led_mode: green
                mdns_enabled: true
    post:
      tags:
        - System & Status
      summary: Save global hub settings
      description: |
        Updates global hub settings.
        `timezone` accepts standard IANA timezone identifiers (e.g. "Europe/Amsterdam") or POSIX TZ strings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hub_name: {type: string}
                dry_run: {type: boolean}
                ntp_server: {type: string}
                timezone: {type: string, description: "IANA timezone name or POSIX TZ string"}
                led_mode:
                  type: string
                  enum: [green, amber, red, "off"]
                  description: Front light colour while the Hub runs normally. The older values always_on (green) and always_off (off) are still accepted.
                mdns_enabled: {type: boolean, default: true, description: "mDNS responder for _harmony-ng._tcp; takes effect at once"}
            example:
              hub_name: Living Room Hub
              dry_run: false
              ntp_server: pool.ntp.org
              timezone: Europe/Amsterdam
              led_mode: green
              mdns_enabled: true
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              example:
                ok: true

  /api/system-action:
    post:
      tags:
        - Updates & Maintenance
      summary: Execute system maintenance action
      description: Reboot the hub, run factory reset, configure authentication, or send raw MQTT messages. Also available under /system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [reboot, factory_reset, mqtt_publish, auth]
                confirm:
                  type: string
                  description: Required confirmation string ('RESET') for factory_reset
                topic:
                  type: string
                  description: MQTT topic for mqtt_publish action
                payload:
                  type: string
                  description: MQTT payload for mqtt_publish action
                retain:
                  type: boolean
                authEnabled:
                  type: boolean
                  description: Enable or disable HTTP authentication (auth action)
                authUsername:
                  type: string
                  description: Primary admin username (auth action)
                authPassword:
                  type: string
                  description: Primary admin password (auth action)
              required: [action]
            examples:
              reboot:
                value: {action: reboot}
              factoryReset:
                value: {action: factory_reset, confirm: RESET}
              mqttPublish:
                value: {action: mqtt_publish, topic: harmony/hub/notify, payload: "{\"event\":\"ready\"}"}
              auth:
                value: {action: auth, authEnabled: true, authUsername: admin, authPassword: secretpassword}
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              example:
                ok: true
                message: Rebooting hub now

  /api/inventory:
    get:
      tags:
        - Devices & Commands
      summary: Get device inventory
      description: Returns configured devices and command profiles. Also available under /api/devices.
      responses:
        '200':
          description: Device list
          content:
            application/json:
              example:
                devices:
                  - id: "70321456"
                    name: LG OLED TV
                    type: Television
                    manufacturer: LG
                    model: OLED65C2
                    controlPort: 0
                    mqttTopic: home/livingroom/tv
                    mqttEnabled: true
                    mqttPulse: 100
                    commands:
                      - name: PowerToggle
                        raw: "0000 006d 0022 0002 0155 00aa ..."
                        port: 7
                        repeats: 3

  /api/devices:
    get:
      tags:
        - Devices & Commands
      summary: Get device inventory (alias for /api/inventory)
      description: Returns configured devices and command profiles.
      responses:
        '200':
          description: Device list
          content:
            application/json:
              example:
                devices:
                  - id: "70321456"
                    name: LG OLED TV
                    type: Television
                    manufacturer: LG
                    model: OLED65C2
                    controlPort: 0
                    mqttTopic: home/livingroom/tv
                    mqttEnabled: true
                    mqttPulse: 100
                    commands:
                      - name: PowerToggle
                        raw: "0000 006d 0022 0002 0155 00aa ..."
                        port: 7
                        repeats: 3

  /api/device-save:
    post:
      tags:
        - Devices & Commands
      summary: Save or update device
      description: Creates or updates a device definition. Also available under /api/new-device, /ir/device, /ir/new-device, /ir/device-mqtt, /ir/device-power.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                name: {type: string}
                type: {type: string}
                manufacturer: {type: string}
                model: {type: string}
                controlPort: {type: integer}
                mqttTopic: {type: string}
                mqttEnabled: {type: boolean}
                mqttPulse: {type: integer}
                bt_auto_reconnect: {type: boolean, description: "Auto-reconnect Bluetooth device on activity start"}
                bt_reconnect_duration_sec: {type: integer, default: 30, description: "Bluetooth reconnect attempt timeout"}
                bt_reconnect_delay_sec: {type: integer, default: 0, description: "Delay in seconds before attempting Bluetooth reconnection"}
                transport: {type: string, enum: [ir, bt], default: ir}
              required: [deviceId, name]
            example:
              deviceId: "70321456"
              name: LG OLED TV
              type: Television
              manufacturer: LG
              model: OLED65C2
              controlPort: 0
              mqttTopic: home/livingroom/tv
              mqttEnabled: true
              mqttPulse: 100
              bt_auto_reconnect: true
              bt_reconnect_duration_sec: 30
              bt_reconnect_delay_sec: 0
      responses:
        '200':
          description: Device saved
          content:
            application/json:
              example:
                ok: true

  /api/device-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
              required: [deviceId]
            example:
              deviceId: "70321456"
      responses:
        '200':
          description: Device deleted
          content:
            application/json:
              example:
                ok: true

  /api/device-commands:
    get:
      tags:
        - Devices & Commands
      summary: Get all commands for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
          example: "70321456"
      responses:
        '200':
          description: Commands list
          content:
            application/json:
              example:
                ok: true
                commands:
                  - name: PowerToggle
                    raw: "0000 006d 0022 0002 0155 00aa ..."
                    port: 7
                    repeats: 3

  /api/command-save:
    post:
      tags:
        - Devices & Commands
      summary: Save command for device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                name: {type: string}
                raw: {type: string}
                port: {type: integer, default: 7}
                repeats: {type: integer, default: 1}
              required: [deviceId, name, raw]
            example:
              deviceId: "70321456"
              name: VolumeUp
              raw: "0000 006d 0022 0002 0155 00aa ..."
              port: 7
              repeats: 2
      responses:
        '200':
          description: Command saved
          content:
            application/json:
              example:
                ok: true

  /api/command-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete command from device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                command: {type: string}
              required: [deviceId, command]
            example:
              deviceId: "70321456"
              command: VolumeUp
      responses:
        '200':
          description: Command deleted
          content:
            application/json:
              example:
                ok: true

  /api/commands-batch:
    post:
      tags:
        - Devices & Commands
      summary: Batch import commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                commands:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      raw: {type: string}
                      port: {type: integer}
                      repeats: {type: integer}
                    required: [name, raw]
              required: [deviceId, commands]
            example:
              deviceId: "70321456"
              commands:
                - name: PowerOn
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
                - name: PowerOff
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
      responses:
        '200':
          description: Commands imported
          content:
            application/json:
              example:
                ok: true
                count: 2

  /api/activities:
    get:
      tags:
        - Activities
      summary: List all activities
      responses:
        '200':
          description: Activity list and current state
          content:
            application/json:
              example:
                activities:
                  - id: "123456"
                    name: Watch TV
                    type: Custom
                    icon: tv.png
                    order: 1
                currentId: "-1"
                state: 0

  /api/activity:
    get:
      tags:
        - Activities
      summary: Current activity and state
      description: Returns active activity ID, state, busy status (interlock held), and sending flag (pending command transmission). Also available under /api/current_activity.
      responses:
        '200':
          description: Current activity ID and orchestrator state
          content:
            application/json:
              example:
                activity: "-1"
                state: 0
                busy: false
                sending: false
    post:
      tags:
        - Activities
      summary: Start or switch activity
      description: Initiates transition to target activity. Also available under /api/activity-start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity: {type: string}
                dry_run: {type: boolean, default: false}
              required: [activity]
            example:
              activity: "123456"
              dry_run: false
      responses:
        '200':
          description: Transition initiated
          content:
            application/json:
              example:
                success: true
                state: starting
        '409':
          description: Orchestrator is busy transitioning another activity

  /api/current_activity:
    get:
      tags:
        - Activities
      summary: Current activity and state (alias for /api/activity)
      responses:
        '200':
          description: Current activity ID and orchestrator state
          content:
            application/json:
              example:
                activity: "-1"
                state: 0
                busy: false
                sending: false

  /api/activity/help:
    post:
      tags:
        - Activities
      summary: Repair the running activity
      description: |
        Re-sends the running activity's start sequence, as if starting from Power Off, except power toggles, and lists the devices whose power command is a toggle so the caller can ask whether each is on.
        With `dry_run: true`, nothing is sent and `preview` holds the steps that would be sent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: string
                  description: Target activity ID (defaults to running activity)
                dry_run:
                  type: boolean
                  default: false
            example:
              activity: "1"
              dry_run: false
      responses:
        '200':
          description: Activity start commands re-sent, toggle devices returned
          content:
            application/json:
              example:
                success: true
                activity: "1"
                toggleDevices:
                  - id: "4"
                    name: "Sony Projector"
                    command: "PowerToggle"
        '409':
          description: Interlock busy, or activity is not running
          content:
            application/json:
              example:
                error: "Interlock busy"

  /api/activity/help/answer:
    post:
      tags:
        - Activities
      summary: Answer help power toggle prompt
      description: |
        Answers the question for one device of the last Help. "on": false sends that device's
        power toggle; "on": true sends nothing. Each device takes one answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  description: Device ID
                on:
                  type: boolean
                  description: Whether the device is already on
              required: [device, on]
            example:
              device: "4"
              on: false
      responses:
        '200':
          description: Answer processed
          content:
            application/json:
              example:
                success: true
                sent: true
        '404':
          description: Device is not waiting for a Help answer

  /api/poweroff:
    post:
      tags:
        - Activities
      summary: Stop activity and power off
      description: Initiates activity shutdown sequence. Also available under /api/activity-stop.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: {type: boolean, default: false}
            example:
              dry_run: false
      responses:
        '200':
          description: Power-off sequence initiated
          content:
            application/json:
              example:
                success: true
                state: stopping

  /api/activity-cancel:
    post:
      tags:
        - Activities
      summary: Force reset orchestrator interlock
      description: Cancels stalled activity transitions and resets orchestrator to idle. Also available under /api/activity-reset and /api/interlock-reset.
      responses:
        '200':
          description: Interlock reset
          content:
            application/json:
              example:
                ok: true

  /api/activity-progress:
    post:
      tags:
        - Activities
      summary: Broadcast activity switching progress
      description: Relays transition progress events to WebSocket clients and publishes to MQTT topic harmony/hub/activity/status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              activityId: "123456"
              state: switching
              progress: 50
              step: 2
              totalSteps: 4
      responses:
        '200':
          description: Progress broadcasted
          content:
            application/json:
              example:
                ok: true

  /api/activity-save:
    post:
      tags:
        - Activities
      summary: Save activity definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                name: {type: string}
                type: {type: string}
                icon: {type: string}
                order: {type: integer}
                startSequence: {type: array}
                stopSequence: {type: array}
              required: [id, name]
            example:
              id: "123456"
              name: Watch TV
              type: Custom
              icon: tv.png
              order: 1
              startSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOn
                - type: Delay
                  delay: 1500
              stopSequence:
                - type: Command
                  deviceId: "70321456"
                  command: PowerOff
      responses:
        '200':
          description: Activity saved
          content:
            application/json:
              example:
                ok: true

  /api/activity-delete:
    post:
      tags:
        - Activities
      summary: Delete activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
              required: [id]
            example:
              id: "123456"
      responses:
        '200':
          description: Activity deleted
          content:
            application/json:
              example:
                ok: true

  /api/activity-test-sequence:
    post:
      tags:
        - Activities
      summary: Test sequence execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
              required: [steps]
            example:
              steps:
                - type: Command
                  deviceId: "70321456"
                  command: PowerToggle
                - type: Delay
                  delay: 500
      responses:
        '200':
          description: Sequence test completed
          content:
            application/json:
              example:
                ok: true
                executed: 2

  /api/sync:
    post:
      tags:
        - Activities
      summary: Reload configuration from flash
      description: Forces daemon to reload JSON configs from flash. Also available under /api/reload.
      responses:
        '200':
          description: Configurations reloaded
          content:
            application/json:
              example:
                ok: true

  /api/ir-send:
    post:
      tags:
        - Hardware & IR
      summary: Transmit IR code or device command
      description: Transmits an IR command by device ID and command name, or raw Pronto hex. Also available under /ir/send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                command: {type: string}
                action:
                  type: string
                  enum: [press, down, hold, repeat, release, up, tap]
                  default: tap
                  description: Button action for key holding and repeating
                pronto: {type: string}
                port: {type: integer, default: 7}
                repeats: {type: integer, default: 1}
            examples:
              byDevice:
                value:
                  deviceId: "70321456"
                  command: PowerToggle
                  action: tap
              byPronto:
                value:
                  pronto: "0000 006d 0022 0002 0155 00aa ..."
                  port: 7
                  repeats: 3
      responses:
        '200':
          description: IR command transmitted
          content:
            application/json:
              example:
                ok: true

  /api/ir-raw:
    post:
      tags:
        - Hardware & IR
      summary: Send a raw infrared frame (carrier + microsecond timings)
      description: |
        Timings are either signed (positive mark, negative space, alternating) or all positive
        alternating mark/space starting with a mark. An odd count (ending with a mark) is accepted:
        the Hub adds 40 ms of silence after the last mark (not counted in duration_ms).
        Capability flag ir_raw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timings]
              properties:
                frequency: {type: integer, default: 38000, description: "Carrier in Hz: 0 (unmodulated) or 20000 to 60000"}
                timings:
                  type: array
                  minItems: 2
                  maxItems: 2048
                  items: {type: integer, minimum: -65535, maximum: 65535}
                port: {type: integer, minimum: 1, maximum: 7, default: 7}
                repeats: {type: integer, minimum: 1, maximum: 10, default: 1}
            example:
              frequency: 38000
              timings: [9000, -4500, 560, -560, 560, -1690]
              port: 1
              repeats: 1
      responses:
        '200':
          description: Frame sent
          content:
            application/json:
              example:
                ok: true
                count: 6
                duration_ms: 17
        '400':
          description: Validation error, the error names the field
        '409':
          description: Another IR transmission is in progress
          content:
            application/json:
              example:
                ok: false
                error: busy

  /api/pronto-blast:
    post:
      tags:
        - Hardware & IR
      summary: Raw Pronto IR blaster burst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pronto: {type: string}
                ports: {type: integer, default: 7}
                repeats: {type: integer, default: 3}
              required: [pronto]
            example:
              pronto: "0000 006d 0022 0002 0155 00aa ..."
              ports: 7
              repeats: 3
      responses:
        '200':
          description: Blaster burst sent
          content:
            application/json:
              example:
                success: true

  /api/capture:
    post:
      tags:
        - Hardware & IR
      summary: Learn an IR code from the Hub's receiver
      description: Waits for one IR signal and returns it as a Harmony raw timing string.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout: {type: integer, minimum: 1, maximum: 30, default: 10}
      responses:
        '200':
          description: "Signal captured (pulses: number of P and S intervals in raw, marks and spaces together; duration_us: their sum)"
          content:
            application/json:
              example:
                ok: true
                raw: "F9470P0960S0258..."
                keycode: "F9470P0960S0258..."
                mode: raw
                carrier_hz: 38000
                pulses: 26
                duration_us: 24000
        '408':
          description: No signal before the timeout
        '409':
          description: Another capture is running, or an IR send holds the hardware
        '503':
          description: No IR receiver

  /api/ir-test-learned:
    post:
      tags:
        - Hardware & IR
      summary: Send a learned IR code once through a device's IR ports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                keycode: {type: string}
                raw: {type: string}
            example:
              deviceId: "3"
              keycode: "F9470P0960S0258..."
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              example:
                ok: true
                port: 7
        '400':
          description: Missing code, or a code the IR encoder does not understand

  /api/button-press:
    post:
      tags:
        - Hardware & IR
      summary: Automated button pulse over MQTT & hardware
      description: Dispatches button press or MQTT pulse. Also available under /api/mqtt-publish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                device: {type: string}
                button: {type: string, description: "Physical key name (hub_rf). When present, command is the device command the key was mapped to."}
                command: {type: string}
                source: {type: string}
                action: {type: string, enum: [press, hold, release], description: "press and release give a button event on the WebSocket; hold repeats do not"}
                topic: {type: string}
                pulseMs: {type: integer, default: 100}
                slot: {type: integer, enum: [1, 2], default: 1}
            example:
              deviceId: "70321456"
              command: VolumeUp
              pulseMs: 100
      responses:
        '200':
          description: Button reported (a button event on the WebSocket and on MQTT)
          content:
            application/json:
              example:
                ok: true
                button: VolumeUp

  /api/bt-mouse:
    post:
      tags:
        - Bluetooth HID
      summary: Send Bluetooth mouse movement, clicks, or scroll
      description: |
        Sends HID Report ID 3 mouse packets to the connected host via /tmp/bthid_input.
        Supports continuous delta streaming or named actions (click, down, up, wheel). Also available under /api/v1/bt/mouse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dx:
                  type: integer
                  description: Relative X movement delta
                  default: 0
                dy:
                  type: integer
                  description: Relative Y movement delta
                  default: 0
                wheel:
                  type: integer
                  description: Vertical scroll wheel delta
                  default: 0
                buttons:
                  type: integer
                  description: Button bitmask (1=Left, 2=Right, 4=Middle)
                  default: 0
                action:
                  type: string
                  enum: [click, down, up, wheel]
                  description: Named mouse action
                button:
                  type: string
                  enum: [left, right, middle]
                  default: left
                target:
                  type: string
                  description: Target Bluetooth host BD_ADDR
            example:
              dx: 15
              dy: -5
              buttons: 0
              wheel: 0
      responses:
        '200':
          description: Mouse event processed
          content:
            application/json:
              example:
                ok: true

  /api/bt/reconnect:
    post:
      tags:
        - Bluetooth HID
      summary: Trigger Bluetooth host reconnection
      description: Spawns the background reconnect worker (bt_reconnect.sh) to re-establish connection with paired hosts. Also available as /bt/reconnect.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  description: Target BD_ADDR or deviceId (optional, connects all if omitted)
                duration:
                  type: integer
                  description: Connection attempt timeout in seconds
                  default: 30
                delay:
                  type: integer
                  description: Delay before starting reconnection in seconds
                  default: 0
            example:
              target: "AA:BB:CC:DD:EE:FF"
              duration: 30
              delay: 0
      responses:
        '200':
          description: Reconnect triggered
          content:
            application/json:
              example:
                ok: true
                message: Bluetooth reconnect triggered

  /api/bt-status:
    get:
      tags:
        - Bluetooth HID
      summary: Bluetooth stack and pairing status
      responses:
        '200':
          description: hub_btstack's status plus ok, running, connected and pairing (docs/API.md 6.1)
          content:
            application/json:
              example:
                backend: btstack
                pid: 1234
                state: connecting
                target: "11:22:33:44:55:66"
                remote: {connected: true, addr: "11:22:33:44:55:66"}
                host: {connected: true, addr: "AA:BB:CC:DD:EE:FF", name: Media Player, pairing: false}
                hosts:
                  - {addr: "AA:BB:CC:DD:EE:01", name: Television, connected: false, paired: true, cid: 2}
                  - {addr: "AA:BB:CC:DD:EE:FF", name: Media Player, connected: true, paired: true, cid: 6}
                ok: true
                running: true
                connected: true
                pairing: false

  /api/bt-pairing:
    post:
      tags:
        - Bluetooth HID
      summary: Trigger Bluetooth HID keyboard pairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable: {type: boolean}
                name: {type: string, default: "Harmony Keyboard"}
                deviceId: {type: string}
              required: [enable, deviceId]
            example:
              enable: true
              name: Harmony Keyboard
              deviceId: "70321456"
      responses:
        '200':
          description: Pairing mode toggled
          content:
            application/json:
              example:
                ok: true
                pairing: true

  /api/bt-connect:
    post:
      tags:
        - Bluetooth HID
      summary: Connect to Bluetooth host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bdaddr: {type: string}
              required: [bdaddr]
            example:
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Connection initiated
          content:
            application/json:
              example:
                ok: true

  /api/bt-disconnect:
    post:
      tags:
        - Bluetooth HID
      summary: Disconnect Bluetooth host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bdaddr: {type: string}
              required: [bdaddr]
            example:
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              example:
                ok: true

  /api/bt-link-device:
    post:
      tags:
        - Bluetooth HID
      summary: Link device profile to Bluetooth MAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                bdaddr: {type: string}
              required: [deviceId, bdaddr]
            example:
              deviceId: "70321456"
              bdaddr: "AA:BB:CC:DD:EE:FF"
      responses:
        '200':
          description: Device linked
          content:
            application/json:
              example:
                ok: true

  /api/remote-status:
    get:
      tags:
        - Bluetooth HID
      summary: BLE remote connection status
      description: Returns connection state of the paired BLE remote (e.g. Homatics B25). Also available under /api/remote-pair-status. When a BLE remote is sleeping, the first button press wakes its radio (showing a red light on B25) and drops; the second button registers after the remote reconnects to the Hub.
      responses:
        '200':
          description: Remote link state
          content:
            application/json:
              example:
                ok: true
                running: true
                connected: true
                bdaddr: "11:22:33:44:55:66"
                name: Homatics B25

  /api/remote-scan:
    post:
      tags:
        - Bluetooth HID
      summary: Scan for BLE remotes
      responses:
        '200':
          description: Scan started
          content:
            application/json:
              example:
                ok: true
                state: scanning
                message: Bluetooth remote scan started

  /api/remote-scan-stop:
    post:
      tags:
        - Bluetooth HID
      summary: Stop scanning for BLE remotes
      description: Halts active BTstack remote discovery scan.
