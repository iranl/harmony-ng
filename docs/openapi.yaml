openapi: 3.1.0
info:
  title: Harmony Hub Control API
  version: 2.0.0
  description: |
    REST and WebSocket API for the open-source **Harmony Hub** firmware and **Elite Remote** RF daemon.
    
    Runs natively on port `8089` on Atheros AR9344 MIPS hardware. Transparently proxies `/api/rf/*` calls to the `hub_rf` daemon on port `8092`.
    
    ### Testing Locally
    Use the **Servers** dropdown or "Try it out" to send requests directly to your Harmony Hub.
    *Default Hub IP*: `harmony.local:8089`
servers:
  - url: http://{hubIp}:8089
    description: Configurable Harmony Hub IP
    variables:
      hubIp:
        default: 192.168.1.100
        description: IP address or hostname of Harmony Hub
  - url: http://harmony.local:8089
    description: Default Hub IP
  - url: http://harmony.local:8089
    description: mDNS Hostname
  - url: http://127.0.0.1:8089
    description: Localhost / SSH Tunnel
tags:
  - name: System & Status
    description: Hub health, system telemetry, diagnostics, and settings
  - name: Activities
    description: Activity state machine, sequences, and orchestrator control
  - name: Devices & Commands
    description: Device inventory, IR/BT key management, and batch operations
  - name: Hardware & IR
    description: Direct IR blasting, Pronto hex transmission, and button pulses
  - name: Bluetooth HID
    description: Bluetooth host pairing, connection management, and BLE remotes
  - name: RF & Elite Remote
    description: CC2544 2.4GHz RF transceiver and Harmony Elite remote management
  - name: Network & MQTT
    description: Wi-Fi, USB Ethernet, and MQTT broker configuration
  - name: Updates & Maintenance
    description: OTA software upgrades and system actions
  - name: Backup & Restore
    description: Configuration bundle export and atomic import
  - name: Authentication & Users
    description: Multi-user RBAC management, session inspection, and user account provisioning
  - name: Custom Icons
    description: Upload, crop, store, and RF-sync custom PNG icons for activities, devices, and commands
  - name: UI Remote Layout
    description: Web and touch UI button mapping and custom layout configuration

paths:
  /health:
    get:
      tags:
        - System & Status
      summary: Health check
      description: Returns service status of hub_daemon.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              example:
                status: ok
                service: hub_daemon

  /api/status:
    get:
      tags:
        - System & Status
      summary: High-level hub status
      description: Returns active activity, state machine status, uptime, and MQTT connection.
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                firmware: 4.15.600
                activity: "-1"
                state: 0
                busy: false
                ip: 192.168.1.100
                total_kb: 5120
                free_kb: 1372
                uptime_sec: 10421
                updating: false
                auth_enabled: false
                role: admin
                user: admin
                mqtt:
                  connected: true
                  host: 192.168.1.50
                  port: 1883
                  base_topic: harmony/hub

  /api/system-info:
    get:
      tags:
        - System & Status
      summary: Linux system telemetry
      description: Returns CPU load, memory usage, uptime, and kernel details.
      responses:
        '200':
          description: System info
          content:
            application/json:
              example:
                uptime: "1d 4h 12m (101520s)"
                load: "0.12 0.08 0.05"
                kernel: "Linux version 3.3.8 (mips Atheros AR9344)"
                memory: "Total: 128 MB, Free: 48 MB (Avail: 72 MB)"
                network: "=== Network Interfaces (/proc/net/dev) ===\n..."

  /api/disk-space:
    get:
      tags:
        - System & Status
      summary: Storage partition status
      responses:
        '200':
          description: Storage partition details
          content:
            application/json:
              example:
                ok: true
                partitions:
                  - mount: /data
                    total_kb: 5120
                    used_kb: 3748
                    free_kb: 1372
                    percent_used: 73

  /api/network-status:
    get:
      tags:
        - Network & MQTT
      summary: Network interfaces and carrier status
      description: Details Ethernet, Wi-Fi, MAC, IP, and default routing interface.
      responses:
        '200':
          description: Network status
          content:
            application/json:
              example:
                ok: true
                usb_host_mode: true
                active_interface: eth0
                connection_type: "Dual (Ethernet Active + Wi-Fi Standby)"
                mode: ethernet
                ip: 192.168.1.100
                netmask: 255.255.255.0
                mac: 02:00:00:00:00:01
                gateway: 192.168.1.1
                eth_present: true
                eth_carrier: true
                eth_interface: eth0
                wifi_connected: true
                wifi_ssid: ExampleSSID

  /api/services:
    get:
      tags:
        - System & Status
      summary: Background daemons status
      responses:
        '200':
          description: Service running states
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true
                rf_running: true
                bt_enabled: true
                bt_running: true

  /api/services/rf-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle CC2544 RF daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
              required: [enable]
            example:
              enable: true
      responses:
        '200':
          description: Service toggled
          content:
            application/json:
              example:
                ok: true
                rf_enabled: true

  /api/services/bt-toggle:
    post:
      tags:
        - System & Status
      summary: Toggle BTstack daemon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
              required: [enable]
            example:
              enable: true
      responses:
        '200':
          description: Service toggled
          content:
            application/json:
              example:
                ok: true
                bt_running: true

  /api/logs:
    get:
      tags:
        - System & Status
      summary: Hub log tail
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [daemon, btstack, rf, system, network]
            default: daemon
          description: Target log stream
      responses:
        '200':
          description: Recent log output
          content:
            application/json:
              example:
                ok: true
                source: daemon
                log: "[INFO] Harmony hub daemon listening on port 8089\n..."

  /api/icons:
    get:
      tags:
        - System & Status
      summary: Available PNG icon names
      responses:
        '200':
          description: Array of icon filenames
          content:
            application/json:
              example:
                - tv.png
                - receiver.png
                - gamepad.png
                - apple_tv.png

  /api/icons/archive:
    get:
      tags:
        - Custom Icons
      summary: Download full icon archive (tar.gz)
      description: Returns compressed tarball containing stock and custom icons (/assets/icons.tar.gz).
      responses:
        '200':
          description: Icons tarball stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary

  /api/custom-icons:
    get:
      tags:
        - Custom Icons
      summary: List custom PNG icons
      description: Returns array of custom uploaded icons stored in /data/harmony/custom_icons.
      responses:
        '200':
          description: Custom icons list
          content:
            application/json:
              example:
                - filename: activity_123456.png
                  url: /assets/icons/activity_123456.png
                  size: 4096
                  type: activity
                  id: "123456"
                - filename: custom_appletv.png
                  url: /assets/icons/custom_appletv.png
                  size: 3200
                  type: custom
                  id: appletv
    post:
      tags:
        - Custom Icons
      summary: Upload custom PNG icon
      description: |
        Uploads base64-encoded PNG image (enforces <= 16 KB size limit) and saves to /data/harmony/custom_icons.
        Automatically notifies hub_rf over local socket (port 8092) to propagate icon to paired Elite remotes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  default: activity
                  description: Target entity type (activity, device, or custom)
                id:
                  type: string
                  description: Entity identifier or icon identifier
                name:
                  type: string
                  description: Optional custom icon name
                image_base64:
                  type: string
                  description: Base64-encoded PNG data (can also be provided as data)
              required: [image_base64]
            example:
              type: activity
              id: "123456"
              name: apple_tv_dark
              image_base64: "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0..."
      responses:
        '200':
          description: Custom icon saved and RF sync triggered
          content:
            application/json:
              example:
                ok: true
                filename: custom_apple_tv_dark.png
                url: /assets/icons/custom_apple_tv_dark.png
                size: 2840
        '400':
          description: Invalid PNG data or missing parameters
        '500':
          description: Flash storage write failure
    delete:
      tags:
        - Custom Icons
      summary: Delete custom PNG icon
      description: Removes custom icon from persistent storage and flash cache.
      parameters:
        - name: filename
          in: query
          required: false
          schema:
            type: string
          example: custom_apple_tv_dark.png
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: activity
      responses:
        '200':
          description: Custom icon deleted
          content:
            application/json:
              example:
                ok: true
                deleted: custom_apple_tv_dark.png
        '400':
          description: Invalid or missing icon identifier

  /api/custom-icons/proxy-fetch:
    get:
      tags:
        - Custom Icons
      summary: Proxy download external image (CORS fallback)
      description: Downloads external HTTP/HTTPS image via wget on the Hub to bypass browser CORS constraints.
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Target external image URL
          example: "https://example.com/logo.png"
      responses:
        '200':
          description: Downloaded image PNG stream
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid URL scheme
        '413':
          description: Image exceeds 2 MB limit
        '502':
          description: External download failed

  /api/auth/me:
    get:
      tags:
        - Authentication & Users
      summary: Get current authenticated session & RBAC status
      description: Returns active username, role (admin or user), and whether HTTP authentication is enabled.
      responses:
        '200':
          description: Session info retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                username: admin
                role: admin

  /api/auth/token:
    post:
      tags:
        - Authentication & Users
      summary: OAuth2 Password Grant / Login
      description: Exchanges username and password credentials for an expiring Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              example:
                ok: true
                access_token: "hht_018f3a9e2c4d8b7a1e5f..."
                token_type: "Bearer"
                expires_in: 86400
                username: admin
                role: admin
        '401':
          description: Invalid username or password

  /api/auth/logout:
    post:
      tags:
        - Authentication & Users
      summary: Session Logout
      description: Invalidates active Bearer session token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              example:
                ok: true
                message: Logged out

  /api/auth/tokens:
    get:
      tags:
        - Authentication & Users
      summary: List Personal Access Tokens (Admin only)
      description: Returns active Personal Access Tokens for third-party home automation integrations.
      security:
        - bearerAuth: []
        - digestAuth: []
        - basicAuth: []
      responses:
        '200':
          description: Token list retrieved
          content:
            application/json:
              example:
                ok: true
                tokens:
                  - id: tok_1a2b3c4d
                    name: "Home Assistant"
                    role: admin
                    created_at: 1729940000
                    last_used_at: 1729950000
    post:
      tags:
        - Authentication & Users
      summary: Generate Personal Access Token (Admin only)
      description: Generates a persistent PAT (`pat_...`). The raw token is returned once upon creation.
      security:
        - bearerAuth: []
        - digestAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Home Assistant
                role:
                  type: string
                  enum: [admin, user]
                  example: admin
      responses:
        '201':
          description: Token created
          content:
            application/json:
              example:
                ok: true
                id: tok_1a2b3c4d
                name: "Home Assistant"
                role: admin
                token: "pat_3f8a9b1c2d4e..."
    delete:
      tags:
        - Authentication & Users
      summary: Revoke Personal Access Token (Admin only)
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
          description: Token ID to revoke
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              example:
                ok: true
                message: Token deleted

  /api/users:
    get:
      tags:
        - Authentication & Users
      summary: List user accounts (Admin only)
      description: Returns all configured local HTTP Basic auth user accounts.
      responses:
        '200':
          description: User accounts retrieved
          content:
            application/json:
              example:
                ok: true
                auth_enabled: true
                users:
                  - username: admin
                    role: admin
                  - username: family
                    role: user
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    post:
      tags:
        - Authentication & Users
      summary: Create or update user account (Admin only)
      description: Adds a new user account or updates password and role of an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
                  default: user
              required: [username]
            example:
              username: family
              password: secretpassword
              role: user
      responses:
        '200':
          description: User account saved
          content:
            application/json:
              example:
                ok: true
                message: User account saved
        '400':
          description: Invalid request or payload error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
    delete:
      tags:
        - Authentication & Users
      summary: Delete user account (Admin only)
      description: Removes a user account. Cannot delete the sole administrator account. Also accepts POST to /api/users/delete.
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Username to delete (can also be passed in JSON body)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
            example:
              username: family
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              example:
                ok: true
                message: User deleted
        '400':
          description: Cannot delete sole admin account or missing username
        '404':
          description: User not found

  /api/settings:
    get:
      tags:
        - System & Status
      summary: Global hub settings
      description: Returns global hub settings. Note that Bluetooth auto-reconnect parameters are configured per-device in /api/inventory.
      responses:
        '200':
          description: Hub configuration
          content:
            application/json:
              example:
                ok: true
                hub_name: Living Room Hub
                dry_run: false
                ntp_server: pool.ntp.org
                timezone: Europe/Amsterdam
                led_mode: always_on
    post:
      tags:
        - System & Status
      summary: Save global hub settings
      description: Updates global hub settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hub_name: {type: string}
                dry_run: {type: boolean}
                ntp_server: {type: string}
                timezone: {type: string}
                led_mode: {type: string}
            example:
              hub_name: Living Room Hub
              dry_run: false
              ntp_server: pool.ntp.org
              timezone: Europe/Amsterdam
              led_mode: always_on
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              example:
                ok: true

  /api/system-action:
    post:
      tags:
        - Updates & Maintenance
      summary: Execute system maintenance action
      description: Reboot the hub, run factory reset, or send raw MQTT messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [reboot, factory_reset, mqtt_publish]
                confirm:
                  type: string
                  description: Required confirmation string ('RESET') for factory_reset
                topic:
                  type: string
                  description: MQTT topic for mqtt_publish action
                payload:
                  type: string
                  description: MQTT payload for mqtt_publish action
                retain:
                  type: boolean
              required: [action]
            examples:
              reboot:
                value: {action: reboot}
              factoryReset:
                value: {action: factory_reset, confirm: RESET}
              mqttPublish:
                value: {action: mqtt_publish, topic: harmony/hub/notify, payload: "{\"event\":\"ready\"}"}
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              example:
                ok: true
                message: Rebooting hub now

  /api/inventory:
    get:
      tags:
        - Devices & Commands
      summary: Get device inventory
      description: Returns configured devices and command profiles.
      responses:
        '200':
          description: Device list
          content:
            application/json:
              example:
                devices:
                  - id: "70321456"
                    name: LG OLED TV
                    type: Television
                    manufacturer: LG
                    model: OLED65C2
                    controlPort: 0
                    mqttTopic: home/livingroom/tv
                    mqttEnabled: true
                    mqttPulse: 100
                    commands:
                      - name: PowerToggle
                        raw: "0000 006d 0022 0002 0155 00aa ..."
                        port: 7
                        repeats: 3

  /api/device-save:
    post:
      tags:
        - Devices & Commands
      summary: Save or update device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                name: {type: string}
                type: {type: string}
                manufacturer: {type: string}
                model: {type: string}
                controlPort: {type: integer}
                mqttTopic: {type: string}
                mqttEnabled: {type: boolean}
                mqttPulse: {type: integer}
                bt_auto_reconnect: {type: boolean, description: "Auto-reconnect Bluetooth device on activity start"}
                bt_reconnect_duration_sec: {type: integer, default: 30, description: "Bluetooth reconnect attempt timeout"}
                bt_reconnect_delay_sec: {type: integer, default: 0, description: "Delay in seconds before attempting Bluetooth reconnection"}
                transport: {type: string, enum: [ir, bt], default: ir}
              required: [deviceId, name]
            example:
              deviceId: "70321456"
              name: LG OLED TV
              type: Television
              manufacturer: LG
              model: OLED65C2
              controlPort: 0
              mqttTopic: home/livingroom/tv
              mqttEnabled: true
              mqttPulse: 100
              bt_auto_reconnect: true
              bt_reconnect_duration_sec: 30
              bt_reconnect_delay_sec: 0
      responses:
        '200':
          description: Device saved
          content:
            application/json:
              example:
                ok: true

  /api/device-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
              required: [deviceId]
            example:
              deviceId: "70321456"
      responses:
        '200':
          description: Device deleted
          content:
            application/json:
              example:
                ok: true

  /api/device-commands:
    get:
      tags:
        - Devices & Commands
      summary: Get all commands for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
          example: "70321456"
      responses:
        '200':
          description: Commands list
          content:
            application/json:
              example:
                ok: true
                commands:
                  - name: PowerToggle
                    raw: "0000 006d 0022 0002 0155 00aa ..."
                    port: 7
                    repeats: 3

  /api/command-save:
    post:
      tags:
        - Devices & Commands
      summary: Save command for device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                name: {type: string}
                raw: {type: string}
                port: {type: integer, default: 7}
                repeats: {type: integer, default: 1}
              required: [deviceId, name, raw]
            example:
              deviceId: "70321456"
              name: VolumeUp
              raw: "0000 006d 0022 0002 0155 00aa ..."
              port: 7
              repeats: 2
      responses:
        '200':
          description: Command saved
          content:
            application/json:
              example:
                ok: true

  /api/command-delete:
    post:
      tags:
        - Devices & Commands
      summary: Delete command from device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                command: {type: string}
              required: [deviceId, command]
            example:
              deviceId: "70321456"
              command: VolumeUp
      responses:
        '200':
          description: Command deleted
          content:
            application/json:
              example:
                ok: true

  /api/commands-batch:
    post:
      tags:
        - Devices & Commands
      summary: Batch import commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                commands:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      raw: {type: string}
                      port: {type: integer}
                      repeats: {type: integer}
                    required: [name, raw]
              required: [deviceId, commands]
            example:
              deviceId: "70321456"
              commands:
                - name: PowerOn
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
                - name: PowerOff
                  raw: "0000 006d ..."
                  port: 7
                  repeats: 3
      responses:
        '200':
          description: Commands imported
          content:
            application/json:
              example:
                ok: true
                count: 2

  /api/device-mqtt-test:
    post:
      tags:
        - Devices & Commands
      summary: Test device MQTT command pulse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: {type: string}
                command: {type: string}
                topic: {type: string}
                pulseMs: {type: integer}
              required: [deviceId]
            example:
              deviceId: "70321456"
              command: PowerToggle
              topic: home/livingroom/tv
              pulseMs: 500
      responses:
        '200':
          description: MQTT publish success
          content:
            application/json:
              example:
                ok: true
                pulseMs: 500
                topic: home/livingroom/tv/command
                message: MQTT test publish sent

  /api/activities:
    get:
      tags:
        - Activities
      summary: List all activities
      responses:
        '200':
          description: Activity list and current state
          content:
            application/json:
              example:
                activities:
                  - id: "123456"
                    name: Watch TV
                    type: Custom
                    icon: tv.png
                    order: 1
                currentId: "-1"
                state: 0

  /api/activity:
    get:
      tags:
        - Activities
      summary: Current activity and state
      responses:
        '200':
          description: Current activity ID and orchestrator state
          content:
            application/json:
              example:
                activity: "-1"
                state: 0
                busy: false
    post:
      tags:
        - Activities
      summary: Start or switch activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity: {type: string}
                dry_run: {type: boolean, default: false}
              required: [activity]
            example:
              activity: "123456"
              dry_run: false
      responses:
        '200':
          description: Transition initiated
          content:
            application/json:
              example:
                success: true
                state: starting
        '409':
          description: Orchestrator is busy transitioning another activity

