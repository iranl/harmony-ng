<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Harmony Remote</title>
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/layout.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/remote.css">
  <link rel="stylesheet" href="/src/css/views.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <div class="hub-title-group">
          <span id="header-hub-name" class="hub-name">Harmony Remote</span>
          <div id="header-status-pill-mount"></div>
        </div>
      </div>
      <div class="header-right">
        <select id="header-lang-select" class="form-select lang-select" style="padding: 4px 8px; font-size: 12px; width: auto;">
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="fr">FR</option>
          <option value="nl">NL</option>
          <option value="es">ES</option>
          <option value="it">IT</option>
        </select>
      </div>
    </header>

    <main id="app-main" class="app-main"></main>

    <nav class="tab-bar">
      <button id="tab-remote" class="tab-btn active" data-tab="remote">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="11" r="1.5"/><path d="M10 16h4"/></svg>
        <span data-i18n="tab_remote">Remote</span>
      </button>
      <button id="tab-devices" class="tab-btn" data-tab="devices">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        <span data-i18n="tab_devices">Devices</span>
      </button>
      <button id="tab-setup" class="tab-btn" data-tab="setup">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="tab_settings">Setup</span>
      </button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
