<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Remote screen preview</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 14px system-ui, sans-serif; background: #15171a; color: #ddd; display: flex; gap: 24px; padding: 24px; }
    canvas { width: 480px; height: 640px; image-rendering: pixelated; border-radius: 12px; background: #000; }
    form { display: grid; grid-template-columns: auto 160px; gap: 8px 12px; align-content: start; }
    #status { grid-column: 1 / 3; color: #8a8f98; }
  </style>
</head>
<body>
  <!-- Development page for the WebAssembly renderer. Serve this directory with a root.tar
       next to it: an uncompressed (ustar) tar of a directory laid out like the remote's
       filesystem. See tools/remote_render/README.md. -->
  <canvas id="screen" width="240" height="320"></canvas>
  <form id="controls">
    <label for="view">View</label>
    <select id="view">
      <option>activities</option><option>commands</option><option>devices</option>
      <option>settings</option><option>sync</option>
    </select>
    <label for="active">Running activity</label><select id="active"></select>
    <label for="select">Selected row</label><input id="select" type="number" min="0" value="0">
    <label for="icons">Icons</label><input id="icons" value="classic">
    <label for="battery">Battery %</label><input id="battery" type="number" min="0" max="100" value="80">
    <label for="usb">USB power</label><input id="usb" type="checkbox">
    <label for="noHub">Hub lost</label><input id="noHub" type="checkbox">
    <label for="time">Time</label><input id="time" type="time" value="21:30">
    <span id="status">Loading…</span>
  </form>
  <script type="module">
    import { loadRenderer, writeTar, readConfig, render } from './remote_preview.js';

    const $ = (id) => document.getElementById(id);
    const module = await loadRenderer();
    const t0 = performance.now();
    const files = writeTar(module, await (await fetch('root.tar')).arrayBuffer());
    const config = readConfig(module);
    $('active').innerHTML = '<option value="">none</option><option value="-1">Power Off</option>' +
      (config?.activities || []).map((a) => `<option value="${a.id}">${a.name}</option>`).join('');

    function state() {
      const [h, m] = $('time').value.split(':').map(Number);
      return {
        view: $('view').value, active: $('active').value, select: Number($('select').value),
        icons: $('icons').value, battery: Number($('battery').value), usb: $('usb').checked,
        charging: $('usb').checked, noHub: $('noHub').checked, minutes: h * 60 + m,
      };
    }
    window.renderPreview = (s) => {
      const r0 = performance.now();
      render(module, $('screen'), { ...state(), ...s });
      return performance.now() - r0;
    };
    $('controls').addEventListener('input', () => {
      const ms = window.renderPreview();
      $('status').textContent = `${files} files loaded in ${Math.round(load)} ms; frame ${ms.toFixed(1)} ms`;
    });
    const load = performance.now() - t0;
    const ms = window.renderPreview();
    $('status').textContent = `${files} files loaded in ${Math.round(load)} ms; frame ${ms.toFixed(1)} ms`;
    window.previewReady = true;
  </script>
</body>
</html>
